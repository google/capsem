[package]
name = "capsem-process"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
capsem-assets = { path = "../capsem-assets" }
capsem-core = { path = "../capsem-core" }
capsem-foundation = { path = "../capsem-foundation" }
capsem-logger = { path = "../capsem-logger" }
capsem-telemetry = { path = "../capsem-telemetry", features = ["export"] }
capsem-proto = { path = "../capsem-proto" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
futures.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
tempfile = "3"
# test-util enables tokio's deterministic paused clock, so a test can prove
# what happens when a bound expires without waiting it out.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8.7"
