http-body-util.workspace = true
http.workspace = true
tower-service.workspace = true
bytes.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
url = "2"

[build-dependencies]
capsem-crypto = { path = "../capsem-crypto" }

[lints]
workspace = true

[dev-dependencies]
