[package]
name = "capsem-mock-server"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "capsem-mock-server"
path = "src/main.rs"

[dependencies]
capsem-crypto = { path = "../capsem-crypto", default-features = false, features = ["tls"] }
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
capsem-telemetry = { path = "../capsem-telemetry", features = ["export"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
capsem-guard = { path = "../capsem-guard" }
clap.workspace = true
flate2 = "1"
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["parsing"] }
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile = "3"

[lints]
workspace = true
