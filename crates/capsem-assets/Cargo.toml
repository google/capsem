[package]
name = "capsem-assets"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Asset manifests, verification, compatibility, and resolution for Capsem."
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
capsem-crypto = { path = "../capsem-crypto" }
anyhow = { workspace = true }
capsem-foundation = { path = "../capsem-foundation" }
futures = { workspace = true }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
reqwest = { workspace = true }
tempfile = "3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
