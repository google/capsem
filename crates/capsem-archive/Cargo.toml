[package]
name = "capsem-archive"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3 = "1"
capsem-foundation = { path = "../capsem-foundation" }
# Pure Rust only. flate2's default backend already is miniz_oxide, but a
# default is a thing that can change under us, and this crate sits in front of
# attacker-influenced bytes: `tests/citadel/test_runtime_native_dependencies.py`
# fails the build the day a C zlib appears in the runtime closure.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
