[package]
name = "capsem-service"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
capsem-api = { path = "../capsem-api" }
capsem-assets = { path = "../capsem-assets" }
capsem-core = { path = "../capsem-core" }
capsem-foundation = { path = "../capsem-foundation" }
capsem-guard = { path = "../capsem-guard" }
capsem-logger = { path = "../capsem-logger" }
capsem-telemetry = { path = "../capsem-telemetry", features = ["export"] }
capsem-proto = { path = "../capsem-proto" }
capsem-router = { path = "../capsem-router" }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
humantime.workspace = true
clap.workspace = true
tokio-stream.workspace = true
futures.workspace = true
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["trace"] }
rand = "0.8"
base64.workspace = true
reqwest.workspace = true
blake3 = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics", "testing"] }
tokio-tungstenite = "0.29.0"
capsem-config = { path = "../capsem-config" }
tempfile = "3"
filetime = "0.2"
tower = { version = "0.5", features = ["util"] }
rusqlite = { workspace = true }
