[package]
name = "capsem-foundation"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Dependency-light host foundations shared by Capsem binaries."
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["runtime"]
runtime = [
    "dep:blake3",
    "dep:capsem-proto",
    "dep:nix",
    "dep:rmp-serde",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
]

[dependencies]
blake3 = { version = "1", optional = true }
capsem-proto = { path = "../capsem-proto", optional = true }
libc = "0.2"
nix = { version = "0.29", features = ["dir", "fs", "process", "signal", "socket", "user"], optional = true }
rmp-serde = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
