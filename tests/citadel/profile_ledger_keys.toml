# Every key path a published profile.toml may use: those the profile ledgers
# carried at Capsem 0.6.3, the oldest binary still updating itself. Its
# updater stages a new release's profiles and parses them with
# deny_unknown_fields before installing the new binary, so a key it does not
# know fails every automatic update from it. `default_for` did that to
# the next release. Add a path here only when every binary on the update path parses
# it -- for a struct field that means after the updater lets the new binary
# validate staged profiles (see tests/citadel/test_profile_ledger_stays_stageable.py).

oldest_stager = "0.6.3"

keys = [
  "assets.arch.arm64.initrd.name",
  "assets.arch.arm64.initrd.url",
  "assets.arch.arm64.kernel.name",
  "assets.arch.arm64.kernel.url",
  "assets.arch.arm64.rootfs.name",
  "assets.arch.arm64.rootfs.url",
  "assets.arch.x86_64.initrd.name",
  "assets.arch.x86_64.initrd.url",
  "assets.arch.x86_64.kernel.name",
  "assets.arch.x86_64.kernel.url",
  "assets.arch.x86_64.rootfs.name",
  "assets.arch.x86_64.rootfs.url",
  "assets.format",
  "assets.refresh_policy",
  "availability.mobile",
  "availability.shell",
  "availability.web",
  "description",
  "files.apt_packages.path",
  "files.build.path",
  "files.detection.path",
  "files.enforcement.path",
  "files.mcp.path",
  "files.npm_package_lock.path",
  "files.npm_packages.path",
  "files.python_requirements.path",
  "files.python_requirements_lock.path",
  "files.root_manifest.path",
  "files.tips.path",
  "icon_svg",
  "id",
  "mcp.health_check_interval_secs",
  "mcp.server_enabled.local",
  "mcp.servers",
  "name",
  "plugins.credential_broker.detection_level",
