# Exact reviewed source uses. Additions/growth require a concrete documented contract.
# Retired event hashes, internal JSON cache keys and duplicate client body hashing are not approved.
[reasons]
oci-and-owned-cache = "OCI platform/config documents require external JSON. The same cache owner streams current persisted JSON metadata into bounded XXH3 checks without a temporary document; neither path converts runtime binary envelopes to JSON."
hash-mixed-oci-cache = "Fetched OCI content retains protocol-required SHA-256 verification. Repository namespace lookup uses full XXH3-128 and never authorizes cached bytes; exact lowercase current name shapes determine ownership."
http = "The public OpenAPI HTTP API and its generated SDK use JSON request/response documents; conversion belongs at this boundary, never in binary forwarding."
mcp = "External MCP servers and clients require JSON-RPC payloads, tool input schemas and arbitrary structured tool results; preserve that external contract."
oci = "OCI Distribution manifests, indexes and image metadata are JSON documents whose exact bytes and content addresses are defined by the external OCI contract."
release = "Release channel manifests and package metadata are published JSON documents consumed by existing installers and release verification tooling."
provider = "Intercepted Anthropic, OpenAI and Google provider requests and streaming responses have externally specified JSON payloads; inspect only necessary fields."
benchmark = "The benchmark collector subprocess contract and persisted benchmark recordings use JSON documents; these are measurement boundaries, not VM data forwarding."
config = "User and corporate configuration tooling exposes schema, lint, metadata and settings documents as JSON for its public configuration interfaces."
durable = "Existing persisted management records, receipt files and replay inputs use JSON; changing them requires an explicit current format and regeneration of owned fixtures, not an internal transport shortcut."
credentials = "OAuth/OIDC endpoint responses and existing durable credential metadata use JSON; token verification/storage compatibility requires preserving their specified shapes."
container = "OCI runtime configuration and seccomp profile documents consumed by runc are JSON; this is the external container-runtime format."
forensic = "Security rule definitions and forensic records have existing JSON export/storage contracts; archive transport stays binary and must not hash or size their JSON envelope."
db-json = "Existing columnar query results, externally exposed forensic records and SQL-query tools use JSON. The DB-to-ledger query adapter still parses that historical result format; this is existing representation debt, not approval for new internal JSON round trips. Query cache keys are typed, and DB freshness stays DB-owned."
logging = "Structured JSON log and diagnostic export formats are consumed by existing operator tooling; do not serialize or copy binary terminal/graphical payloads into logs."
stream-fixture = "The checked-in stream specification exports golden JSON fixtures for cross-language interoperability tests; runtime stream frames remain MessagePack."
hash-asset = "Downloaded VM assets and release artifacts are checked against manifest digests before use; the published digest is the integrity reference, not runtime event data."
hash-oci = "OCI blob, manifest and configuration identities are SHA-256 content addresses required by the OCI registry contract and verified against fetched bytes."
hash-archive = "Storage owners use XXH3-128 for current archive corruption checks, body-index span identities, deduplication and WARC block digests. Obsolete formats are refused, owned fixtures are regenerated, and no producer event commitment is justified by this storage contract."
hash-oauth = "OAuth PKCE S256 challenges and OIDC identity validation require SHA-256 by the external authentication protocol."
hash-identity = "A stable bounded name or protocol identity is derived from existing path/configuration bytes for reuse across processes and restarts; this is compatibility, not event tamper proof."
hash-capability = "The managed-session capability digest is compared with a presented secret capability at the service boundary; retaining only its digest avoids storing that secret as authority."
hash-credential-ref = "A credential correlation identifier must be stable without exposing the raw credential to logs and telemetry; its digest is a redacted identity, not proof of event integrity."
hash-tool-definition = "Approved MCP tool definitions are pinned with persisted BLAKE3 digests. Discovery compares them to reject changed descriptions/input schemas under the same tool name; this is a trusted security-policy reference, not a non-security cache key."
hash-policy = "Policy snapshots and provisioned corporate config expose persistent content identities so reload, audit and version decisions refer to exact configured bytes."
hash-model-item = "Model-item content references identify repeated stored content in the ledger; these are storage references and dedup identities, not admission commitments."
hash-support = "Support-bundle file fingerprints identify the exact collected evidence for diagnostic comparison; they are computed only during an explicit support export."
hash-implementation = "The approved crypto owner implements and tests accelerated hashing and external artifact verification; application callers must document their separate purpose."
hash-removal-journal = "Current cache receipt generations, removal witness tokens and compact journal checksums use streamed XXH3-128 over their actual bounded persisted JSON. These detect changed facts/corruption, not authority. Allocation-probe XXH3 bytes avoid filesystem compression underbilling; old record versions are refused."
hash-mixed-package = "Release package contents retain published SHA-256/BLAKE3 verification against trusted manifests. Only disposable extraction-directory path fingerprints use XXH3-128; they do not authorize a package or replace content verification."
hash-mixed-asset-cache = "Actual VM content verification retains BLAKE3 against the trusted asset digest; XXH3-128 only selects a cache filename from its path. Cache-entry metadata and the expected security digest are still checked before reuse."

