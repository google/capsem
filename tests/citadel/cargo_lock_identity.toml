reason = "User-requested capsem-crypto extraction and all-Rust retrofit: first-party hashes, entropy, TLS keys, JWT verification and secret primitives use the owned crate; BLAKE2b/BLAKE2s SIMD 1.0.5 support comparisons in the normal benchmark harness. Existing registry versions and workspace 0.7.0 remain unchanged; unused rand_chacha 0.3.1 retired. The approved managed-session API adds capsem-api -> capsem-crypto secrets for zeroizing request capabilities, with no new registry package/version."
