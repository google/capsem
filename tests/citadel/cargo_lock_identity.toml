reason = "The maintainer-approved release retains pinned alacritty_terminal0.26.0/vte checkpoint patches, xxhash-rust0.8.19 and the existing url2.5.8 validator. PR372 integration adds existing capsem-foundation, tempfile and tracing-subscriber edges, plus existing rmp-serde for the private named MessagePack environment handoff. SDK WebSockets use webpki roots; native certificate loader packages leave the graph and webpki-roots0.26.11 comes from the reviewed security parent. Every upstream identity/checksum is present in a parent lock. Rebuild and qualify the combined host and guest cohort. Tokio 1.53.3 fixes RUSTSEC-2026-0386; no unrelated dependency versions or edges change. Normalized HTTP lifecycle telemetry adds only already locked axum0.8.9, http-body, tracing and test futures/tower/http-body-util/tracing-subscriber dependency edges to capsem-telemetry. No upstream package identity/version/checksum changed; the next matching guest/host cohort must rebuild from this deliberate graph. Gateway HTTP OTLP admission adds only already locked opentelemetry-proto0.33.0 and prost0.14.4 edges; no new upstream identity/checksum, and the next cohort must rebuild. Collector transport tests reuse already locked Tokio through a telemetry dev edge; upstream identities remain exact."
