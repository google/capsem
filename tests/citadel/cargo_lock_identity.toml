reason = "The unified observable cache adds quick_cache 0.7.0. The 0.7 crypto ownership retrofit centralizes first-party hashes, entropy, TLS keys, JWT verification and secret primitives; BLAKE2b/BLAKE2s SIMD 1.0.5 support normal-harness comparisons. Managed-session APIs add zeroizing request capabilities, and Rust managed scopes add SDK edges to existing capsem-crypto random/secrets, futures, humantime and tokio-util rt. Central runtime-limit generation adds capsem-proto's direct toml edge, and exact benchmark reporting adds capsem-bench's direct capsem-proto edge. rustls 0.23.46 fixes RUSTSEC-2026-0346, RUSTSEC-2026-0347, RUSTSEC-2026-0348 and RUSTSEC-2026-0349. The host and sealed guest cohort will be rebuilt and qualified together."
