reason = "Approved connection/session-grant integration on 2026-10-14 deliberately adds capsem-api, humantime and UUID parsing edges to the credential-owned broker controller, reusing existing locked packages without registry upgrades. API DTOs remain the one wire authority, UUID generation remains in capsem-crypto, and timestamp formatting reuses humantime. No owned-client product configuration or native-vendor credential substitution is activated. Prior approved safe-Rust Sigma YAML migration (serde-saphyr), crypto extraction, normal BLAKE2 comparisons and managed SDK edges remain intact. The lock and corresponding guest builder identity intentionally move once for this dependency batch."
