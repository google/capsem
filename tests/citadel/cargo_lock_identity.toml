# The intentionally selected Cargo.lock for this tree, recorded on purpose.
#
# A lock change is the most expensive input in the repository: it changes the
# identity of the guest Rust builder image, so every guest agent is recompiled
# inside Docker, the initrd is repacked, and every host binary rebuilds. Four
# measurement runs in one evening paid that cost because unrelated commits
# each moved the lock. `test_cargo_lock_changes_are_deliberate` fails until
# this record matches the lock again, so the cost is chosen, reviewed and
# batched rather than discovered twenty minutes into a gate.
sha256 = "fa39c45c6c2e1ce7497a11eec092df9e48a1f917cbef4abf9337bdd3eead56e3"
reason = "User-requested capsem-crypto extraction and all-Rust retrofit: first-party hashes, entropy, TLS keys, JWT verification and secret primitives now depend on the owned crate; BLAKE2b/BLAKE2s SIMD 1.0.5 support the requested SHA/BLAKE comparison in the normal benchmark harness. Bounded held-reader verification is shared with the guest. Existing registry versions and workspace 0.7.0 remain unchanged; unused rand_chacha 0.3.1 retired. This records the intentional bf9dbb25f..1448ed6bd lock changes without moving dependencies."
