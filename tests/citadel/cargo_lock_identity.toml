reason = "capsem-logger takes sha2 as a dev-dependency so the session-fixture regenerator can check its own output against the sha256 recorded in tests/citadel/fixture_ownership.toml, and fail at the moment the bytes change rather than in a citadel run afterwards. One edge: sha2 0.10 was already in the lock for capsem, capsem-admin and capsem-assets, so no package is resolved that was not resolved before and no runtime crate is touched -- the diff is the single line adding sha2 to capsem-logger's dependency list. The preceding record was the host fs-monitor dropping notify."
