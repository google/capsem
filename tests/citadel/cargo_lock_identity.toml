reason = "capsem-mcp-builtin drops its capsem-logger dependency: capsem-process is the one writer of a session ledger, and the builtin now hands its ledger records back on its tool results instead of opening a second writer that the body archive cannot survive. One line of lock, removing capsem-logger from the builtin's dependency list; capsem-logger stays resolved for every other crate, so no package leaves or enters the lock. The preceding record: capsem-logger takes flate2 as a dev-dependency, so its WARC export tests read the file back member by member the way an external tool does rather than through the writer that produced it. Two lines of lock in total with the entry below, both dependency-list edits against a package already resolved. Before that: capsem-archive takes flate2 so a session's archived bodies can be exported as a WARC 1.1 file, which is gzip-member framed and therefore needs a gzip encoder rather than the raw deflate miniz_oxide gives the block format. flate2 1.1.9 was already resolved in the lock for capsem, capsem-core, capsem-admin and capsem-mock-server, and it resolves to crc32fast and miniz_oxide only, so no package is resolved that was not resolved before -- the diff is the single line adding flate2 to capsem-archive's dependency list. It is taken with default-features = false and the rust_backend feature: the default backend already is miniz_oxide, but capsem-archive is a runtime crate sitting in front of attacker-influenced bytes, and pinning the backend means a future change to flate2's defaults cannot quietly put a C zlib there. The preceding record was capsem-logger taking sha2 as a dev-dependency for the session-fixture regenerator."
