# The Cargo.lock this tree was last qualified with, recorded on purpose.
#
# A lock change is the most expensive input in the repository: it changes the
# identity of the guest Rust builder image, so every guest agent is recompiled
# inside Docker, the initrd is repacked, and every host binary rebuilds. Four
# measurement runs in one evening paid that cost because unrelated commits
# each moved the lock. `test_cargo_lock_changes_are_deliberate` fails until
# this record matches the lock again, so the cost is chosen, reviewed and
# batched rather than discovered twenty minutes into a gate.
sha256 = "817502e6dd42ba86849e04bd0ef6d2cd93656a0a5556d5b738e3e86ed9d585e8"
reason = "capsem-archive takes flate2 so a session's archived bodies can be exported as a WARC 1.1 file, which is gzip-member framed and therefore needs a gzip encoder rather than the raw deflate miniz_oxide gives the block format. flate2 1.1.9 was already resolved in the lock for capsem, capsem-core, capsem-admin and capsem-mock-server, and it resolves to crc32fast and miniz_oxide only, so no package is resolved that was not resolved before -- the diff is the single line adding flate2 to capsem-archive's dependency list. It is taken with default-features = false and the rust_backend feature: the default backend already is miniz_oxide, but capsem-archive is a runtime crate sitting in front of attacker-influenced bytes, and pinning the backend means a future change to flate2's defaults cannot quietly put a C zlib there. The preceding record was capsem-logger taking sha2 as a dev-dependency for the session-fixture regenerator."
