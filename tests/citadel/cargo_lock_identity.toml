# The Cargo.lock this tree was last qualified with, recorded on purpose.
#
# A lock change is the most expensive input in the repository: it changes the
# identity of the guest Rust builder image, so every guest agent is recompiled
# inside Docker, the initrd is repacked, and every host binary rebuilds. Four
# measurement runs in one evening paid that cost because unrelated commits
# each moved the lock. `test_cargo_lock_changes_are_deliberate` fails until
# this record matches the lock again, so the cost is chosen, reviewed and
# batched rather than discovered twenty minutes into a gate.
