version = 1

# This is the transition join table. `current` classifies every tracked path;
# `targets` is the approved final layout. Evidence names are deliberately
# concrete so a move cannot erase its checker while keeping a vague owner.

[[surface]]
id = "repository-metadata"
state = "retained"
current = [".dockerignore", ".gitignore", "AGENTS.md", "CHANGELOG.md", "CITATION.cff", "CLAUDE.md", "CONTRIBUTING.md", "Cargo.lock", "Cargo.toml", "GEMINI.md", "LATEST_RELEASE.md", "LICENSE", "README.md", "RELEASE.md", "SECURITY.md", "bootstrap.sh", "codecov.yml", "justfile", "rust-toolchain.toml", "test-dev-null.sh"]
targets = ["<root-files>"]
lint = ["fast.audit.source-syntax", "fast.audit.markdown", "fast.audit.shell", "fast.citadel"]
tests = ["tests/citadel/test_repository_root_ownership.py", "build_system/tests/release/test_release_contract_architecture.py"]
ci = ["fast-gate", "test-linux", "test", "test-install", "docs-build", "site-build", "release-site-build", "pr-gate"]
coverage = "not-applicable: repository contracts are source guards, not executable product code"
debt = "tests/citadel/repository_path_debt.toml"
reason = "Conventional root files remain authoritative and are checked by content type."

