name: Release runtime preflight

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      bootstrap_missing_first_party:
        required: false
        type: boolean
        default: false
      source_commit:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify the public runtime graph
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - name: Select fresh manifest-authorized runtime graph
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --channel "${{ inputs.channel }}"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${{ inputs.bootstrap_missing_first_party }}" == "true" ]]; then
            args+=(--bootstrap-missing-first-party)
          fi
          python3 build_system/scripts/bootstrap/select-runtime-preflight-manifest.py "${args[@]}"

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: ./.github/actions/rust-cache
        with:
          key: runtime-preflight

      # Both serialized release lanes retain this fail-fast proof of the
      # currently public runtime graph before constructing a candidate.
      - name: Check the live release graph with the release command
        env:
          PREFLIGHT_MANIFEST_URL: ${{ steps.manifest.outputs.manifest-url }}
        run: |
          set -euo pipefail
          mkdir -p cache/target/runtime-preflight
          curl -fsSL "$PREFLIGHT_MANIFEST_URL" -o cache/target/runtime-preflight/manifest.json
          cargo run -p capsem-admin -- manifest check cache/target/runtime-preflight/manifest.json
