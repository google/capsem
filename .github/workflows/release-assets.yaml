name: Release VM Assets
run-name: Release runtime ${{ inputs.channel }} ${{ inputs.dispatch_id }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Asset channel to publish.
        required: true
        type: choice
        options:
          - stable
          - nightly
      dispatch_id:
        description: Correlation id supplied by capsem-admin.
        required: true
      dry_run:
        description: Build and validate without deploying release.capsem.org.
        required: true
        type: boolean
        default: true
      source_commit:
        description: Exact committed main source qualified by the release gate.
        required: true
        type: string

concurrency:
  group: capsem-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  ASSET_MANIFEST_URL: https://release.capsem.org/assets/${{ inputs.channel }}/manifest.json

jobs:
  source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Require exact immutable dispatch source
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/capsem-source-$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

  runtime-preflight:
    needs: source-identity
    uses: ./.github/workflows/release-runtime-preflight.yaml
    with:
      channel: ${{ inputs.channel }}
      bootstrap_missing_first_party: true
      source_commit: ${{ inputs.source_commit }}

  fast-gate:
    needs: source-identity
    uses: ./.github/workflows/fast-gate.yaml
    with:
      source_commit: ${{ inputs.source_commit }}

  # Everything that decides whether this commit's runtime is released at all
  # runs before any image is built: a runtime revision is per commit, so a
  # channel whose source manifest already carries it has nothing to build.
  resolve-current-binary:
    needs: runtime-preflight
    runs-on: ubuntu-latest
    name: Resolve current channel binary
    outputs:
      functional_ready: ${{ steps.functional-cohort.outputs.functional-ready }}
      baseline_channel: ${{ steps.public-before.outputs.manifest-channel }}
      runtime_revision: ${{ steps.selection.outputs.runtime_revision }}
      publication_identity: ${{ steps.selection.outputs.publication_identity }}
      release_needed: ${{ steps.runtime-delta.outputs.release_needed }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: ./.github/actions/rust-cache
        with:
          key: runtime-release-selection
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - name: Select exact public-before manifest
        id: public-before
        run: |
          python3 build_system/scripts/bootstrap/select-runtime-preflight-manifest.py \
            --channel "stable" \
            --bootstrap-missing-first-party \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate the runtime release through capsem-admin
        id: selection
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mkdir -p cache/target
          cargo run -p capsem-admin -- validate \
            --channel "$RELEASE_CHANNEL" \
            --source-commit "$SOURCE_COMMIT" \
            --json > cache/target/runtime-release-selection.json
          selection=cache/target/runtime-release-selection.json
          echo "runtime_revision=$(jq -er .runtime_revision "$selection")" >> "$GITHUB_OUTPUT"
          echo "publication_identity=$(jq -er .publication_identity "$selection")" >> "$GITHUB_OUTPUT"

      - name: Fetch latest selected channel source manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 build_system/scripts/release/fetch-channel-source-manifest.py \
            --channel "$RELEASE_CHANNEL" \
            --source-commit "$SOURCE_COMMIT" \
            --bootstrap-missing-first-party \
            --output cache/target/channel-source/manifest.json

      - name: Check whether this commit's runtime is already authored
        id: runtime-delta
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RUNTIME_REVISION: ${{ steps.selection.outputs.runtime_revision }}
        run: |
          uv run --project build_system --frozen python build_system/scripts/release/check-runtime-release-delta.py \
            --source-manifest cache/target/channel-source/manifest.json \
            --channel "$RELEASE_CHANNEL" \
            --runtime-revision "$RUNTIME_REVISION" \
            --json-output cache/target/runtime-release-delta/delta.json

      - name: Project inactive first-channel public-before state
        if: ${{ steps.public-before.outputs.bootstrap == 'true' }}
        env:
          PUBLIC_BEFORE_BOOTSTRAP: ${{ steps.public-before.outputs.bootstrap }}
          PUBLIC_BEFORE_RETIRED: ${{ steps.public-before.outputs.retired }}
        run: |
          python3 build_system/scripts/release/project-first-channel-before.py \
            --source-manifest cache/target/channel-source/manifest.json \
            --channel "stable" \
            --bootstrap "$PUBLIC_BEFORE_BOOTSTRAP" \
            --retired "$PUBLIC_BEFORE_RETIRED" \
            --output cache/target/channel-source/public-before.json

      - name: Select public-before authority for exact pairing
        id: public-before-authority
        env:
          PUBLIC_BEFORE_BOOTSTRAP: ${{ steps.public-before.outputs.bootstrap }}
          PUBLIC_BEFORE_MANIFEST_URL: ${{ steps.public-before.outputs.manifest-url }}
        run: |
          if [[ "$PUBLIC_BEFORE_BOOTSTRAP" == "true" ]]; then
            echo "manifest-url=file://$PWD/cache/target/channel-source/public-before.json" \
              >> "$GITHUB_OUTPUT"
          else
            echo "manifest-url=$PUBLIC_BEFORE_MANIFEST_URL" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch exact deployed public-before package
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: ${{ steps.public-before-authority.outputs.manifest-url }}
          allow-empty-packages: ${{ steps.public-before.outputs.bootstrap }}
          kind: packages
          output: cache/target/runtime-public-before/packages

      - name: Check pulled package functional binary cohort
        id: functional-cohort
        run: |
          uv run --project build_system --frozen python build_system/scripts/release/stage-release-test-inputs.py \
            --input-dir cache/target/runtime-public-before/packages \
            --check-functional-cohort \
            --github-output "$GITHUB_OUTPUT"

      # A channel that has published no runtime yet has none to pull. That is
      # the only empty set accepted: a runtime the manifest names
      # must still resolve every one of its artifacts.
      - name: Fetch exact deployed public-before runtime
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: ${{ steps.public-before-authority.outputs.manifest-url }}
          allow-empty-runtime: true
          kind: runtime
          architecture: x86_64
          output: cache/target/runtime-public-before/runtime

      - name: Prove public-before cohorts use one manifest
        run: |
          uv run --project build_system --frozen python build_system/scripts/release/verify-release-inputs.py \
            --input-dir cache/target/runtime-public-before/runtime
          cmp \
            cache/target/runtime-public-before/packages/manifest.json \
            cache/target/runtime-public-before/runtime/manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-public-before-packages
          path: cache/target/runtime-public-before/packages/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-public-before-runtime
          path: cache/target/runtime-public-before/runtime/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-channel-source
          path: cache/target/channel-source/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-release-selection
          path: cache/target/runtime-release-selection.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-release-delta
          path: cache/target/runtime-release-delta/

  cloudflare-release-site-preflight:
    runs-on: ubuntu-latest
    name: Cloudflare release site preflight
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
      RELEASE_CHANNEL_PROJECT: release
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - name: Verify Cloudflare Pages project for live publish
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: skipping Cloudflare Pages project preflight."
            exit 0
          fi
          python build_system/scripts/web/check-cloudflare-pages-project.py \
            --project "$RELEASE_CHANNEL_PROJECT"

  build-assets:
    needs: [cloudflare-release-site-preflight, resolve-current-binary, fast-gate]
    if: ${{ needs.resolve-current-binary.outputs.release_needed == 'true' }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
          - arch: x86_64
            runner: ubuntu-24.04
            rust-target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    name: Build VM assets (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Bootstrap complete asset build host
        env:
          CAPSEM_SKIP_ASSET_CHECK: "1"
        run: sh bootstrap.sh --yes

      - name: Build VM assets (kernel + rootfs)
        env:
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          just build-assets "$ASSET_ARCH"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vm-assets-${{ matrix.arch }}
          path: cache/target/assets/${{ matrix.arch }}/

  test-runtime-pairing:
    needs: [author-runtime-release, resolve-current-binary]
    runs-on: ubuntu-24.04
    name: Complete runtime pairing gate
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/app/pnpm-lock.yaml
            build_system/release_site/pnpm-lock.yaml
            sdk/typescript/pnpm-lock.yaml
            mcp/typescript/pnpm-lock.yaml
      # The functional suites run with no network, and they drive every SDK and
      # pack the npm MCP, so each one's locked dependencies are materialized here.
      - name: Install shared functional web and SDK dependencies
        run: |
          (cd web/app && pnpm install --frozen-lockfile)
          (cd build_system/release_site && pnpm install --frozen-lockfile)
          (cd sdk/typescript && pnpm install --frozen-lockfile)
          (cd mcp/typescript && pnpm install --frozen-lockfile)
          uv sync --project sdk/python --frozen --no-install-project
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: llvm-tools
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Select the declared tool set
        id: gate_tools
        run: |
          list=$(python3 build_system/scripts/ci/gate-tool-list.py --sets functional)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install pinned functional test runner
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: ${{ steps.gate_tools.outputs.list }}

      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl bubblewrap kmod udev

      - name: Prove Linux sandbox boundary
        run: python3 build_system/scripts/bootstrap/prepare-linux-sandbox.py --repair-hosted-runner

      - name: Materialize locked Rust dependencies
        run: |
          cargo fetch --locked

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-public-before-packages
          path: cache/target/runtime-public-before/packages/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-public-before-runtime
          path: cache/target/runtime-public-before/runtime/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authored-runtime-channel-source
          path: cache/target/source-channel/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authored-runtime-publication
          path: cache/target/asset-release/

      - name: Enable KVM for complete functional proof
        run: |
          set -euo pipefail
          sudo bash build_system/packaging/shared/install-vm-device-access "$USER" build_system/packaging/linux/99-capsem-vm-devices.rules

      - name: Prepare exact runtime and pulled binary pairing
        env:
          PUBLICATION_IDENTITY: ${{ needs.author-runtime-release.outputs.publication_identity }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_BASELINE_CHANNEL: ${{ needs.resolve-current-binary.outputs.baseline_channel }}
          ACTIVATION_READY: ${{ needs.author-runtime-release.outputs.activation_ready }}
        run: bash build_system/scripts/release/stage-runtime-pairing.sh

      # A channel with no package cohort yet proves the runtime alone. Which
      # shape that is belongs to the lane, so the flag is passed rather than
      # branched on here.
      - name: Qualify the runtime assets
        env:
          ACTIVATION_READY: ${{ needs.author-runtime-release.outputs.activation_ready }}
        run: >
          just qualify-assets
          "$PWD/cache/target/candidate-runtime-inputs"
          "$PWD"
          "$ACTIVATION_READY"

      - name: Record deferred runtime staging boundary
        if: ${{ needs.author-runtime-release.outputs.activation_ready != 'true' }}
        env:
          FUNCTIONAL_READY: ${{ needs.author-runtime-release.outputs.functional_ready }}
          PRODUCT_COMPATIBLE: ${{ needs.author-runtime-release.outputs.product_compatible }}
        run: |
          set -euo pipefail
          [[ "$PRODUCT_COMPATIBLE" == "true" || "$PRODUCT_COMPATIBLE" == "false" ]]
          [[ "$FUNCTIONAL_READY" == "true" || "$FUNCTIONAL_READY" == "false" ]]
          [[ "$PRODUCT_COMPATIBLE" != "true" || "$FUNCTIONAL_READY" != "true" ]]
          echo "::notice::Runtime assets passed static, integrity, isolation, and x86_64 KVM boot gates."
          if [[ "$PRODUCT_COMPATIBLE" == "false" ]]; then
            echo "::notice::The manifest-selected binary is outside this runtime's declared compatibility range."
          fi
          if [[ "$FUNCTIONAL_READY" == "false" ]]; then
            echo "::notice::The pulled package does not contain the complete functional release binary cohort."
          fi
          echo "::notice::An activation-ready runtime cannot defer complete pairing gates."
          echo "::notice::Functional and glow-up gates are deferred to release-binaries; public activation remains blocked."

  author-runtime-release:
    needs: [build-assets, resolve-current-binary]
    runs-on: ubuntu-latest
    name: Author the runtime release
    outputs:
      product_compatible: ${{ steps.author-release.outputs.product_compatible }}
      functional_ready: ${{ needs.resolve-current-binary.outputs.functional_ready }}
      activation_ready: ${{ steps.author-release.outputs.activation_ready }}
      publication_identity: ${{ needs.resolve-current-binary.outputs.publication_identity }}
    env:
      CHANNEL: ${{ inputs.channel }}
      PUBLICATION_IDENTITY: ${{ needs.resolve-current-binary.outputs.publication_identity }}
      RUNTIME_REVISION: ${{ needs.resolve-current-binary.outputs.runtime_revision }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: build_system/release_site/pnpm-lock.yaml
      - name: Install release site dependencies
        run: cd build_system/release_site && pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: ./.github/actions/rust-cache

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vm-assets-arm64
          path: cache/target/assets/arm64/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vm-assets-x86_64
          path: cache/target/assets/x86_64/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: runtime-channel-source
          path: cache/target/source-channel/

      # The revision is this commit's own identity, so a re-release of an
      # unchanged workspace version never collides with an earlier one.
      - name: Generate asset manifest
        run: |
          cargo run -p capsem-admin -- manifest generate cache/target/assets \
            --version "$RUNTIME_REVISION"

      - name: Verify runtime release lane policy
        run: |
          uv run --project build_system --frozen pytest \
            tests/capsem-release/test_runtime_lane_gate.py \
            tests/capsem-release/test_release_lane_diff_policy.py -q

      - name: Build complete asset channel preview
        run: |
          ASSET_BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$PUBLICATION_IDENTITY"
          MANIFEST_VERSION=$(jq -er .version cache/target/source-channel/manifest.json)
          uv run --project build_system --frozen python build_system/scripts/release/build-complete-release-channel.py \
            --channel-source "$CHANNEL=file://$PWD/cache/target/assets/manifest.json" \
            --primary-channel "$CHANNEL" \
            --assets-dir cache/target/assets \
            --asset-source-base "$ASSET_BASE" \
            --manifest-version "$MANIFEST_VERSION" \
            --out-dir cache/target/runtime-candidate \
            --allow-mirror-missing

      - name: Author the runtime in the channel source manifest
        id: author-release
        env:
          FUNCTIONAL_READY: ${{ needs.resolve-current-binary.outputs.functional_ready }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(jq -er .version cache/target/source-channel/manifest.json)
          cargo run -p capsem-admin -- release \
            --channel "$CHANNEL" --source-commit "$SOURCE_COMMIT" \
            --manifest-path cache/target/source-channel/manifest.json \
            --candidate-manifest "cache/target/runtime-candidate/assets/$CHANNEL/manifest.json" \
            --publication-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$PUBLICATION_IDENTITY" \
            --manifest-version "$MANIFEST_VERSION" \
            --runtime-revision "$RUNTIME_REVISION" \
            --json > cache/target/runtime-release.json
          test "$(jq -er .publication_identity cache/target/runtime-release.json)" = "$PUBLICATION_IDENTITY"
          PRODUCT_COMPATIBLE=$(jq -er .compatible_with_current_binary cache/target/runtime-release.json)
          ACTIVATION_READY=false
          if [[ "$PRODUCT_COMPATIBLE" == "true" && "$FUNCTIONAL_READY" == "true" ]]; then
            ACTIVATION_READY=true
          fi
          echo "product_compatible=$PRODUCT_COMPATIBLE" >> "$GITHUB_OUTPUT"
          echo "activation_ready=$ACTIVATION_READY" >> "$GITHUB_OUTPUT"

      - name: Stage and verify immutable runtime publication once
        run: |
          set -euo pipefail
          RELEASE_DIR="cache/target/asset-release/$PUBLICATION_IDENTITY"
          uv run --project build_system --frozen python build_system/scripts/release/stage-runtime-publication.py \
            --manifest cache/target/source-channel/manifest.json \
            --assets-dir cache/target/assets \
            --release-dir "$RELEASE_DIR"
          uv run --project build_system --frozen python build_system/scripts/release/verify-runtime-publication.py \
            --manifest "$RELEASE_DIR/channel-source-$CHANNEL.json" \
            --publication-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$PUBLICATION_IDENTITY" \
            --release-dir "$RELEASE_DIR"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authored-runtime-channel-source
          path: cache/target/source-channel/manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authored-runtime-candidate
          path: cache/target/runtime-candidate/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authored-runtime-publication
          path: cache/target/asset-release/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authored-runtime-release-report
          path: cache/target/runtime-release.json

  publish-runtime-release:
    needs: [author-runtime-release, test-runtime-pairing, resolve-current-binary]
    runs-on: ubuntu-latest
    name: Publish verified runtime assets
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    outputs:
      activation_ready: ${{ needs.author-runtime-release.outputs.activation_ready }}
    env:
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: build_system/release_site/pnpm-lock.yaml
      - name: Install release site dependencies
        run: cd build_system/release_site && pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: ./.github/actions/rust-cache

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vm-assets-arm64
          path: cache/target/assets/arm64/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vm-assets-x86_64
          path: cache/target/assets/x86_64/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authored-runtime-channel-source
          path: cache/target/source-channel/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: authored-runtime-publication
          path: cache/target/asset-release/

      - name: Build deployable channel from authored source manifest
        if: ${{ needs.author-runtime-release.outputs.activation_ready == 'true' }}
        run: |
          uv run --project build_system --frozen python build_system/scripts/release/build-complete-release-channel.py \
            --channel-source "$CHANNEL=file://$PWD/cache/target/source-channel/manifest.json" \
            --primary-channel "$CHANNEL" \
            --assets-dir cache/target/assets \
            --manifest-version "$(jq -er .version cache/target/source-channel/manifest.json)" \
            --out-dir cache/target/release/distribution

      - name: Attest VM asset provenance
        if: ${{ inputs.dry_run == false }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: cache/target/asset-release/runtime-*/*

      - name: Publish immutable GitHub runtime release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.author-runtime-release.outputs.publication_identity }}
          RUNTIME_REVISION: ${{ needs.resolve-current-binary.outputs.runtime_revision }}
        run: |
          set -euo pipefail
          RELEASE_DIR="cache/target/asset-release/$TAG"
          NOTES_FILE="cache/target/asset-release/runtime-release-notes.md"
          uv run --project build_system --frozen python build_system/scripts/release/verify-runtime-publication.py \
            --manifest "$RELEASE_DIR/channel-source-$CHANNEL.json" \
            --publication-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --release-dir "$RELEASE_DIR"

          files=("$RELEASE_DIR"/*)
          test "${#files[@]}" -gt 0
          printf '%s\n' "Immutable Capsem $CHANNEL runtime $RUNTIME_REVISION." > "$NOTES_FILE"

          {
            echo "## Immutable VM runtime release"
            echo
            echo "- Tag: \`$TAG\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Files:"
            # shellcheck disable=SC2016
            printf '  - `%s`\n' "${files[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: would publish immutable VM runtime release $TAG"
          else
            CAPSEM_RELEASE_CREATE_TITLE="Capsem $CHANNEL runtime $RUNTIME_REVISION ($SOURCE_COMMIT)" \
            CAPSEM_RELEASE_CREATE_NOTES_FILE="$NOTES_FILE" \
            CAPSEM_RELEASE_CREATE_TARGET="$SOURCE_COMMIT" \
              build_system/scripts/release/publish-immutable-release-assets.sh \
                "$TAG" "$RELEASE_DIR"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asset-channel-source
          path: cache/target/source-channel/manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ inputs.dry_run == true }}
        with:
          name: asset-release-plan
          path: cache/target/asset-release/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ needs.author-runtime-release.outputs.activation_ready == 'true' }}
        with:
          name: asset-channel-preview
          path: cache/target/release/distribution/

  deploy-channel:
    needs: publish-runtime-release
    if: ${{ inputs.dry_run == false && needs.publish-runtime-release.outputs.activation_ready == 'true' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/release-channel.yaml
    with:
      channel: ${{ inputs.channel }}
      dist_artifact: asset-channel-preview
      source_commit: ${{ inputs.source_commit }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
