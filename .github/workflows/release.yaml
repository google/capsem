name: Release
run-name: Release ${{ inputs.channel }} ${{ inputs.tag }} ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable v* tag to release
        required: true
        type: string
      channel:
        description: Binary channel to advance
        required: true
        type: choice
        options:
          - stable
          - nightly
      publish:
        description: Publish and activate the tested immutable binary identity.
        required: true
        type: boolean
      dispatch_id:
        description: Correlation id supplied by release-binaries.py.
        required: true
        type: string
      source_commit:
        description: Exact committed main source qualified by the release gate.
        required: true
        type: string

concurrency:
  group: capsem-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  attestations: write
  deployments: write
  id-token: write

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  ASSET_MANIFEST_URL: https://release.capsem.org/assets/${{ inputs.channel }}/manifest.json

jobs:
  source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Require exact immutable dispatch source
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/capsem-source-$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

  runtime-preflight:
    needs: source-identity
    uses: ./.github/workflows/release-runtime-preflight.yaml
    with:
      channel: ${{ inputs.channel }}
      bootstrap_missing_first_party: true
      source_commit: ${{ inputs.source_commit }}

  fast-gate:
    needs: source-identity
    uses: ./.github/workflows/fast-gate.yaml
    with:
      source_commit: ${{ inputs.source_commit }}

  resolve-channel-source:
    needs: runtime-preflight
    runs-on: ubuntu-latest
    name: Resolve serialized channel source manifest
    outputs:
      baseline_channel: ${{ steps.public-before.outputs.manifest-channel }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - name: Select exact public-before manifest
        id: public-before
        run: |
          python3 scripts/select-runtime-preflight-manifest.py \
            --channel "stable" \
            --bootstrap-missing-first-party \
            --github-output "$GITHUB_OUTPUT"

      - name: Fetch latest selected channel source manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/fetch-channel-source-manifest.py \
            --channel "$RELEASE_CHANNEL" \
            --source-commit "${{ inputs.source_commit }}" \
            --require-profile-membership \
            --output target/channel-source/manifest.json

      - name: Project inactive first-channel public-before state
        if: ${{ steps.public-before.outputs.bootstrap == 'true' }}
        run: |
          python3 scripts/project-first-channel-before.py \
            --source-manifest target/channel-source/manifest.json \
            --channel "stable" \
            --bootstrap "${{ steps.public-before.outputs.bootstrap }}" \
            --retired "${{ steps.public-before.outputs.retired }}" \
            --output target/channel-source/public-before.json

      - name: Select public-before authority for exact pairing
        id: public-before-authority
        run: |
          if [[ "${{ steps.public-before.outputs.bootstrap }}" == "true" ]]; then
            echo "manifest-url=file://$PWD/target/channel-source/public-before.json" \
              >> "$GITHUB_OUTPUT"
          else
            echo "manifest-url=${{ steps.public-before.outputs.manifest-url }}" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch exact deployed public-before packages
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: ${{ steps.public-before-authority.outputs.manifest-url }}
          allow-empty-packages: ${{ steps.public-before.outputs.bootstrap }}
          kind: packages
          output: target/binary-public-before/packages

      - name: Fetch exact deployed public-before profiles
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: ${{ steps.public-before-authority.outputs.manifest-url }}
          allow-empty-profiles: ${{ steps.public-before.outputs.bootstrap }}
          kind: profiles
          architecture: x86_64
          output: target/binary-public-before/profiles

      - name: Prove public-before cohorts use one manifest
        run: |
          uv run --project build_system --frozen python scripts/verify-release-inputs.py \
            --input-dir target/binary-public-before/profiles
          cmp \
            target/binary-public-before/packages/manifest.json \
            target/binary-public-before/profiles/manifest.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-source
          path: target/channel-source/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-public-before-packages
          path: target/binary-public-before/packages/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-public-before-profiles
          path: target/binary-public-before/profiles/

  preflight:
    needs: [runtime-preflight, fast-gate]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Verify immutable source ref, version tag, and channel
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "capsem-source-$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          case "$RELEASE_CHANNEL" in stable|nightly) ;; *) exit 1 ;; esac

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Import Apple certificate (preflight)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          KEYCHAIN="preflight-$$.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID" || true)
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID signing identity found. Check APPLE_CERTIFICATE secret."
            echo "::error::If the p12 was created with OpenSSL 3.x, it uses PBES2/AES encryption."
            echo "::error::macOS requires legacy 3DES. Re-export with: build_system/packaging/macos/fix_p12_legacy.sh"
            exit 1
          fi
          echo "codesigning identities:"
          echo "$IDENTITY"
          # Installer cert is not a codesigning identity; check with full list.
          INSTALLER=$(security find-identity -v "$KEYCHAIN" | grep "Developer ID Installer" || true)
          if [ -z "$INSTALLER" ]; then
            echo "::error::No Developer ID Installer identity found. productsign (.pkg signing) will fail."
            echo "::error::Export a combined p12 containing both Application and Installer certs."
            exit 1
          fi
          echo "installer identity: $INSTALLER"
          security delete-keychain "$KEYCHAIN"
          rm cert.p12

      - name: Verify Tauri signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi
          echo "Tauri signing key is set"

      - name: Verify notarization credentials
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          if [ -z "$APPLE_API_ISSUER" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_KEY_CONTENT" ]; then
            echo "::error::Notarization secrets missing (APPLE_API_ISSUER, APPLE_API_KEY, or APPLE_API_KEY_PATH)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          if xcrun notarytool history \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            >/dev/null 2>&1; then
            echo "Notarization credentials verified (notarytool history succeeded)"
          else
            echo "::error::notarytool history failed -- check APPLE_API_ISSUER, APPLE_API_KEY, and APPLE_API_KEY_PATH secrets"
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/private_keys"
  build-app-macos:
    needs: [preflight, resolve-channel-source]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-source
          path: target/channel-source/

      - name: Select serialized pre-activation manifest
        run: |
          test -s target/channel-source/manifest.json
          echo "PREACTIVATION_MANIFEST=file://$PWD/target/channel-source/manifest.json" \
            >> "$GITHUB_ENV"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: build-app-macos

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - name: Fetch exact selected arm64 profiles
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: file://${{ github.workspace }}/target/channel-source/manifest.json
          kind: profiles
          architecture: arm64
          output: target/binary-selected-profiles

      - name: Stage exact selected profile inputs
        run: |
          uv run --project build_system --frozen python scripts/stage-release-test-inputs.py \
            --input-dir target/binary-selected-profiles \
            --assets-dir target/release-assets \
            --config-root target/release-config \
            --shared-config-root config

      - name: Materialize runtime config
        run: |
          CAPSEM_ASSET_MANIFEST="$PREACTIVATION_MANIFEST" \
          CAPSEM_ASSETS_PATH="$PWD/target/release-assets" \
          CAPSEM_CONFIG_ROOT="$PWD/target/release-config" \
          CAPSEM_ARCH=arm64 \
            bash scripts/materialize-config.sh

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile

      - name: Build frontend
        run: bash scripts/check-web-surface.sh frontend-build

      - name: Install exact config-owned Cargo tools
        env:
          CARGO_NET_RETRY: 10
        run: uv run --project build_system --frozen python scripts/install-configured-cargo-tools.py cargo-tauri cargo-sbom

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          KEYCHAINS=()
          while IFS= read -r keychain; do
            keychain="${keychain#*\"}"
            keychain="${keychain%\"*}"
            KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s build.keychain "${KEYCHAINS[@]}"

      - name: Write Apple API key file
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"

      - name: Validate build context completeness
        run: |
          uv run --project build_system --frozen python3 -c "
          from capsem_builder.image.doctor import check_source_files
          from pathlib import Path
          result = check_source_files(Path('.'))
          if not result.passed:
              raise SystemExit(f'Source file check failed: {result.detail}')
          print(f'OK: {result.detail}')
          "

      - name: Build and sign app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: |
          cd crates/capsem-app
          cargo tauri build --bundles app --skip-stapling

      - name: Build companion binaries
        run: |
          cargo build --release \
            -p capsem \
            -p capsem-service \
            -p capsem-process \
            -p capsem-tui \
            -p capsem-mcp \
            -p capsem-mcp-aggregator \
            -p capsem-mcp-builtin \
            -p capsem-gateway \
            -p capsem-tray \
            -p capsem-admin \
            -p capsem-mock-server \
            -p capsem-bench
          bash scripts/check-build-provenance.sh target/release/capsem

      - name: Codesign companion binaries
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          for bin in capsem capsem-service capsem-process capsem-tui capsem-mcp capsem-mcp-aggregator capsem-mcp-builtin capsem-gateway capsem-tray capsem-admin capsem-mock-server capsem-bench-rs; do
            codesign --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime \
              --timestamp \
              --entitlements build_system/packaging/macos/entitlements.plist \
              --force \
              "target/release/$bin"
          done

      - name: Build .pkg installer
        run: |
          VERSION="${RELEASE_TAG#v}"
          bash build_system/packaging/macos/build-pkg.sh \
            --manifest "$ASSET_MANIFEST_URL" \
            "target/release/bundle/macos/Capsem.app" \
            "target/release" \
            "assets" \
            "target/config" \
            "$VERSION" \
            "${{ secrets.APPLE_INSTALLER_SIGNING_IDENTITY }}"

      - name: Verify macOS package installation path policy
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          EXPANDED_ROOT="$(mktemp -d "$RUNNER_TEMP/capsem-pkg-policy.XXXXXX")"
          pkgutil --expand-full \
            "target/packages/Capsem-$VERSION.pkg" \
            "$EXPANDED_ROOT/expanded"
          python3 - "$EXPANDED_ROOT/expanded" <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          expanded = pathlib.Path(sys.argv[1])
          package_infos = list(expanded.rglob("PackageInfo"))
          if len(package_infos) != 1:
              raise SystemExit(
                  f"expected exactly one PackageInfo, found {package_infos}"
              )
          root = ET.parse(package_infos[0]).getroot()
          relocations = root.findall("./relocate/bundle")
          if relocations:
              ids = [bundle.get("id", "<missing>") for bundle in relocations]
              raise SystemExit(
                  "PackageKit bundle relocation must be disabled; "
                  f"relocatable bundle ids: {ids}"
              )
          apps = list(expanded.rglob("Applications/Capsem.app"))
          if len(apps) != 1:
              raise SystemExit(
                  f"expected one /Applications/Capsem.app payload, found {apps}"
              )
          print("package path policy verified: fixed /Applications/Capsem.app")
          PY

      - name: Notarize and staple .pkg
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: |
          VERSION="${RELEASE_TAG#v}"
          xcrun notarytool submit "target/packages/Capsem-$VERSION.pkg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "target/packages/Capsem-$VERSION.pkg"
          xcrun stapler validate "target/packages/Capsem-$VERSION.pkg"

      - name: Verify exact notarized package identity and Gatekeeper acceptance
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          pkgutil --check-signature "target/packages/Capsem-$VERSION.pkg"
          spctl -a -vv -t install "target/packages/Capsem-$VERSION.pkg"

      - name: Collect macOS artifacts
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          if [ ! -f "target/packages/Capsem-$VERSION.pkg" ]; then
            echo "::error::Capsem-$VERSION.pkg not produced by build-pkg.sh"
            exit 1
          fi
          cp "target/packages/Capsem-$VERSION.pkg" release-artifacts/
          ls -lh release-artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-macos
          path: release-artifacts/

  build-app-linux:
    needs: [preflight, resolve-channel-source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-source
          path: target/channel-source/

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: materialize-package-config-${{ matrix.arch }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - name: Fetch exact selected ${{ matrix.arch }} profiles
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: file://${{ github.workspace }}/target/channel-source/manifest.json
          kind: profiles
          architecture: ${{ matrix.arch }}
          output: target/binary-selected-profiles

      - name: Stage exact selected profile inputs
        run: |
          uv run --project build_system --frozen python scripts/stage-release-test-inputs.py \
            --input-dir target/binary-selected-profiles \
            --assets-dir target/package-content/assets \
            --config-root target/package-source-config \
            --shared-config-root config

      - name: Materialize runtime config
        run: |
          CAPSEM_ASSET_MANIFEST="$PWD/target/package-content/assets/manifest.json" \
          CAPSEM_ASSETS_PATH="$PWD/target/package-content/assets" \
          CAPSEM_CONFIG_ROOT="$PWD/target/package-source-config" \
          CAPSEM_CONFIG_OUTPUT_ROOT="$PWD/target/package-content/config" \
          CAPSEM_ARCH="${{ matrix.arch }}" \
            bash scripts/materialize-config.sh --pair-content

      - name: Build Linux package through the shared hermetic rail
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CAPSEM_INSTALL_CHANNEL: ${{ inputs.channel }}
          CAPSEM_INSTALL_MANIFEST_URL: https://release.capsem.org/assets/${{ inputs.channel }}/manifest.json
        run: |
          uv run --project build_system --frozen capsem-gate cross-compile "${{ matrix.arch }}" \
            --content-root target/package-content \
            --defer-proof

      - name: Upload Linux package gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-linux-${{ matrix.arch }}-gate-runs-${{ github.run_attempt }}
          path: target/gate-runs/
          if-no-files-found: error

      - name: Collect Linux artifacts
        run: |
          mkdir -p release-artifacts
          cp target/packages/*.deb release-artifacts/
          ls -lh release-artifacts/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-artifacts/

  author-binary-candidate:
    needs: [build-app-macos, build-app-linux, resolve-channel-source]
    runs-on: ubuntu-latest
    name: Author binary candidate source manifest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-binary-author

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-macos
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-arm64
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-x86_64
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-source
          path: target/binary-channel/${{ inputs.channel }}/

      - name: Install host SBOM archive deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Generate packaged host SBOM once
        run: |
          set -euo pipefail
          ARTIFACTS=()
          for file in release-artifacts/*.pkg release-artifacts/*.deb; do
            [ -f "$file" ] && ARTIFACTS+=("$file")
          done
          if [ "${#ARTIFACTS[@]}" -eq 0 ]; then
            echo "::error::no package artifacts available for host SBOM"
            exit 1
          fi
          python3 scripts/generate-host-binary-sbom.py \
            --output release-artifacts/capsem-sbom.spdx.json \
            "${ARTIFACTS[@]}"

      - name: Verify binary candidate artifacts
        run: |
          set -euo pipefail
          test -s release-artifacts/capsem-sbom.spdx.json
          test "$(find release-artifacts -maxdepth 1 \( -name '*.pkg' -o -name '*.deb' \) -type f | wc -l)" -eq 3

      - name: Preserve serialized public-before manifest
        run: |
          set -euo pipefail
          manifest="target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          test -f "$manifest"
          cp "$manifest" \
            "target/binary-channel/$RELEASE_CHANNEL/manifest.before.json"

      - name: Record binary candidate metadata once
        env:
          CAPSEM_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARTIFACT_ARGS=()
          for file in release-artifacts/*.pkg release-artifacts/*.deb release-artifacts/capsem-sbom.spdx.json; do
            [ -f "$file" ] && ARTIFACT_ARGS+=(--artifact "$file")
          done
          cargo run -p capsem-admin -- assets channel record-binary \
            --manifest-path "target/binary-channel/$RELEASE_CHANNEL/manifest.json" \
            --version "$VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            "${ARTIFACT_ARGS[@]}"
          test -f "target/binary-channel/$RELEASE_CHANNEL/manifest.before.json"

      - name: Prove binary candidate preserved every profile
        run: |
          set -euo pipefail
          python3 - "$RELEASE_CHANNEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          channel = sys.argv[1]
          root = Path("target/binary-channel") / channel
          before = json.loads((root / "manifest.before.json").read_text())
          after = json.loads((root / "manifest.json").read_text())
          if before.get("profiles") != after.get("profiles"):
              raise SystemExit(f"{channel} binary candidate changed profile metadata")
          PY

      - name: Verify binary release lane policy
        run: |
          uv run --project build_system --frozen pytest \
            tests/capsem-release/test_binary_lane_gate.py \
            tests/capsem-release/test_release_lane_diff_policy.py -q

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-host-sbom
          path: release-artifacts/capsem-sbom.spdx.json

  test-native-macos-package:
    needs: [build-app-macos, author-binary-candidate]
    runs-on: macos-14
    name: Install exact candidate macOS package
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-macos
          path: release-test-package/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - name: Select exact candidate manifest
        run: |
          manifest="$PWD/target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          test -s "$manifest"
          echo "PREACTIVATION_MANIFEST=file://$manifest" >> "$GITHUB_ENV"
          echo "PREACTIVATION_MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"

      - name: Write secure package install requests
        run: |
          set -euo pipefail
          bash build_system/packaging/macos/macos-install-user-request.sh write "$(id -un)"
          bash build_system/packaging/shared/install-manifest-request.sh write "$PREACTIVATION_MANIFEST_PATH" "$PREACTIVATION_MANIFEST"
          test "$(sudo stat -f '%u' /var/run/capsem/install-manifest)" = "0"
          test "$(sudo stat -f '%Lp' /var/run/capsem/install-manifest)" = "600"

      - name: Install and verify exact notarized package
        run: |
          set -euo pipefail
          cleanup_requests() {
            bash build_system/packaging/macos/macos-install-user-request.sh clear || true
            bash build_system/packaging/shared/install-manifest-request.sh clear || true
          }
          trap cleanup_requests EXIT
          VERSION="${RELEASE_TAG#v}"
          package=$(find release-test-package -maxdepth 1 -name '*.pkg' -print -quit)
          test -n "$package"
          sudo /usr/sbin/installer -pkg "$package" -target /
          test ! -e /var/run/capsem/install-manifest
          pkgutil --pkg-info com.capsem.pkg | tee "$RUNNER_TEMP/capsem-package-receipt.txt"
          pkgutil --pkg-info com.capsem.pkg | grep -F "version: $VERSION"
          test -d "/Applications/Capsem.app"
          test -x "/Applications/Capsem.app/Contents/MacOS/capsem-app"
          for bin in capsem capsem-admin capsem-gateway capsem-mcp capsem-mcp-aggregator capsem-mcp-builtin capsem-process capsem-service capsem-tray capsem-tui capsem-mock-server capsem-bench-rs; do
            test -x "$HOME/.capsem/bin/$bin"
            "$HOME/.capsem/bin/$bin" --version | grep -F "$VERSION"
          done
          "$HOME/.capsem/bin/capsem" status | tee /tmp/capsem-status.txt
          grep -F "Installed: true" /tmp/capsem-status.txt
          grep -F "Running:   true" /tmp/capsem-status.txt
          grep -F "Service:   ok" /tmp/capsem-status.txt
          grep -F "Gateway:   ok" /tmp/capsem-status.txt
          pgrep -x capsem-tray
          python3 scripts/verify-installed-release.py \
            --capsem "$HOME/.capsem/bin/capsem" \
            --manifest-url "$PREACTIVATION_MANIFEST" \
            --metadata-manifest-url "$ASSET_MANIFEST_URL" \
            --channel "$RELEASE_CHANNEL" \
            --package-version "$VERSION"

      - name: Collect macOS install diagnostics
        if: always()
        run: |
          mkdir -p release-diagnostics
          {
            id
            pkgutil --pkg-info com.capsem.pkg || true
            find /Applications -maxdepth 3 -name 'Capsem.app' -print 2>&1 || true
            ls -la "$HOME/.capsem" "$HOME/.capsem/bin" "$HOME/.capsem/logs" 2>&1 || true
            tail -n 400 /var/log/install.log 2>&1 || true
            tail -n 400 "$HOME/.capsem/logs/install-latest.log" 2>&1 || true
          } | tee release-diagnostics/macos-install.txt
          bash build_system/packaging/macos/macos-install-user-request.sh clear || true
          bash build_system/packaging/shared/install-manifest-request.sh clear || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: release-macos-install-diagnostics
          path: release-diagnostics/
          if-no-files-found: warn

  test-native-linux-package:
    needs: [build-app-linux, author-binary-candidate]
    name: Install exact candidate Linux package (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-test-package/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - name: Select exact candidate manifest
        run: |
          manifest="$PWD/target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          test -s "$manifest"
          echo "PREACTIVATION_MANIFEST=file://$manifest" >> "$GITHUB_ENV"
          echo "PREACTIVATION_MANIFEST_PATH=$manifest" >> "$GITHUB_ENV"

      - name: Enable KVM for exact-package VM proof
        if: matrix.arch == 'x86_64'
        run: |
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          sudo modprobe vhost_vsock
          sudo chmod 0666 /dev/vhost-vsock
          test -r /dev/kvm -a -w /dev/kvm
          test -r /dev/vhost-vsock -a -w /dev/vhost-vsock

      - name: Install and verify exact release deb
        run: |
          set -euo pipefail
          trap 'bash build_system/packaging/shared/install-manifest-request.sh clear || true' EXIT
          package=$(find release-test-package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          python3 build_system/packaging/linux/install-deb-runtime-dependencies.py "$package" --config config/gate.toml
          bash build_system/packaging/shared/install-manifest-request.sh write "$PREACTIVATION_MANIFEST_PATH" "$PREACTIVATION_MANIFEST"
          VERSION="${RELEASE_TAG#v}"
          sudo dpkg -i "$package"
          test ! -e /var/run/capsem/install-manifest
          dpkg-query -W -f='${Version}' capsem | grep -Fx "$VERSION"
          for bin in capsem capsem-admin capsem-app capsem-gateway capsem-mcp capsem-mcp-aggregator capsem-mcp-builtin capsem-process capsem-service capsem-tray capsem-tui capsem-mock-server capsem-bench-rs; do
            test -x "/usr/bin/$bin"
            if [ "$bin" != "capsem-app" ]; then
              "/usr/bin/$bin" --version | grep -F "$VERSION"
            fi
          done
          /usr/bin/capsem status | tee /tmp/capsem-status.txt
          grep -F "Installed: true" /tmp/capsem-status.txt
          grep -F "Running:   true" /tmp/capsem-status.txt
          grep -F "Service:   ok" /tmp/capsem-status.txt
          grep -F "Gateway:   ok" /tmp/capsem-status.txt
          python3 scripts/verify-installed-release.py \
            --capsem /usr/bin/capsem \
            --manifest-url "$PREACTIVATION_MANIFEST" \
            --metadata-manifest-url "$ASSET_MANIFEST_URL" \
            --channel "$RELEASE_CHANNEL" \
            --package-version "$VERSION"

      - name: Prove exact-package guest shell execution
        if: matrix.arch == 'x86_64'
        run: |
          python3 scripts/prove-installed-shell.py \
            --capsem /usr/bin/capsem \
            --marker CAPSEM_EXACT_PACKAGE_SHELL_OK \
            --session-name release-exact-shell-x86_64 \
            --timeout 300

  test-binary-pairing:
    needs: [resolve-channel-source, build-app-macos, build-app-linux, author-binary-candidate]
    runs-on: ubuntu-24.04
    name: Complete binary pairing gate
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            build_system/release_site/pnpm-lock.yaml
      - name: Install shared functional web dependencies
        run: |
          (cd frontend && pnpm install --frozen-lockfile)
          (cd build_system/release_site && pnpm install --frozen-lockfile)
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: llvm-tools
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Select the declared tool set
        id: gate_tools
        run: |
          list=$(python3 build_system/scripts/ci/gate-tool-list.py --sets functional)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install pinned functional test runner
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: ${{ steps.gate_tools.outputs.list }}

      - name: Install Linux sandbox runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Prove Linux sandbox boundary
        run: python3 scripts/prepare-linux-sandbox.py --repair-hosted-runner

      - name: Materialize locked Rust dependencies
        run: |
          cargo fetch --locked

      - name: Enable KVM for complete functional proof
        run: |
          set -euo pipefail
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          sudo modprobe vhost_vsock
          sudo chmod 0666 /dev/vhost-vsock
          test -r /dev/kvm -a -w /dev/kvm
          test -r /dev/vhost-vsock -a -w /dev/vhost-vsock

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-x86_64
          path: release-test-package/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-public-before-packages
          path: target/binary-public-before/packages/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-public-before-profiles
          path: target/binary-public-before/profiles/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - name: Verify exact public-before cohorts
        run: |
          uv run --project build_system --frozen python scripts/verify-release-inputs.py \
            --input-dir target/binary-public-before/packages
          uv run --project build_system --frozen python scripts/verify-release-inputs.py \
            --input-dir target/binary-public-before/profiles
          cmp \
            target/binary-public-before/packages/manifest.json \
            target/binary-public-before/profiles/manifest.json

      - name: Resolve exact candidate-after profiles
        uses: ./.github/actions/fetch-release-inputs
        with:
          manifest-url: file://${{ github.workspace }}/target/binary-channel/${{ inputs.channel }}/manifest.json
          kind: profiles
          architecture: x86_64
          output: target/candidate-profile-inputs

      - name: Stage exact candidate-after profiles
        run: |
          uv run --project build_system --frozen python scripts/verify-release-inputs.py \
            --input-dir target/candidate-profile-inputs
          uv run --project build_system --frozen python scripts/stage-release-test-inputs.py \
            --input-dir target/candidate-profile-inputs \
            --assets-dir target/assets \
            --config-root target/release-config \
            --shared-config-root config
          CAPSEM_ASSET_MANIFEST="$PWD/target/assets/manifest.json" \
          CAPSEM_ASSETS_PATH="$PWD/target/assets" \
          CAPSEM_CONFIG_ROOT="$PWD/target/release-config" \
          CAPSEM_CONFIG_OUTPUT_ROOT="$PWD/target/config" \
            bash scripts/materialize-config.sh --pair-content

      - name: Activate exact candidate package binaries for functional tests
        run: |
          set -euo pipefail
          package=$(find release-test-package -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$package"
          uv run --project build_system --frozen python build_system/packaging/linux/install-deb-runtime-dependencies.py "$package" --config config/gate.toml
          before_package=$(uv run --project build_system --frozen python scripts/stage-release-test-inputs.py \
            --input-dir target/binary-public-before/packages \
            --print-package-path)
          uv run --project build_system --frozen python scripts/stage-release-test-inputs.py \
            --package-file "$package" \
            --binary-dir target/debug
          {
            echo "CAPSEM_RELEASE_PACKAGE=$PWD/$package"
            echo "CAPSEM_RELEASE_BIN_DIR=$PWD/target/debug"
            echo "CAPSEM_RELEASE_INPUT_DIR=$PWD/target/candidate-profile-inputs"
            printf 'CAPSEM_RELEASE_CHANNEL=%s\nCAPSEM_RELEASE_BASELINE_CHANNEL=%s\n' "$RELEASE_CHANNEL" "${{ needs.resolve-channel-source.outputs.baseline_channel }}"
            echo "CAPSEM_RELEASE_TRANSITION=auto"
            echo "CAPSEM_RELEASE_BEFORE_MANIFEST=$PWD/target/binary-public-before/profiles/manifest.json"
            echo "CAPSEM_RELEASE_AFTER_MANIFEST=$PWD/target/binary-channel/$RELEASE_CHANNEL/manifest.json"
            echo "CAPSEM_RELEASE_BEFORE_PACKAGE=${before_package:+$PWD/$before_package}"
            echo "CAPSEM_RELEASE_BEFORE_PROFILE_INPUTS=$PWD/target/binary-public-before/profiles"
            echo "CAPSEM_RELEASE_AFTER_PROFILE_INPUTS=$PWD/target/candidate-profile-inputs"
            echo "CAPSEM_TEST_BINARY=$PWD/target/debug/capsem"
            echo "CAPSEM_TEST_ASSETS_DIR=$PWD/target/assets"
            echo "CAPSEM_TEST_CONFIG_ROOT=$PWD/target/config"
          } >> "$GITHUB_ENV"

      - name: Qualify the candidate binaries
        run: just qualify-binaries "$PWD"

      # This gate blocks publication, so a failure here has to be diagnosable
      # from outside the runner. Without the session logs a Linux-only failure
      # is invisible to a macOS developer, which is exactly how
      # TestRun::test_run_returns_output stalled the 1.6 release: reproducibly
      # red here, green locally, and no process.log to explain the difference.
      - name: Upload pairing evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-pairing-evidence-${{ github.run_attempt }}
          path: |
            target/test-artifacts/
            target/gate-runs/
            target/test-home/.capsem/run/sessions/
            target/test-home/.capsem/logs/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  create-release:
    needs: [test-native-macos-package, test-native-linux-package, test-binary-pairing]
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      # Download the exact platform artifacts that passed their install gates.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-macos
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-arm64
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-linux-x86_64
          path: release-artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-host-sbom
          path: release-artifacts/

      - name: Verify tested host SBOM is present
        run: test -s release-artifacts/capsem-sbom.spdx.json

      - name: Attest build provenance (pkg + deb)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            release-artifacts/*.pkg
            release-artifacts/*.deb

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: |
            release-artifacts/*.pkg
            release-artifacts/*.deb
          predicate-type: https://spdx.dev/Document/v2.3
          predicate-path: release-artifacts/capsem-sbom.spdx.json

      - name: Build summary
        run: >
          python3 scripts/write-release-summary.py
          --artifacts release-artifacts
          --tag "$RELEASE_TAG"
          --manifest-url "$ASSET_MANIFEST_URL"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owned="target/binary-release-publication"
          notes="target/binary-release-notes.md"
          mkdir -p "$owned"
          cp release-artifacts/*.pkg "$owned/"
          cp release-artifacts/*.deb "$owned/"
          cp release-artifacts/capsem-sbom.spdx.json "$owned/"
          python3 scripts/write-release-notes.py "$notes"
          CAPSEM_RELEASE_CREATE_TITLE="Capsem $RELEASE_TAG ($SOURCE_COMMIT)" \
          CAPSEM_RELEASE_CREATE_NOTES_FILE="$notes" \
          CAPSEM_RELEASE_CREATE_TARGET="$SOURCE_COMMIT" \
            scripts/publish-immutable-release-assets.sh \
              "$RELEASE_TAG" "$owned"

  assemble-release-channel:
    needs: [create-release, author-binary-candidate]
    runs-on: ubuntu-latest
    outputs:
      dist_artifact: binary-channel-preview
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: build_system/release_site/pnpm-lock.yaml
      - name: Install release site dependencies
        run: cd build_system/release_site && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-binary

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - name: Verify tested binary candidate source is present
        run: |
          set -euo pipefail
          test -s "target/binary-channel/$RELEASE_CHANNEL/manifest.before.json"
          test -s "target/binary-channel/$RELEASE_CHANNEL/manifest.json"

      - name: Build complete release channels with existing VM assets
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run --project build_system --frozen python scripts/build-complete-release-channel.py \
            --channel-source "$RELEASE_CHANNEL=file://$PWD/target/binary-channel/$RELEASE_CHANNEL/manifest.json" \
            --primary-channel "$RELEASE_CHANNEL" \
            --asset-source-base "https://github.com/${{ github.repository }}/releases/download/assets-v{asset_version}" \
            --manifest-version "1.0.${{ github.run_number }}" \
            --generated-at "$generated_at" \
            --out-dir target/distribution

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-preview
          path: target/distribution/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-before
          path: target/binary-channel/*/manifest.before.json

  # The GitHub release is public storage but remains undiscoverable to Capsem
  # clients until release.capsem.org advances. Prove the public package URLs,
  # digests, and installer selection against the candidate channel first.
  verify-release-candidate:
    needs: [create-release, assemble-release-channel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-preview
          path: candidate-release/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/

      - name: Verify public GitHub package storage from the candidate manifest
        run: |
          uv run --project build_system --frozen python scripts/release-package-contract.py verify-storage \
            --manifest "candidate-release/assets/$RELEASE_CHANNEL/manifest.json" \
            --expected-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
            --expected-version "${RELEASE_TAG#v}" \
            --work-dir /tmp/candidate-packages

      - name: Prove install.sh selects and installs the candidate Linux package
        run: >
          scripts/prove-candidate-installer.sh candidate-release
          "$RELEASE_CHANNEL" "${RELEASE_TAG#v}"

      - name: Persist mutated source manifest on the immutable binary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source="target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          owned="target/binary-source-publication"
          named="$owned/channel-source-$RELEASE_CHANNEL.json"
          mkdir -p "$owned"
          cp "$source" "$named"
          scripts/publish-immutable-release-assets.sh \
            "$RELEASE_TAG" "$owned"

  deploy-release-channel:
    needs: [verify-release-candidate]
    uses: ./.github/workflows/release-channel.yaml
    with:
      channel: ${{ inputs.channel }}
      dist_artifact: binary-channel-preview
      source_commit: ${{ inputs.source_commit }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Post-release: verify the public asset channel remains reachable, then prove
  # the just-released .deb can hydrate VM assets from release.capsem.org.
  # ---------------------------------------------------------------------------
  verify-release-downloads:
    needs: [deploy-release-channel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-before
          path: /tmp/binary-channel-before

      - name: Wait for release assets to be queryable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Verify every URL in the asset channel manifest is reachable
        run: >
          uv run --project build_system --frozen python scripts/verify-channel-downloads.py
          --manifest-url "$ASSET_MANIFEST_URL"
      - name: Verify public release packages and installer contract
        run: |
          set -euo pipefail
          uv run --project build_system --frozen python3 scripts/check-public-binary-release.py \
            --channel "$RELEASE_CHANNEL" \
            --manifest-url "$ASSET_MANIFEST_URL" \
            --stable-manifest-url https://release.capsem.org/assets/stable/manifest.json \
            --nightly-manifest-url https://release.capsem.org/assets/nightly/manifest.json \
            --install-script-url https://capsem.org/install.sh \
            --site-url https://capsem.org/ \
            --docker-transition-from-manifest "/tmp/binary-channel-before/$RELEASE_CHANNEL/manifest.before.json" \
            --work-dir /tmp/public-binary-release

      - name: Enable KVM for live public-install VM proof
        run: |
          set -euo pipefail
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          sudo modprobe vhost_vsock
          sudo chmod 0666 /dev/vhost-vsock
          test -r /dev/kvm -a -w /dev/kvm
          test -r /dev/vhost-vsock -a -w /dev/vhost-vsock

      - name: Install live public Linux release and prove guest shell execution
        run: >
          scripts/prove-live-public-install.sh /tmp/verify/manifest.json
          "$ASSET_MANIFEST_URL" "$RELEASE_CHANNEL"

  cleanup-unpublished-version-claim:
    needs: [verify-release-downloads]
    if: ${{ always() && inputs.publish == true && (failure() || cancelled()) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - name: Give back an exact unpublished version claim after failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_version_tag.py cleanup-exact \
            --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --repository "${{ github.repository }}"
