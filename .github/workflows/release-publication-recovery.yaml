name: Recover Qualified Release Publication
run-name: Recover ${{ inputs.channel }} ${{ inputs.tag }} from run ${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Terminal Release run that failed only at channel assembly.
        required: true
        type: string
      source_commit:
        description: Exact source commit qualified by the failed Release run.
        required: true
        type: string
      tag:
        description: Existing immutable GitHub Release tag.
        required: true
        type: string
      channel:
        description: Channel whose qualified publication is being recovered.
        required: true
        type: choice
        options:
          - stable
          - nightly

concurrency:
  group: capsem-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  deployments: write

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  ASSET_MANIFEST_URL: https://release.capsem.org/assets/${{ inputs.channel }}/manifest.json

jobs:
  recover-release-channel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0

      - name: Require recovery tooling from current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify qualified source release stopped only at assembly
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          mkdir -p target/release-recovery
          gh run view "$FAILED_RUN_ID" \
            --json databaseId,headSha,headBranch,event,workflowName,status,conclusion,jobs \
            > target/release-recovery/source-run.json
          python3 scripts/verify-release-recovery-run.py \
            --run target/release-recovery/source-run.json \
            --run-id "$FAILED_RUN_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --failed-job assemble-release-channel
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" \
            = "$SOURCE_COMMIT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-site/pnpm-lock.yaml
      - run: cd release-site && pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-recovery
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen

      - name: Reuse qualified binary channel candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: target/binary-channel/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.failed_run_id }}

      - name: Require exact qualified candidate manifests
        run: |
          test -s "target/binary-channel/$RELEASE_CHANNEL/manifest.before.json"
          test -s "target/binary-channel/$RELEASE_CHANNEL/manifest.json"

      - name: Build complete release channel from qualified candidate
        run: |
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run python scripts/build-complete-release-channel.py \
            --channel-source "$RELEASE_CHANNEL=file://$PWD/target/binary-channel/$RELEASE_CHANNEL/manifest.json" \
            --primary-channel "$RELEASE_CHANNEL" \
            --asset-source-base "https://github.com/${{ github.repository }}/releases/download/assets-v{asset_version}" \
            --manifest-version "1.0.${{ github.run_number }}" \
            --generated-at "$generated_at" \
            --out-dir target/release-channel

      - name: Select the declared digest tool
        id: gate_tools
        run: |
          list=$(python3 scripts/gate-tool-list.py --sets digest)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt digest tool
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: ${{ steps.gate_tools.outputs.list }}

      - name: Verify public package storage from recovered candidate
        run: |
          manifest="target/release-channel/assets/$RELEASE_CHANNEL/manifest.json"
          expected_prefix="https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/"
          mkdir -p /tmp/candidate-packages
          count=0
          while IFS=$'\t' read -r name version sha256 blake3 url; do
            count=$((count + 1))
            test "$version" = "${RELEASE_TAG#v}"
            case "$url" in
              "$expected_prefix"*) ;;
              *) echo "::error::$name URL is outside $expected_prefix: $url"; exit 1 ;;
            esac
            curl -fsSL "$url" -o "/tmp/candidate-packages/$name"
            printf '%s  %s\n' "$sha256" "/tmp/candidate-packages/$name" | sha256sum -c -
            printf '%s  %s\n' "$blake3" "/tmp/candidate-packages/$name" | b3sum -c -
          done < <(python3 - "$manifest" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1]))
          for package in manifest.get("packages", []):
              if package.get("status") != "current":
                  continue
              digest = package.get("digest", {})
              print(
                  package.get("name", ""),
                  package.get("version", ""),
                  digest.get("sha256", ""),
                  digest.get("blake3", ""),
                  package.get("url", ""),
                  sep="\t",
              )
          PY
          )
          test "$count" -eq 3

      - name: Prove install.sh selects recovered candidate Linux package
        run: |
          python3 -m http.server 8765 --directory target/release-channel >/tmp/candidate-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/candidate-http.log' EXIT
          for _ in $(seq 1 20); do
            curl -fsSL "http://127.0.0.1:8765/assets/$RELEASE_CHANNEL/manifest.json" >/dev/null && break
            sleep 0.25
          done
          candidate_manifest="http://127.0.0.1:8765/assets/$RELEASE_CHANNEL/manifest.json"
          docker run --rm --network host \
            -e CAPSEM_MANIFEST_URL="$candidate_manifest" \
            -e CAPSEM_CHANNEL="$RELEASE_CHANNEL" \
            -e EXPECTED_VERSION="${RELEASE_TAG#v}" \
            ubuntu:24.04 bash -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y ca-certificates curl sudo
              useradd -m -s /bin/bash capsemtest
              printf "%s\n" "capsemtest ALL=(ALL) NOPASSWD:ALL" >/etc/sudoers.d/capsemtest
              chmod 0440 /etc/sudoers.d/capsemtest
              su capsemtest -c "curl -fsSL https://capsem.org/install.sh | CAPSEM_MANIFEST_URL=$CAPSEM_MANIFEST_URL CAPSEM_CHANNEL=$CAPSEM_CHANNEL sh"
              dpkg-query -W -f="\${Version}" capsem | grep -Fx "$EXPECTED_VERSION"
              su capsemtest -c "\$HOME/.capsem/bin/capsem --version" | grep -F "$EXPECTED_VERSION"
            '

      - name: Persist recovered source manifest on immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          owned="target/binary-source-publication"
          mkdir -p "$owned"
          cp "$source" "$owned/channel-source-$RELEASE_CHANNEL.json"
          scripts/publish-immutable-release-assets.sh "$RELEASE_TAG" "$owned"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-preview
          path: target/release-channel/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-before
          path: target/binary-channel/*/manifest.before.json

  deploy-release-channel:
    needs: [recover-release-channel]
    uses: ./.github/workflows/release-channel.yaml
    with:
      channel: ${{ inputs.channel }}
      dist_artifact: binary-channel-preview
      source_commit: ${{ github.sha }}
    secrets: inherit

  verify-release-downloads:
    needs: [deploy-release-channel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-before
          path: /tmp/binary-channel-before

      - name: Wait for release assets to be queryable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Verify every URL in the public channel manifest
        run: uv run python scripts/verify-channel-downloads.py --manifest-url "$ASSET_MANIFEST_URL"

      - name: Verify public release packages and installer contract
        run: |
          uv run python3 scripts/check-public-binary-release.py \
            --channel "$RELEASE_CHANNEL" \
            --manifest-url "$ASSET_MANIFEST_URL" \
            --install-script-url https://capsem.org/install.sh \
            --site-url https://capsem.org/ \
            --docker-transition-from-manifest "/tmp/binary-channel-before/$RELEASE_CHANNEL/manifest.before.json" \
            --work-dir /tmp/public-binary-release

      - name: Enable KVM for live public-install VM proof
        run: |
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          sudo modprobe vhost_vsock
          sudo chmod 0666 /dev/vhost-vsock
          test -r /dev/kvm -a -w /dev/kvm
          test -r /dev/vhost-vsock -a -w /dev/vhost-vsock

      - name: Install live public Linux release and prove guest shell execution
        run: |
          EXPECTED_VERSION="$(python3 - <<'PY'
          import json

          manifest = json.load(open('/tmp/verify/manifest.json'))
          matches = [
              package
              for package in manifest.get('packages', [])
              if package.get('platform') == 'linux'
              and package.get('architecture') == 'amd64'
          ]
          if len(matches) != 1 or not isinstance(matches[0].get('version'), str):
              raise SystemExit('manifest must contain exactly one versioned linux/amd64 package')
          print(matches[0]['version'])
          PY
          )"
          curl -fsSL https://capsem.org/install.sh | CAPSEM_CHANNEL="$RELEASE_CHANNEL" sh
          test -x "$HOME/.capsem/bin/capsem"
          test -x /usr/bin/capsem-app
          "$HOME/.capsem/bin/capsem" --version | grep -F "$EXPECTED_VERSION"
          dpkg-query -W -f='${Version}' capsem | grep -Fx "$EXPECTED_VERSION"
          for bin in capsem capsem-admin capsem-gateway capsem-mcp capsem-mcp-aggregator capsem-mcp-builtin capsem-process capsem-service capsem-tray capsem-tui capsem-mock-server capsem-bench-rs; do
            test -x "$HOME/.capsem/bin/$bin"
            "$HOME/.capsem/bin/$bin" --version | grep -F "$EXPECTED_VERSION"
          done
          grep -F "$ASSET_MANIFEST_URL" "$HOME/.capsem/assets/manifest-metadata.json"
          "$HOME/.capsem/bin/capsem" status | tee /tmp/capsem-live-status.txt
          grep -F "Installed: true" /tmp/capsem-live-status.txt
          grep -F "Running:   true" /tmp/capsem-live-status.txt
          grep -F "Service:   ok" /tmp/capsem-live-status.txt
          grep -F "Gateway:   ok" /tmp/capsem-live-status.txt
          python3 scripts/verify-installed-release.py \
            --capsem "$HOME/.capsem/bin/capsem" \
            --manifest-url "$ASSET_MANIFEST_URL" \
            --channel "$RELEASE_CHANNEL" \
            --package-version "$EXPECTED_VERSION"
          python3 scripts/prove-installed-shell.py \
            --capsem "$HOME/.capsem/bin/capsem" \
            --marker CAPSEM_LIVE_PUBLIC_INSTALL_SHELL_OK \
            --session-name release-live-public-shell-x86_64 \
            --timeout 300
