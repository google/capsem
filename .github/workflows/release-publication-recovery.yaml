name: Recover Qualified Release Publication
run-name: Recover ${{ inputs.channel }} ${{ inputs.tag }} from run ${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Terminal Release run that failed only at channel assembly.
        required: true
        type: string
      source_commit:
        description: Exact source commit qualified by the failed Release run.
        required: true
        type: string
      tag:
        description: Existing immutable GitHub Release tag.
        required: true
        type: string
      channel:
        description: Channel whose qualified publication is being recovered.
        required: true
        type: choice
        options:
          - stable
          - nightly

concurrency:
  group: capsem-release-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  deployments: write

env:
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_CHANNEL: ${{ inputs.channel }}
  ASSET_MANIFEST_URL: https://release.capsem.org/assets/${{ inputs.channel }}/manifest.json

jobs:
  recover-release-channel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: main
          fetch-depth: 0

      - name: Require recovery tooling from current main
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Verify qualified source release stopped only at assembly
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          mkdir -p cache/target/release-recovery
          gh run view "$FAILED_RUN_ID" \
            --json databaseId,headSha,headBranch,event,workflowName,status,conclusion,jobs \
            > cache/target/release-recovery/source-run.json
          python3 build_system/scripts/release/verify-release-recovery-run.py \
            --run cache/target/release-recovery/source-run.json \
            --run-id "$FAILED_RUN_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --failed-job assemble-release-channel
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" \
            = "$SOURCE_COMMIT"

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: build_system/release_site/pnpm-lock.yaml
      - run: cd build_system/release_site && pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-recovery
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen

      - name: Reuse qualified binary channel candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-candidate
          path: cache/target/binary-channel/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.failed_run_id }}

      - name: Require exact qualified candidate manifests
        run: |
          test -s "cache/target/binary-channel/$RELEASE_CHANNEL/manifest.before.json"
          test -s "cache/target/binary-channel/$RELEASE_CHANNEL/manifest.json"

      - name: Build complete release channel from qualified candidate
        run: |
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run --project build_system --frozen python build_system/scripts/release/build-complete-release-channel.py \
            --channel-source "$RELEASE_CHANNEL=file://$PWD/cache/target/binary-channel/$RELEASE_CHANNEL/manifest.json" \
            --primary-channel "$RELEASE_CHANNEL" \
            --asset-source-base "https://github.com/${{ github.repository }}/releases/download/assets-v{asset_version}" \
            --manifest-version "1.0.${{ github.run_number }}" \
            --generated-at "$generated_at" \
            --out-dir cache/target/distribution

      - name: Verify public package storage from recovered candidate
        run: |
          uv run --project build_system --frozen python build_system/scripts/release/release-package-contract.py verify-storage \
            --manifest "cache/target/distribution/assets/$RELEASE_CHANNEL/manifest.json" \
            --expected-prefix "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/" \
            --expected-version "${RELEASE_TAG#v}" \
            --work-dir /tmp/candidate-packages

      - name: Prove install.sh selects recovered candidate Linux package
        run: >
          build_system/scripts/release/prove-candidate-installer.sh cache/target/distribution
          "$RELEASE_CHANNEL" "${RELEASE_TAG#v}"

      - name: Persist recovered source manifest on immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source="cache/target/binary-channel/$RELEASE_CHANNEL/manifest.json"
          owned="cache/target/binary-source-publication"
          mkdir -p "$owned"
          cp "$source" "$owned/channel-source-$RELEASE_CHANNEL.json"
          build_system/scripts/release/publish-immutable-release-assets.sh "$RELEASE_TAG" "$owned"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-preview
          path: cache/target/distribution/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-before
          path: cache/target/binary-channel/*/manifest.before.json

  deploy-release-channel:
    needs: [recover-release-channel]
    uses: ./.github/workflows/release-channel.yaml
    with:
      channel: ${{ inputs.channel }}
      dist_artifact: binary-channel-preview
      source_commit: ${{ github.sha }}
    secrets: inherit

  verify-release-downloads:
    needs: [deploy-release-channel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --project build_system --frozen
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: binary-channel-before
          path: /tmp/binary-channel-before

      - name: Wait for release assets to be queryable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Verify every URL in the public channel manifest
        run: uv run --project build_system --frozen python build_system/scripts/release/verify-channel-downloads.py --manifest-url "$ASSET_MANIFEST_URL"

      - name: Verify public release packages and installer contract
        run: |
          uv run --project build_system --frozen python3 build_system/scripts/release/check-public-binary-release.py \
            --channel "$RELEASE_CHANNEL" \
            --manifest-url "$ASSET_MANIFEST_URL" \
            --install-script-url https://capsem.org/install.sh \
            --site-url https://capsem.org/ \
            --docker-transition-from-manifest "/tmp/binary-channel-before/$RELEASE_CHANNEL/manifest.before.json" \
            --work-dir /tmp/public-binary-release

      - name: Enable KVM for live public-install VM proof
        run: |
          sudo modprobe kvm
          sudo chmod 0666 /dev/kvm
          sudo modprobe vhost_vsock
          sudo chmod 0666 /dev/vhost-vsock
          test -r /dev/kvm -a -w /dev/kvm
          test -r /dev/vhost-vsock -a -w /dev/vhost-vsock

      - name: Install live public Linux release and prove guest shell execution
        run: >
          build_system/scripts/build/prove-live-public-install.sh /tmp/verify/manifest.json
          "$ASSET_MANIFEST_URL" "$RELEASE_CHANNEL"
