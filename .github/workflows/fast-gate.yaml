name: Reusable fast and static gate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1
          components: llvm-tools
          targets: aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: reusable-static-gate

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            docs/pnpm-lock.yaml
            site/pnpm-lock.yaml
            release-site/pnpm-lock.yaml

      - name: Install Linux workspace lint prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap \
            musl-tools \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      - name: Install prebuilt Rust gate tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: cargo-audit@0.22.1,cargo-nextest@0.9.137,cargo-llvm-cov@0.8.5,b3sum@1.8.5,cargo-sbom@0.10.0,tauri-cli@2.11.1

      # The checked-in modules enter Bubblewrap before their first plan step.
      # Resolve only locked dependencies here; qualification itself must have
      # no route back to a registry on a cold runner.
      - name: Materialize locked qualification dependencies
        run: |
          uv sync --frozen
          cargo fetch --locked
          for workspace in frontend docs site release-site; do
            pnpm --dir "$workspace" install --frozen-lockfile
          done

      - name: Run complete shared fast module
        run: just _test-fast

      - name: Run shared static module
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: just _test-static
