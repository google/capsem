name: Stage Binary Channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Dry-run binary version to record in the staged channel.
        required: true
        default: 1.4.9999999999
      asset_channel:
        description: Existing VM asset channel to use as the staging source.
        required: true
        type: choice
        options:
          - stable
          - nightly
      manifest_version:
        description: Staged manifest contract version.
        required: true
        default: 1.0.2

permissions:
  contents: read

env:
  ASSET_CHANNEL: ${{ inputs.asset_channel }}

jobs:
  assemble-binary-channel:
    runs-on: ubuntu-latest
    name: Assemble binary channel dry run
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-site/pnpm-lock.yaml
      - name: Install release site dependencies
        run: cd release-site && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-binary-staging

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Write deterministic host release artifacts
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          bash scripts/write-binary-staging-artifacts.sh \
            "$VERSION" release-artifacts "$RUNNER_TEMP/binary-staging-packages"
          ls -lh release-artifacts/

      - name: Resolve serialized channel source manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$ASSET_CHANNEL" in stable|nightly) ;; *) exit 1 ;; esac
          uv run python scripts/fetch-channel-source-manifest.py \
            --channel "$ASSET_CHANNEL" \
            --source-commit "${{ github.sha }}" \
            --require-profile-membership \
            --output "$RUNNER_TEMP/binary-channel-dry-run/manifest.json"
          cp "$RUNNER_TEMP/binary-channel-dry-run/manifest.json" \
            "$RUNNER_TEMP/binary-channel-dry-run/manifest.before.json"

      - name: Record binary release metadata in channel manifest
        run: |
          set -euo pipefail
          ARTIFACT_ARGS=()
          for file in release-artifacts/*.pkg release-artifacts/*.deb release-artifacts/capsem-sbom.spdx.json; do
            [ -f "$file" ] && ARTIFACT_ARGS+=(--artifact "$file")
          done
          cargo run -p capsem-admin -- assets channel record-binary \
            --manifest-path "$RUNNER_TEMP/binary-channel-dry-run/manifest.json" \
            --version "${{ inputs.version }}" \
            --source-commit "${{ github.sha }}" \
            "${ARTIFACT_ARGS[@]}" \
            --json | tee "$RUNNER_TEMP/binary-channel-dry-run/record-binary.json"

      - name: Prove VM asset metadata did not change
        run: >-
          uv run python scripts/write-binary-channel-staging-proof.py
          "$RUNNER_TEMP/binary-channel-dry-run"

      - name: Build complete binary channel preview with existing VM assets
        run: |
          set -euo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          uv run python scripts/build-complete-release-channel.py \
            --channel-source "$ASSET_CHANNEL=file://$RUNNER_TEMP/binary-channel-dry-run/manifest.json" \
            --primary-channel "$ASSET_CHANNEL" \
            --asset-source-base "https://github.com/${{ github.repository }}/releases/download/assets-v{asset_version}" \
            --manifest-version "${{ inputs.manifest_version }}" \
            --generated-at "$generated_at" \
            --out-dir "$RUNNER_TEMP/release-channel"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-channel-dry-run-bundle
          path: |
            release-artifacts/
            ${{ runner.temp }}/binary-channel-dry-run/
            ${{ runner.temp }}/release-channel/
