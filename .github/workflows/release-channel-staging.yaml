name: Stage Asset Channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Staging asset channel name.
        required: true
        default: staging
      deploy_branch:
        description: Cloudflare Pages preview branch to publish.
        required: true
        default: staging
      release_site_url:
        description: Cloudflare Pages preview URL for the deploy branch.
        required: true
        default: https://staging.release-eq7.pages.dev
      manifest_version:
        description: Staged manifest contract version.
        required: true
        default: 1.0.2

permissions:
  contents: read
  deployments: write

jobs:
  assemble-staging-channel:
    runs-on: ubuntu-latest
    name: Assemble staging asset channel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: release-site/pnpm-lock.yaml
      - name: Install release site dependencies
        run: cd release-site && pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install locked Python dependencies
        run: uv sync --project build_system --frozen

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: release-channel-staging

      - name: Assemble and validate staging release channel
        run: |
          bash scripts/rehearse-asset-channel-staging.sh \
            "${{ inputs.channel }}" \
            "${{ inputs.manifest_version }}" \
            "$RUNNER_TEMP/release-channel-staging-fixture" \
            "$RUNNER_TEMP/release-channel" \
            "$RUNNER_TEMP/release-channel-staging-validation"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: asset-channel-staging-preview
          path: ${{ runner.temp }}/release-channel/

  deploy-staging-channel:
    needs: assemble-staging-channel
    uses: ./.github/workflows/release-channel.yaml
    with:
      channel: ${{ inputs.channel }}
      dist_artifact: asset-channel-staging-preview
      deploy_branch: ${{ inputs.deploy_branch }}
      release_site_url: ${{ inputs.release_site_url }}
      validate_complete_public_channels: false
      activate_production: false
    secrets: inherit
