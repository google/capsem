name: Security Audit
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - name: Materialize the locked audit environment
        run: uv sync --project build_system --frozen

      - name: Select the declared tool set
        id: gate_tools
        run: |
          list=$(python3 build_system/scripts/ci/gate-tool-list.py --sets advisory)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt Rust tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: ${{ steps.gate_tools.outputs.list }}

      - name: Resolve the current Rust dependency graph
        run: cargo generate-lockfile

      - name: Locked Python and Node OSV audit (blocking security signal)
        run: uv run --project build_system --frozen python build_system/scripts/audit/audit-dependencies.py

      - name: Strict RustSec audit (runs only after OSV is clean)
        run: uv run --project build_system --frozen python build_system/scripts/audit/check-cargo-audit.py
