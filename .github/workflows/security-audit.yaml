name: Security Audit
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.97.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/app/pnpm-lock.yaml
            web/docs/pnpm-lock.yaml
            web/marketing/pnpm-lock.yaml
            build_system/release_site/pnpm-lock.yaml

      - name: Select the declared tool set
        id: gate_tools
        run: |
          list=$(python3 build_system/scripts/ci/gate-tool-list.py --sets advisory)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: Install prebuilt Rust tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b
        with:
          tool: ${{ steps.gate_tools.outputs.list }}

      - name: Resolve the current Rust dependency graph
        run: cargo generate-lockfile

      - name: Strict RustSec audit (blocking vulnerabilities, unsoundness, and yanks)
        run: python3 build_system/scripts/audit/check-cargo-audit.py

      - name: Locked Python dependency audit (blocking security signal)
        run: bash build_system/scripts/audit/audit-python-lock.sh

      - name: Install all web dependencies
        run: |
          for project in web/app web/docs web/marketing build_system/release_site; do
            pnpm --dir "$project" install --frozen-lockfile
          done

      - name: npm bulk advisory audit (blocking security signal)
        run: python3 build_system/scripts/audit/audit-pnpm-bulk.py
