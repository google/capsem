name: Publish Docs
on:
  push:
    branches: [main]
    # Architecture statistics follow source changes as well as documentation changes.
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docs.yaml
      - web/docs/**
      - build_system/builder/docs_metrics/**
      - build_system/tests/docs_metrics/**
      - build_system/pyproject.toml
      - build_system/uv.lock
      - web/diagrams/**
      - build_system/patches/**
      - skills/use-capsem/**
      - sdk/**
      - mcp/typescript/**

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build docs
    permissions:
      contents: read
      actions: read
      deployments: write

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.34.5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/docs/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Install
        run: pnpm --dir web/docs install --frozen-lockfile
      - name: Install SDK and MCP dependencies
        run: pnpm --dir mcp/typescript install --frozen-lockfile
      - name: Build TypeScript SDK declarations
        run: pnpm --dir sdk/typescript run build
      - name: Build MCP server
        run: pnpm --dir mcp/typescript run build
      - name: Generate Python and TypeScript API references
        run: uv run --project build_system --frozen python web/docs/tools/generate-sdk-reference.py --languages python typescript
      - name: Generate MCP tool reference
        run: node web/docs/tools/mcp-reference.mjs
      - name: Test reference generators
        run: |
          uv run --project build_system --frozen python -m pytest web/docs/tools/test_sdk_reference.py -q
          node --test web/docs/tools/test-mcp-reference.mjs
      - name: Test documentation metrics collectors
        run: uv run --project build_system --frozen --group docs python -m pytest -c build_system/pyproject.toml --rootdir . build_system/tests/docs_metrics --no-cov -q
      - name: Reject stale references in pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --exit-code -- web/docs/src/content/docs/sdk/python.md web/docs/src/content/docs/sdk/typescript.md web/docs/src/content/docs/reference/mcp.md
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build_system/scripts/web/check-web-surface.sh docs
      - name: Type check docs
        run: pnpm --dir web/docs exec astro check --minimumFailingSeverity warning
      - name: Install browser for documentation checks
        run: uv run --project build_system --frozen --group docs python -m playwright install --with-deps chromium
      - name: Check interactive metrics pages on desktop and mobile
        run: uv run --project build_system --frozen --group docs python web/docs/tools/check-metrics-browser.py
      - name: Deploy
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/docs/dist/ --project-name=capsem-docs
      - name: Smoke public docs site
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          SITE_URL: https://docs.capsem.org
        run: bash build_system/scripts/web/smoke-docs-site.sh
