name: Daily nightly orthogonal release

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: capsem-nightly-release-scheduler
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

# Spec 13.2: freeze `github.sha`, invoke the public profile command for each
# selected profile, then the binary command. One job keeps that SHA frozen
# across all three lanes.
#
# This runner builds nothing and boots nothing: each command validates, creates
# the immutable source ref, dispatches its lane and waits. The lane does the
# work, and proves it with `qualify-assets` or `qualify-binaries` before
# publishing anything -- which is why nightly needs no local qualification and
# why `[release].locally_qualified_channels` does not list it.
jobs:
  nightly-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # `actions/checkout` leaves a detached HEAD, so there is no local `main`
      # here. Every release command refuses a subject commit that is not
      # already on local `main`, which is the guard that keeps an arbitrary
      # commit from being published, and it read an absence as a refusal.
      #
      # Point a local branch at the remote one rather than relaxing the guard:
      # a dispatch from a branch whose head is genuinely not on `main` still
      # fails, which is the case worth refusing.
      - name: Give the release guard a local main to read
        run: git branch -f main origin/main

      # Publishing the immutable source ref is a `git push` over HTTPS, from a
      # detached private prefix under ~/.cg that never saw the checkout's
      # credential header. A token in the environment is not a git credential:
      # git asks for a username, finds no terminal, and the release fails
      # having built nothing. Rewrite the origin URL once, globally, so the
      # prefix inherits it.
      - name: Let git authenticate as the workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Bootstrap complete release host
        env:
          CAPSEM_SKIP_ASSET_CHECK: "1"
        run: sh bootstrap.sh --yes

      # Profiles first, then binaries: a profile needing new code is published
      # immutably but stays inactive until the following binary release
      # activates the compatible graph.
      - name: Release nightly code profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-profile nightly code ${{ github.sha }}

      - name: Release nightly co-work profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-profile nightly co-work ${{ github.sha }}

      - name: Release nightly binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-binaries nightly ${{ github.sha }}
