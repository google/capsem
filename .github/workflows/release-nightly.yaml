name: Daily nightly orthogonal release

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: capsem-nightly-release-scheduler
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  release-profiles:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [code, co-work]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Bootstrap complete release host
        env:
          CAPSEM_SKIP_ASSET_CHECK: "1"
        run: sh bootstrap.sh --yes

      - name: Rebuild nightly ${{ matrix.profile }} profile assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-profile nightly ${{ matrix.profile }} ${{ github.sha }}

  release-binaries:
    needs: release-profiles
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Bootstrap complete release host
        env:
          CAPSEM_SKIP_ASSET_CHECK: "1"
        run: sh bootstrap.sh --yes

      - name: Rebuild or release nightly binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just release-binaries nightly ${{ github.sha }}
