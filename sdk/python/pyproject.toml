[project]
name = "capsem"
version = "0.6.3"
description = "Typed async client for the Capsem HTTP gateway"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "pydantic>=2.10,<3", "yarl>=1.20,<2"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capsem"]

[dependency-groups]
dev = ["pytest>=9", "pytest-cov>=6", "ruff>=0.15.16", "ty>=0.0.46", "build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = "--cov=capsem --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["capsem"]
data_file = "../../cache/target/coverage/sdk-python.coverage"

[tool.coverage.report]
precision = 2
fail_under = 90

[tool.ty.environment]
python-version = "3.11"
