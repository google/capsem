[package]
name = "capsem-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed async clients for the Capsem HTTP gateway"
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
capsem-api = { path = "../../crates/capsem-api", version = "0.7.0" }
capsem-crypto = { path = "../../crates/capsem-crypto", version = "0.7.0", default-features = false, features = ["random", "secrets"] }
capsem-foundation = { path = "../../crates/capsem-foundation", version = "0.7.0" }
futures.workspace = true
humantime.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
axum.workspace = true
tempfile = "3"

[lints]
workspace = true
