# T0 review snapshot. Once capsem-server lands, this file is generated by
# `capsem-server openapi user --format yaml`; hand edits are forbidden.
openapi: 3.1.0
info:
  title: Capsem Server User API
  version: 0.7.0-draft
  description: |
    User-scoped remote API for Capsem. Every route below /v1/user/{user_id}
    requires deployment authentication and rejects a path user_id that does
    not match the authenticated subject. The private Capsem gateway token and
    broker references are never returned to a client.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: system
  - name: profiles
  - name: sessions
  - name: credentials
  - name: files
  - name: streams
paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      security: []
      summary: Process health without deployment, worker, or user details
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/user/{user_id}/info:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [system]
      operationId: getUserServerInfo
      summary: Get this user's safe server and engine compatibility view
      responses:
        "200":
          description: Safe compatibility information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserServerInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UserMismatch"
  /v1/user/{user_id}/openapi.json:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [system]
      operationId: getUserOpenApi
      summary: Get the user API document generated from the running router
      responses:
        "200":
          description: Authoritative OpenAPI document for the user router
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/UserMismatch"
  /v1/user/{user_id}/profiles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [profiles]
      operationId: listUserProfiles
      summary: List profiles this user may create
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Authorized profiles
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProfileSummary"
                  next_cursor:
                    type: string
        "403":
          $ref: "#/components/responses/UserMismatch"
  /v1/user/{user_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [sessions]
      operationId: listUserSessions
      summary: List only sessions owned by this user, newest created_at first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: User-scoped sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSessionList"
        "403":
          $ref: "#/components/responses/UserMismatch"
    post:
      tags: [sessions]
      operationId: createUserSession
      summary: Create a session owned by this user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created through the synchronous engine route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/UserMismatch"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/IdempotencyMismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/user/{user_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getUserSession
      summary: Get one session owned by this user
      responses:
        "200":
          description: Safe session info and status aggregation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      operationId: deleteUserSession
      summary: Synchronously delete the session and terminal checkpoint
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/start:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: startUserSession
      summary: Start a stopped session
      responses:
        "200":
          description: Started session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/sessions/{session_id}/stop:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: stopUserSession
      summary: Stop a running session after ordered guest and checkpoint shutdown
      responses:
        "200":
          description: Session stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/sessions/{session_id}/pause:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: pauseUserSession
      summary: Suspend a running session after final terminal checkpoint
      responses:
        "200":
          description: Session suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/sessions/{session_id}/resume:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [sessions]
      operationId: resumeUserSession
      summary: Resume a suspended session and continuing terminal epoch
      responses:
        "200":
          description: Resumed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/sessions/{session_id}/stats:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getUserSessionStats
      summary: Get live compact stats through the logger-owned query boundary
      responses:
        "200":
          description: Live totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/enforcement/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getUserSessionEnforcementStatus
      summary: Get the existing enforcement status projection for this session
      responses:
        "200":
          description: Enforcement status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/detection/status:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getUserSessionDetectionStatus
      summary: Get the existing detection status projection for this session
      responses:
        "200":
          description: Detection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleStatus"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/credentials/{alias}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/CredentialAlias"
    put:
      tags: [credentials]
      operationId: putUserSessionCredential
      summary: Capture or rotate raw credential material and issue a session-bound grant
      description: |
        This is the only user API that accepts raw secret material. The server
        authenticates the caller, resolves the opaque session id, and forwards
        the input without persisting or interpreting it. The engine captures
        the material and atomically issues the private session-bound grant.
        Neither material refs nor grant ids are exposed by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCredentialInput"
      responses:
        "200":
          description: Credential captured and bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialBindingStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [credentials]
      operationId: revokeUserSessionCredentialBinding
      summary: Remove the binding and synchronously rematerialize affected consumers
      responses:
        "200":
          description: Binding removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/files:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [files]
      operationId: listUserSessionFiles
      summary: List authorized guest workspace files
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: /workspace
            maxLength: 4096
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: File entries
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileEntry"
                  next_cursor:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/files/content:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
      - name: path
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    get:
      tags: [files]
      operationId: readUserSessionFile
      summary: Download one authorized non-secret guest file
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [files]
      operationId: writeUserSessionFile
      summary: Atomically upload one authorized guest file using the existing POST semantic
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              x-capsem-max-bytes: 10485760
      responses:
        "200":
          description: File written and ledger boundary accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileWriteResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/user/{user_id}/sessions/{session_id}/terminal:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [streams]
      operationId: connectUserTerminal
      summary: Upgrade to the versioned terminal snapshot/history/live protocol
      x-capsem-websocket:
        protocol: capsem-terminal.v1
        encoding: messagepack
        clientMessages:
          $ref: "#/components/schemas/TerminalClientMessage"
        serverMessages:
          $ref: "#/components/schemas/TerminalServerMessage"
      responses:
        "101":
          description: WebSocket upgrade; first client message is Attach
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/sessions/{session_id}/gui:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [streams]
      operationId: connectUserGui
      summary: Upgrade to the byte-transparent Xpra GUI stream
      x-capsem-websocket:
        protocol: binary
        maxMessageBytes: 67108864
        relayChunkBytes: 33554432
      responses:
        "101":
          description: WebSocket upgrade using Xpra's binary subprotocol
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/user/{user_id}/events:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [streams]
      operationId: connectUserEvents
      summary: Upgrade to this user's filtered typed SessionEvent stream
      parameters:
        - $ref: "#/components/parameters/Cursor"
      x-capsem-websocket:
        protocol: capsem-events.v1
        encoding: messagepack
        filtering: Only sessions owned by the path and authenticated user
        serverMessages:
          $ref: "#/components/schemas/SessionEventEnvelope"
      responses:
        "101":
          description: WebSocket upgrade; replay is followed by live events
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: deployment-defined
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: Stable server user id; must match the authenticated subject mapping
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.@:-]{0,255}$"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Opaque server session id; never a display name or filesystem key
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{20,128}$"
    CredentialAlias:
      name: alias
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_.-]{0,62}$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque integrity-tagged cursor. Cursor kinds are route-specific and are never interchangeable.
      schema:
        type: string
        maxLength: 16384
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 512
        default: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
  responses:
    Unauthorized:
      description: Missing or invalid deployment authentication
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UserMismatch:
      description: The path user_id does not match the authenticated user
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated user is not authorized for this resource
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found; another user's resource uses the same response
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidRequest:
      description: Schema or semantic validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyMismatch:
      description: The idempotency key was previously reserved for a different request body
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Profile, credential, or lifecycle state conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: User or endpoint quota exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OpenApiDocument:
      type: object
      additionalProperties: true
      description: OpenAPI 3.1 document generated from the same typed route registry as the running router.
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        request_id:
          type: string
    UserServerInfo:
      type: object
      additionalProperties: false
      required:
        - api_version
        - server_version
        - engine_version
        - compatible
        - features
        - user_id
      properties:
        api_version:
          const: v1
        server_version:
          type: string
        engine_version:
          type: string
        compatible:
          type: boolean
        compatibility_error:
          type: string
        features:
          type: array
          uniqueItems: true
          items:
            enum:
              - terminal.v1
              - terminal-history.v1
              - events.v1
              - gui-xpra.v1
              - session-spec.v0.7
              - credential-rotation.v1
        user_id:
          type: string
    ProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, description, revision, surfaces]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        revision:
          type: string
        surfaces:
          type: array
          uniqueItems: true
          items:
            enum: [terminal, gui]
        credential_aliases:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [alias, provider, required_scopes]
            properties:
              alias:
                type: string
              provider:
                $ref: "#/components/schemas/CredentialProvider"
              required_scopes:
                type: array
                items:
                  type: string
    CredentialProvider:
      type: string
      enum: [anthropic, google, openai, github, mcp]
      description: Generated from the closed capsem-core CredentialProvider enum.
    CredentialTargetKind:
      type: string
      enum: [terminal_env, gui_env, exec_env, file, rewrite, keyring, service]
    CredentialTarget:
      oneOf:
        - $ref: "#/components/schemas/TerminalEnvCredentialTarget"
        - $ref: "#/components/schemas/GuiEnvCredentialTarget"
        - $ref: "#/components/schemas/ExecEnvCredentialTarget"
        - $ref: "#/components/schemas/FileCredentialTarget"
        - $ref: "#/components/schemas/RewriteCredentialTarget"
        - $ref: "#/components/schemas/KeyringCredentialTarget"
        - $ref: "#/components/schemas/ServiceCredentialTarget"
    TerminalEnvCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, name]
      properties:
        target: { const: terminal_env }
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    GuiEnvCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, name]
      properties:
        target: { const: gui_env }
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    ExecEnvCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, name]
      properties:
        target: { const: exec_env }
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    FileCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, path]
      properties:
        target: { const: file }
        path: { type: string, pattern: "^/" }
        mode: { type: integer, minimum: 0, maximum: 4095, default: 384 }
        owner: { type: string, maxLength: 128 }
        group: { type: string, maxLength: 128 }
        format: { enum: [raw, json_string, bearer], default: raw }
    RewriteCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, rewrite_id]
      properties:
        target: { const: rewrite }
        rewrite_id: { type: string }
    KeyringCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, schema, attributes]
      properties:
        target: { const: keyring }
        schema: { type: string, maxLength: 256 }
        attributes:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 1024 }
    ServiceCredentialTarget:
      type: object
      additionalProperties: false
      required: [target, service_id, name]
      properties:
        target: { const: service }
        service_id: { type: string }
        name: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
    SessionSpec:
      type: object
      additionalProperties: false
      required: [profile_id]
      description: Generated local OpenAPI component from the same strict Rust SessionSpec that emits v0.7-session-spec.schema.json.
      properties:
        profile_id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
        profile_revision:
          type: string
          maxLength: 128
        cmd:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: string
            minLength: 1
            maxLength: 4096
        fortune:
          type: string
          maxLength: 4096
        env:
          type: object
          maxProperties: 128
          additionalProperties:
            type: string
            maxLength: 16384
        files:
          type: array
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [path, blob_base64]
            properties:
              path: { type: string, pattern: "^/" }
              blob_base64: { type: string, format: byte, maxLength: 11184812 }
              mode: { type: integer, minimum: 0, maximum: 4095, default: 384 }
              owner: { type: string, maxLength: 128 }
              group: { type: string, maxLength: 128 }
              replace: { type: boolean, default: false }
              credential_bearing: { type: boolean, default: false }
        rewrites:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, path, edits]
            properties:
              id: { type: string }
              path: { type: string, pattern: "^/" }
              edits:
                type: array
                minItems: 1
                maxItems: 32
                items:
                  type: object
                  additionalProperties: false
                  required: [pattern, replacement]
                  properties:
                    pattern: { type: string, maxLength: 4096 }
                    replacement: { type: string, maxLength: 16384 }
                    required: { type: boolean, default: true }
                    min_matches: { type: integer, minimum: 0, maximum: 1024, default: 1 }
                    max_matches: { type: integer, minimum: 1, maximum: 1024, default: 1 }
        credentials:
          type: array
          maxItems: 32
          items:
            type: object
            description: Declares a requested binding; it carries no authority until credential material is supplied through the binding endpoint.
            additionalProperties: false
            required: [alias, provider, targets]
            properties:
              alias: { type: string }
              provider: { $ref: "#/components/schemas/CredentialProvider" }
              scopes:
                type: array
                uniqueItems: true
                items: { type: string }
              expires_at: { type: string, format: date-time }
              targets:
                type: array
                minItems: 1
                maxItems: 16
                items:
                  $ref: "#/components/schemas/CredentialTarget"
        services:
          type: array
          maxItems: 16
          items: { $ref: "#/components/schemas/SessionService" }
        rules:
          type: object
          additionalProperties: false
          properties:
            enforcement: { type: array, items: { type: string } }
            detection: { type: array, items: { type: string } }
    SessionService:
      type: object
      additionalProperties: false
      required: [id, kind, cmd, run_as, readiness]
      properties:
        id: { type: string }
        kind: { enum: [daemon, fuse] }
        cmd:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 4096 }
        run_as: { type: string, minLength: 1, maxLength: 128 }
        before_primary: { type: boolean, default: true }
        restart: { enum: [never, on_failure], default: on_failure }
        stop_timeout_ms: { type: integer, minimum: 100, maximum: 60000, default: 5000 }
        mount: { $ref: "#/components/schemas/SessionMount" }
        readiness: { $ref: "#/components/schemas/SessionReadiness" }
    SessionMount:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: { type: string, pattern: "^/" }
        owner: { type: string, maxLength: 128 }
        group: { type: string, maxLength: 128 }
        mode: { type: integer, minimum: 0, maximum: 4095 }
        cache_path: { type: string, pattern: "^/" }
        cache_max_bytes: { type: integer, minimum: 0, maximum: 68719476736 }
        writeback: { enum: [none, writes, full] }
    SessionReadiness:
      type: object
      additionalProperties: false
      required: [kind, timeout_ms]
      properties:
        kind: { enum: [process, path, mountpoint, exec] }
        timeout_ms: { type: integer, minimum: 100, maximum: 300000 }
        path: { type: string, pattern: "^/" }
        cmd:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, minLength: 1, maxLength: 4096 }
    TerminalId:
      type: integer
      minimum: 0
      maximum: 0
      default: 0
      description: Reserved v0.7 terminal identifier; only PRIMARY (0) is accepted.
    TerminalClientMessage:
      oneOf:
        - $ref: "#/components/schemas/TerminalAttach"
        - $ref: "#/components/schemas/TerminalHistoryBefore"
        - $ref: "#/components/schemas/TerminalInput"
        - $ref: "#/components/schemas/TerminalResize"
        - $ref: "#/components/schemas/TerminalControlRequest"
    TerminalAttach:
      type: object
      additionalProperties: false
      required: [type, rows, cols]
      properties:
        type: { const: attach }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        after_live_sequence: { type: integer, minimum: 0 }
        after_event_sequence: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 1, maximum: 1000 }
        cols: { type: integer, minimum: 1, maximum: 1000 }
        request_control: { type: boolean, default: false }
    TerminalHistoryBefore:
      type: object
      additionalProperties: false
      required: [type, epoch, limit]
      properties:
        type: { const: history_before }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        epoch: { type: integer, minimum: 0 }
        before_row_id: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 512 }
    TerminalInput:
      type: object
      additionalProperties: false
      required: [type, bytes]
      properties:
        type: { const: input }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        bytes: { type: string, format: byte, maxLength: 87384 }
    TerminalResize:
      type: object
      additionalProperties: false
      required: [type, rows, cols]
      properties:
        type: { const: resize }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        rows: { type: integer, minimum: 1, maximum: 1000 }
        cols: { type: integer, minimum: 1, maximum: 1000 }
    TerminalControlRequest:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { enum: [acquire_control, release_control] }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
    TerminalServerMessage:
      oneOf:
        - $ref: "#/components/schemas/TerminalSnapshot"
        - $ref: "#/components/schemas/TerminalHistoryPage"
        - $ref: "#/components/schemas/TerminalOutput"
        - $ref: "#/components/schemas/TerminalControlState"
        - $ref: "#/components/schemas/TerminalEvent"
        - $ref: "#/components/schemas/TerminalResnapshotRequired"
    TerminalRow:
      type: object
      additionalProperties: false
      required: [text, created_cols, soft_wrapped]
      properties:
        row_id: { type: integer, minimum: 0 }
        text: { type: string }
        created_cols: { type: integer, minimum: 1, maximum: 1000 }
        soft_wrapped: { type: boolean }
    TerminalSnapshot:
      type: object
      additionalProperties: false
      required: [type, epoch, generation, live_sequence, event_sequence, rows, cols, alternate_screen, viewport]
      properties:
        type: { const: snapshot }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        epoch: { type: integer, minimum: 0 }
        generation: { type: integer, minimum: 0 }
        live_sequence: { type: integer, minimum: 0 }
        event_sequence: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 1 }
        cols: { type: integer, minimum: 1 }
        alternate_screen: { type: boolean }
        oldest_available_row_id: { type: integer, minimum: 0 }
        newest_available_row_id: { type: integer, minimum: 0 }
        viewport: { type: array, items: { $ref: "#/components/schemas/TerminalRow" } }
    TerminalHistoryPage:
      type: object
      additionalProperties: false
      required: [type, epoch, rows, retention_gap]
      properties:
        type: { const: history_page }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        epoch: { type: integer, minimum: 0 }
        rows: { type: array, maxItems: 512, items: { $ref: "#/components/schemas/TerminalRow" } }
        oldest_available_row_id: { type: integer, minimum: 0 }
        newest_available_row_id: { type: integer, minimum: 0 }
        retention_gap: { type: boolean }
    TerminalOutput:
      type: object
      additionalProperties: false
      required: [type, sequence, bytes]
      properties:
        type: { const: output }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        sequence: { type: integer, minimum: 0 }
        bytes: { type: string, format: byte, maxLength: 87384 }
    TerminalControlState:
      type: object
      additionalProperties: false
      required: [type, held_by_this_connection, rows, cols]
      properties:
        type: { const: control_state }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        held_by_this_connection: { type: boolean }
        rows: { type: integer, minimum: 1 }
        cols: { type: integer, minimum: 1 }
    TerminalResnapshotRequired:
      type: object
      additionalProperties: false
      required: [type, reason]
      properties:
        type: { const: resnapshot_required }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        reason: { enum: [live_gap, event_gap, epoch_changed] }
    TerminalEvent:
      type: object
      additionalProperties: false
      required: [type, event]
      properties:
        type: { const: terminal_event }
        terminal_id: { $ref: "#/components/schemas/TerminalId" }
        event: { $ref: "#/components/schemas/SessionEventEnvelope" }
    SessionEventEnvelope:
      type: object
      additionalProperties: false
      required: [session_id, stream_epoch, source, sequence, timestamp_us, payload]
      properties:
        session_id: { type: string }
        stream_epoch: { type: integer, minimum: 0 }
        cursor:
          type: string
          maxLength: 16384
          description: Opaque integrity-tagged cursor when emitted at a multi-session boundary.
        source: { enum: [process, service, logger] }
        sequence: { type: integer, minimum: 0 }
        timestamp_us: { type: integer, minimum: 0 }
        payload:
          type: object
          required: [type]
          properties:
            type:
              enum: [stats_changed, screen_mode_changed, bell, title_changed, notification, lifecycle_changed, service_changed, gui_surface_changed]
            read_cache_epoch: { type: integer, minimum: 0 }
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [spec]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Optional display name forwarded to the existing engine provision request; never an authorization key.
        spec:
          $ref: "#/components/schemas/SessionSpec"
        persistence:
          enum: [ephemeral, persistent]
          default: ephemeral
    UserSessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type: string
    Session:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - created_at
        - profile_id
        - profile_revision
        - lifecycle
        - readiness
        - surfaces
      properties:
        id:
          type: string
        name:
          type: string
          description: Existing engine session display name; never an authorization key.
        created_at:
          type: string
          format: date-time
        profile_id:
          type: string
        profile_revision:
          type: string
        lifecycle:
          enum: [creating, running, stopped, suspended, defunct, incompatible, deleting]
        readiness:
          $ref: "#/components/schemas/Readiness"
        surfaces:
          type: object
          additionalProperties: false
          required: [terminal, gui]
          properties:
            terminal:
              $ref: "#/components/schemas/SurfaceStatus"
            gui:
              $ref: "#/components/schemas/SurfaceStatus"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceStatus"
        credential_bindings:
          type: array
          items:
            $ref: "#/components/schemas/CredentialBindingStatus"
        available_actions:
          type: array
          uniqueItems: true
          items:
            enum: [start, stop, pause, resume, delete]
        last_error:
          type: string
        event_sequence:
          type: integer
          minimum: 0
    Readiness:
      type: object
      additionalProperties: false
      required: [ready, phase]
      properties:
        ready:
          type: boolean
        phase:
          enum:
            - accepted
            - allocating
            - booting
            - materializing
            - starting_services
            - starting_workload
            - ready
            - degraded
            - failed
        reason:
          type: string
    SurfaceStatus:
      type: object
      additionalProperties: false
      required: [available, state]
      properties:
        available:
          type: boolean
        state:
          enum: [unavailable, starting, ready, degraded, stopped, failed]
        protocol:
          type: string
        title:
          type: string
        active_surface_id:
          type: string
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [id, kind, state]
      properties:
        id:
          type: string
        kind:
          enum: [daemon, fuse]
        state:
          enum: [pending, starting, ready, degraded, syncing, credential_expired, stopped, failed]
        message:
          type: string
    OAuthCredentialInput:
      type: object
      additionalProperties: false
      required: [provider, access_token, scopes]
      properties:
        provider:
          $ref: "#/components/schemas/CredentialProvider"
        token_type:
          type: string
          default: Bearer
          maxLength: 64
        access_token:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
        expires_at:
          type: string
          format: date-time
        scopes:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 512
    CredentialBindingStatus:
      type: object
      additionalProperties: false
      required: [alias, provider, state, target_states]
      properties:
        alias:
          type: string
        provider:
          $ref: "#/components/schemas/CredentialProvider"
        state:
          enum: [pending, ready, expired, revoked, failed]
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        target_states:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [target, state]
            properties:
              target:
                $ref: "#/components/schemas/CredentialTargetKind"
              state:
                enum: [pending, ready, reload_required, failed]
              message:
                type: string
    Stats:
      type: object
      additionalProperties: false
      required:
        - total_input_tokens
        - total_thinking_tokens
        - total_output_tokens
        - total_estimated_cost
        - total_tool_calls
        - model_call_count
      properties:
        total_input_tokens:
          type: integer
          minimum: 0
        total_thinking_tokens:
          type: integer
          minimum: 0
        total_output_tokens:
          type: integer
          minimum: 0
        total_estimated_cost:
          type: number
          minimum: 0
        total_tool_calls:
          type: integer
          minimum: 0
        model_call_count:
          type: integer
          minimum: 0
    RuleStatus:
      type: object
      additionalProperties: true
      description: Existing logger-owned enforcement or detection status projection.
    FileEntry:
      type: object
      additionalProperties: false
      required: [name, path, type, size, mtime]
      properties:
        name:
          type: string
        path:
          type: string
        type:
          enum: [file, directory, symlink]
        size:
          type: integer
          minimum: 0
        mtime:
          type: integer
          minimum: 0
        mime:
          type: string
        is_text:
          type: boolean
        label:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
    FileWriteResult:
      type: object
      additionalProperties: false
      required: [success, size]
      properties:
        success:
          type: boolean
        size:
          type: integer
          minimum: 0
    Success:
      type: object
      additionalProperties: false
      required: [success]
      properties:
        success:
          type: boolean
    StopResult:
      type: object
      additionalProperties: false
      required: [success, persistent]
      properties:
        success:
          type: boolean
        persistent:
          type: boolean
