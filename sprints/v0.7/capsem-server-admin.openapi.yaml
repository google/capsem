# T0 review snapshot. Once capsem-server lands, this file is generated by
# `capsem-server openapi admin --format yaml`; hand edits are forbidden.
openapi: 3.1.0
info:
  title: Capsem Server Administration API
  version: 0.7.0-draft
  description: |
    Read-only administration and inventory API for capsem-server. Every route
    is under /v1/admin and requires the separately configured shared admin key
    in X-Capsem-Admin-Key. User bearer tokens are never accepted on this
    namespace, and the admin key is never accepted on /v1/user routes.
servers:
  - url: /
security:
  - adminKey: []
tags:
  - name: admin
  - name: users
  - name: sessions
  - name: profiles
  - name: workers
paths:
  /v1/admin/info:
    get:
      tags: [admin]
      operationId: getAdminInfo
      summary: Get administration API and engine compatibility information
      responses:
        "200":
          description: Administration information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfo"
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
  /v1/admin/openapi.json:
    get:
      tags: [admin]
      operationId: getAdminOpenApi
      summary: Get the administration API document generated from the running router
      responses:
        "200":
          description: Authoritative OpenAPI document for the administration router
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenApiDocument"
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
  /v1/admin/users:
    get:
      tags: [users]
      operationId: listAdminUsers
      summary: List every user known to this capsem-server control store
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: All known users
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
                  next_cursor: { type: string }
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
  /v1/admin/users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getAdminUser
      summary: Get one user and aggregate session ownership counts
      responses:
        "200":
          description: User inventory record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/users/{user_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [sessions]
      operationId: listAdminUserSessions
      summary: List every session owned by one user, newest created_at first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sessions for the selected user
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user_id, sessions]
                properties:
                  user_id:
                    type: string
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminSession"
                  next_cursor: { type: string }
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/sessions:
    get:
      tags: [sessions]
      operationId: listAdminSessions
      summary: List every session across all users with its owning user_id, newest created_at first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: All sessions and ownership
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminSession"
                  next_cursor: { type: string }
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
  /v1/admin/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [sessions]
      operationId: getAdminSession
      summary: Get one session including its owning user_id and worker mapping
      responses:
        "200":
          description: Administration session record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/admin/profiles:
    get:
      tags: [profiles]
      operationId: listAdminProfiles
      summary: List every profile visible across registered workers
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Profile inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminProfileSummary"
                  next_cursor: { type: string }
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
  /v1/admin/workers:
    get:
      tags: [workers]
      operationId: listAdminWorkers
      summary: List every configured Capsem worker and compatibility state
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Worker inventory
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [workers]
                properties:
                  workers:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminWorker"
                  next_cursor: { type: string }
        "401":
          $ref: "#/components/responses/InvalidAdminKey"
components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Capsem-Admin-Key
      description: |
        Separate shared key loaded by capsem-server from its configured admin
        key file. It is never accepted from a query parameter or user bearer
        token and must not appear in logs, errors, metrics, or traces.
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9][A-Za-z0-9_.@:-]{0,255}$"
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{20,128}$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque integrity-tagged route-specific pagination cursor.
      schema:
        type: string
        maxLength: 16384
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 512
        default: 100
  responses:
    InvalidAdminKey:
      description: Missing or invalid shared administration key
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Administration resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OpenApiDocument:
      type: object
      additionalProperties: true
      description: OpenAPI 3.1 document generated from the same typed route registry as the running router.
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        request_id:
          type: string
    AdminInfo:
      type: object
      additionalProperties: false
      required:
        - api_version
        - server_version
        - engine_version
        - compatible
        - admin_key_fingerprint
      properties:
        api_version:
          const: v1
        server_version:
          type: string
        engine_version:
          type: string
        compatible:
          type: boolean
        compatibility_error:
          type: string
        admin_key_fingerprint:
          type: string
          description: Non-secret short fingerprint used to identify the loaded key during rotation.
    AdminUser:
      type: object
      additionalProperties: false
      required: [user_id, session_count]
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        session_count:
          type: integer
          minimum: 0
    AdminSession:
      type: object
      additionalProperties: false
      required: [user_id, worker_id, session]
      properties:
        user_id:
          type: string
        tenant_id:
          type: string
        worker_id:
          type: string
        session:
          $ref: "#/components/schemas/AdminSessionSummary"
    AdminSessionSummary:
      type: object
      additionalProperties: false
      required: [id, name, created_at, profile_id, profile_revision, lifecycle]
      properties:
        id:
          type: string
          description: Opaque capsem-server session id.
        name:
          type: string
          description: Existing engine display name; never an authorization key.
        created_at:
          type: string
          format: date-time
        profile_id:
          type: string
        profile_revision:
          type: string
        lifecycle:
          enum: [creating, running, stopped, suspended, defunct, incompatible, deleting]
    AdminProfileSummary:
      type: object
      additionalProperties: false
      required: [id, name, revision, surfaces]
      properties:
        id: { type: string }
        name: { type: string }
        revision: { type: string }
        surfaces:
          type: array
          uniqueItems: true
          items: { enum: [terminal, gui] }
    AdminWorker:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - engine_version
        - compatible
        - active_sessions
        - profiles
      properties:
        id:
          type: string
        status:
          enum: [ready, degraded, unavailable, incompatible]
        engine_version:
          type: string
        compatible:
          type: boolean
        compatibility_error:
          type: string
        active_sessions:
          type: integer
          minimum: 0
        profiles:
          type: array
          items:
            type: string
