[workspace]
members = [
    "crates/capsem-a2ui-hyper",
    "crates/capsem-ai",
    "crates/capsem-plugin-engine",
    "crates/capsem-plugin-server",
    "crates/capsem-ui-catalog",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
anyhow = "1"
a2ui-types = "0.1.0"
async-trait = "0.1"
axum = "0.7"
blake3 = "1"
bytes = "1"
capsem-ai = { path = "crates/capsem-ai" }
capsem-ui-catalog = { path = "crates/capsem-ui-catalog" }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siumai = { version = "0.11.0-beta.9", default-features = false, features = ["openai", "anthropic", "google"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "fs"] }
wasmtime = "45.0.0"
wat = "1.250.0"

# Match Capsem proper: unoptimized BLAKE3 is too slow for artifact identity.
[profile.dev.package.blake3]
opt-level = 3
