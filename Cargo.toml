[workspace]
resolver = "2"
members = [
    "crates/capsem-assets",
    "crates/capsem-foundation",
    "crates/capsem-proto",
    "crates/capsem-core",
    "crates/capsem-app",
    "crates/capsem-agent",
    "crates/capsem-logger",
    "crates/capsem-process",
    "crates/capsem-service",
    "crates/capsem-admin",
    "crates/capsem",
    "crates/capsem-bench",
    "crates/capsem-tui",
    "crates/capsem-mcp",
    "crates/capsem-mcp-aggregator",
    "crates/capsem-mcp-builtin",
    "crates/capsem-mock-server",
    "crates/capsem-tray",
    "crates/capsem-gateway",
    "crates/capsem-guard",
]

[workspace.package]
version = "0.6.2"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "The fastest way to ship with AI securely."
homepage = "https://capsem.org"
repository = "https://github.com/google/capsem"
authors = ["Elie Bursztein <github@elie.net>"]

# Always optimize blake3 -- its SIMD assembly is 100x faster than
# unoptimized Rust. Without this, debug-build hashing takes 24s for 2GB.
[profile.dev.package.blake3]
opt-level = 3

# Always optimize hot wire-format codecs in dev/install builds. `just install`
# and manual release validation use debug binaries, so leaving these crates at
# opt-level 0 makes the gateway and ledger paths look broken when the real bug is
# compiler configuration.
[profile.dev.package.serde]
opt-level = 3

[profile.dev.package.serde_core]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.rmp]
opt-level = 3

[profile.dev.package."rmp-serde"]
opt-level = 3

[profile.dev.package.hickory-proto]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[profile.dev.package.itoa]
opt-level = 3

[profile.dev.package.ryu]
opt-level = 3

[profile.release]
lto = "thin"
strip = "symbols"

[workspace.lints.rust]
warnings = "deny"

# clippy 1.95 introduced three lints that flag patterns we use throughout
# the codebase intentionally. Allow them workspace-wide rather than
# refactoring 100+ call sites:
#   - collapsible_match: `match { Some(x) => if ... }` is clearer than
#     `match { Some(x) if ... => }` when the guard has a side effect.
#   - unnecessary_sort_by: `sort_by(|a,b| a.1.cmp(&b.1))` reads fine; the
#     `sort_by_key` rewrite isn't always cleaner when the key isn't Copy.
#   - doc_overindented_list_items: triggers on continuation lines under
#     `///` list items; we use explicit indentation for readability.
[workspace.lints.clippy]
collapsible_match = "allow"
unnecessary_sort_by = "allow"
doc_overindented_list_items = "allow"
dbg_macro = "deny"
todo = "deny"

# Chosen from a measurement, not from a group. `clippy::pedantic` is 7,448
# warnings across 74 lints here, and over 2,600 of those are doc and must-use
# style; adopting it wholesale would be a rewrite mandate that the first person
# it blocked would delete. These are the pedantic lints describing a way this
# codebase can be *wrong* rather than untidy, each with small enough fallout to
# fix in the change that enabled it. The tier below -- `cast_possible_truncation`
# and its three siblings, 1,382 sites between them -- is the same argument at a
# scale that needs its own pass.
#
# `unused_async` was tried and backed out. It is a real hazard class here, but
# the first site it flags is `Writer::write_checked`, and de-async-ing that
# cascades straight up into `Db::write` -- the logger's public boundary, which
# AGENTS.md says nothing may bypass -- and then into every awaiting caller in
# service, process and core. The lint is fighting a deliberately uniform async
# facade rather than finding a bug. It did find one thing worth keeping: two
# docstrings promising backpressure that no synchronous body could deliver.
#
# `cast_ptr_alignment` was held back until its eleven sites had been audited,
# because enabling it any earlier would have meant eleven un-reviewed `allow`s
# -- worse than the lint being off, since an un-reviewed allow reads as
# reviewed. All eleven are in the KVM ioctl path and fall into two patterns: a
# CPUID buffer whose `Layout` alignment is now derived from the types it is
# cast to rather than hardcoded, and the `kvm_run` mmap, which POSIX returns
# page-aligned and whose base is now asserted at creation. Both carry the
# finding at the call site.
#
# `large_stack_arrays` (9 sites) is still held back on the same terms.
unchecked_time_subtraction = "deny"   # panics on a backwards clock
cast_ptr_alignment = "deny"           # undefined behaviour, not a style note
large_stack_arrays = "deny"           # stack overflow, on a host that runs VMs
# The one member of the numeric-cast family that cannot be wrong: it flags
# `x as u64` where `u64::from(x)` is infallible, so every fix is mechanical and
# behaviour-preserving. Its three siblings -- truncation, sign loss and
# wrapping -- are 607 sites that each need a judgement about range, and are
# being taken one crate at a time rather than in a sweep.
cast_lossless = "deny"
ptr_cast_constness = "deny"
checked_conversions = "deny"
stable_sort_primitive = "deny"
zero_sized_map_values = "deny"
format_collect = "deny"
option_option = "deny"
range_plus_one = "deny"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
rmp-serde = "1.3.0"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "serialize"] }
humantime = "2"
objc2 = "0.6"
objc2-virtualization = { version = "0.3", features = [
    "VZVirtioFileSystemDeviceConfiguration",
    "VZSharedDirectory",
    "VZSingleDirectoryShare",
    "VZDirectoryShare",
    "VZDirectorySharingDeviceConfiguration",
] }
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
time = "=0.3.47"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
webpki-roots = "0.26"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
http-body-util = "0.1"
http = "1"
axum = "0.8"
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls-webpki-roots"], default-features = false }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
tokio-util = { version = "0.7", features = ["io"] }
sse-stream = "=0.2.4"
base64 = "0.22"
bytes = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
tokio-unix-ipc = "0.4"
rmcp = { version = "1.3", features = ["client", "server"] }
# Low-level DNS protocol (wire-format codec). Used host-side by the
# capsem DNS proxy (T3) to parse guest queries, build NXDOMAIN
# responses for blocked domains, and forward allowed queries upstream.
# The agent crate uses raw bytes only; hickory is host-side only.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
