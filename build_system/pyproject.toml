[project]
name = "capsem-builder"
version = "0.6.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "jinja2>=3.0",
    "blake3>=1.0.8",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "tomli-w>=1.2",
    "watchdog>=6.0.0",
]

[project.scripts]
capsem-builder = "capsem_builder.image.cli:main"
capsem-gate = "capsem_builder.gatelaunch:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "capsem_builder",
    "capsem_builder.gate",
    "capsem_builder.gate.tools",
    "capsem_builder.gate.tools.audit",
    "capsem_builder.gate.tools.ci",
    "capsem_builder.gate.tools.doctor",
    "capsem_builder.gate.tools.web",
    "capsem_builder.image",
    "capsem_builder.image.tools",
    "capsem_builder.image.tools.bootstrap",
    "capsem_builder.image.tools.build",
    "capsem_builder.policy",
    "capsem_builder.release",
    "capsem_builder.release.tools",
]
include-package-data = true

[tool.setuptools.package-dir]
capsem_builder = "builder"

[tool.setuptools.cmdclass]
sdist = "sdist_command.ReproducibleSdist"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]
pythonpath = ["..", "../tests", "tests/gate", "tests/release", "tests/release_site"]
markers = [
    "mcp: MCP black-box integration tests (require capsem-service + VM assets)",
    "integration: Service/CLI integration tests (require capsem-service + VM)",
    "session: Session.db telemetry tests (require capsem-service + VM + workload)",
    "snapshot: Snapshot lifecycle tests (require capsem-service + VM)",
    "isolation: Multi-VM isolation tests (require capsem-service + 2+ VMs)",
    "security: Security invariant tests (require capsem-service + VM)",
    "config: Config obedience tests (require capsem-service + VM)",
    "bootstrap: Setup/install flow tests (no VM needed)",
    "stress: Load and edge case tests (require capsem-service + VMs)",
    "build_chain: Build chain E2E tests (cargo build -> codesign -> pack -> boot)",
    "guest: Guest validation tests (network, services, filesystem, env)",
    "cleanup: VM cleanup verification tests (process, socket, session dir)",
    "codesign: Codesigning strict tests (FAIL not skip when unsigned)",
    "serial: Serial console and boot timing tests",
    "benchmark: Host-side benchmarks (parallel VMs, capsem-bench) -- slow, run with `-m benchmark`",
    "session_lifecycle: Session.db lifecycle tests (exists, schema, events, shutdown)",
    "config_runtime: Config runtime tests (CPU, RAM, blocked domains in guest)",
    "recipe: Just recipe and gate-dispatch contract tests",
    "recovery: Recovery and crash-resilience tests (stale state, orphans)",
    "rootfs: Rootfs artifact validation tests (no VM needed)",
    "session_exhaustive: Exhaustive per-table session.db data validation",
    "e2e: End-to-end tests via real CLI binary (the actual user path)",
    "gateway: Gateway TCP-to-UDS proxy tests (mock UDS or real service)",
    "live_provider: Optional public-provider canaries; skipped unless CAPSEM_RUN_LIVE_PROVIDER_CANARIES=1 and the matching real credential is provided",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["UP042"]

[tool.coverage.report]
precision = 2
fail_under = 85

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "psutil>=7.2.2",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "shellcheck-py>=0.11.0.1",
    "hadolint-py==2.14.0.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.16",
    "setuptools>=80",
    "ty>=0.0.46",
    "watchdog>=6.0.0",
    "websockets>=16.0",
]
