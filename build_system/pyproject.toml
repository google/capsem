[project]
name = "capsem-builder"
version = "0.6.2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "jinja2>=3.0",
    "blake3>=1.0.8",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "watchdog>=6.0.0",
]

[project.scripts]
capsem-builder = "capsem_builder.image.cli:main"
capsem-gate = "capsem_builder.gatelaunch:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "capsem_builder",
    "capsem_builder.gate",
    "capsem_builder.image",
    "capsem_builder.policy",
    "capsem_builder.release",
]
include-package-data = true

[tool.setuptools.package-dir]
capsem_builder = "builder"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["UP042"]

[tool.coverage.report]
precision = 2
fail_under = 85

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "psutil>=7.2.2",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "shellcheck-py>=0.11.0.1",
    "hadolint-py==2.14.0.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "watchdog>=6.0.0",
    "websockets>=16.0",
]
