[project]
name = "capsem"
version = "0.6.2"
requires-python = ">=3.11"
dependencies = [
    "capsem-builder==0.6.2",
    "pydantic>=2.0",
    "click>=8.0",
    "jinja2>=3.0",
    "blake3>=1.0.8",
]

[project.scripts]
# Not `capsem_builder.gate.cli:main`: the launcher re-execs under an isolated bytecode
# cache *before* importing anything from `capsem_builder.gate`, so a same-size edit
# within one timestamp tick cannot leave the gate running last version's code.
capsem-gate = "capsem_builder.gatelaunch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capsem"]

[tool.uv.sources]
capsem-builder = { path = "build_system", editable = true }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Use importlib so duplicate test basenames across directories don't collide.
# Legacy "prepend" mode sys.path-inserts each test file's dir, making e.g.
# tests/capsem-mcp/test_lifecycle.py and tests/capsem-install/test_lifecycle.py
# fight over the `test_lifecycle` module name.
addopts = "--import-mode=importlib"
# Promote every warning to an error by default. Without this, real bugs
# have shipped green -- DeprecationWarning masking future breakage,
# ResourceWarning masking fd/socket leaks, and
# PytestUnhandledThreadExceptionWarning masking daemon-thread races
# (tests/conftest.py now also captures those via threading.excepthook).
# Add targeted "ignore::..." entries below only with a one-line rationale.
filterwarnings = [
    "error",
]
markers = [
    "mcp: MCP black-box integration tests (require capsem-service + VM assets)",
    "integration: Service/CLI integration tests (require capsem-service + VM)",
    "session: Session.db telemetry tests (require capsem-service + VM + workload)",
    "snapshot: Snapshot lifecycle tests (require capsem-service + VM)",
    "isolation: Multi-VM isolation tests (require capsem-service + 2+ VMs)",
    "security: Security invariant tests (require capsem-service + VM)",
    "config: Config obedience tests (require capsem-service + VM)",
    "bootstrap: Setup/install flow tests (no VM needed)",
    "stress: Load and edge case tests (require capsem-service + VMs)",
    "build_chain: Build chain E2E tests (cargo build -> codesign -> pack -> boot)",
    "guest: Guest validation tests (network, services, filesystem, env)",
    "cleanup: VM cleanup verification tests (process, socket, session dir)",
    "codesign: Codesigning strict tests (FAIL not skip when unsigned)",
    "serial: Serial console and boot timing tests",
    "benchmark: Host-side benchmarks (parallel VMs, capsem-bench) -- slow, run with `-m benchmark`",
    "session_lifecycle: Session.db lifecycle tests (exists, schema, events, shutdown)",
    "config_runtime: Config runtime tests (CPU, RAM, blocked domains in guest)",
    "recipe: Just recipe smoke tests (run-service, doctor, build)",
    "recovery: Recovery and crash-resilience tests (stale state, orphans)",
    "rootfs: Rootfs artifact validation tests (no VM needed)",
    "session_exhaustive: Exhaustive per-table session.db data validation",
    "e2e: End-to-end tests via real CLI binary (the actual user path)",
    "gateway: Gateway TCP-to-UDS proxy tests (mock UDS or real service)",
    "live_provider: Optional public-provider canaries; skipped unless CAPSEM_RUN_LIVE_PROVIDER_CANARIES=1 and the matching real credential is provided",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Aggressive on purpose. The narrow default (pyflakes plus three pycodestyle
# groups) caught syntax and unused names and nothing else, while the families
# that find real defects -- mutable default arguments, loops that shadow their
# own bindings, `except` clauses that swallow more than intended -- were off.
#
#   B    flake8-bugbear: likely bugs, not style
#   C4   comprehensions that allocate an intermediate list for nothing
#   I    import order, so a diff shows the change and not the shuffle
#   PIE  redundant constructs with a shorter, clearer form
#   RET  returns that obscure the control flow around them
#   RUF  ruff's own checks, including implicit-Optional and unused noqa
#   SIM  branches and context managers that collapse without losing meaning
#   UP   syntax superseded by the minimum Python this project supports
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = [
    # `class X(str, Enum)` -> `StrEnum` is not a pure modernisation: it changes
    # what `str(X.MEMBER)` and f-string interpolation produce, from
    # `X.MEMBER` to the member's value. Every enum this flags feeds the
    # settings schema or a manifest, so the change needs a pass that reads
    # each interpolation site and a full gate run to confirm no serialized
    # output moved. Ignored deliberately, not silently.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# `sys.path` has to be adjusted before these imports resolve.
"scripts/fetch-release-artifacts.py" = ["E402"]
"scripts/integration_test.py" = ["E402"]


[tool.coverage.report]
# Keep two decimal places so the blocking release floor is exact rather than
# rounded up to it.
precision = 2
# The blocking Python coverage floor, declared once. It used to be spelled as
# `--cov-fail-under=85` in the justfile, again in ci.yaml, and a third time in
# the test that checks them -- so raising it meant finding all three, and a
# fourth `--cov=` invocation in ci.yaml enforced no floor at all because its
# copy had been forgotten. Coverage applies this to every run that reports.
fail_under = 85

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "psutil>=7.2.2",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "shellcheck-py>=0.11.0.1",
    "hadolint-py==2.14.0.1",
    "pyyaml>=6.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "watchdog>=6.0.0",
    "websockets>=16.0",
]
