# The official image catalog's descriptions, one per image under images/.
# images/ci/catalog.py writes them into every catalog it publishes, and
# tests/images/test_image_ci.py holds this list, the image directories and the
# publication workflow's matrix to the same set of names.

[images.dev]
display_name = "Development"
category = "development"
interfaces = ["terminal"]
surface = "terminal"
description = "An agentless environment with development tools."

[images.codex-cli]
display_name = "Codex CLI"
category = "terminal_agents"
interfaces = ["terminal"]
surface = "terminal"
description = "OpenAI Codex CLI on the Capsem base."

[images.claude-code]
display_name = "Claude Code"
category = "terminal_agents"
interfaces = ["terminal"]
surface = "terminal"
description = "Claude Code on the Capsem base."

[images.agy]
display_name = "Antigravity CLI"
category = "terminal_agents"
interfaces = ["terminal"]
