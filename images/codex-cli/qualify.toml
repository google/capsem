# What qualifying this image adds to the mandatory checks every image passes
# (tests/qualification). It may only add: no manifest removes a mandatory
# group or supplies startup configuration, which comes from the OCI config.
capabilities = ["agent", "ollama"]

# One non-interactive turn with the shipped binary and config. Capsem routes
# api.openai.com to the hermetic mock; the key is a test credential.
[expect]
turn = ["codex", "exec", "--dangerously-bypass-approvals-and-sandbox", "--skip-git-repo-check"]
credential_env = "OPENAI_API_KEY"
provider = "openai"
path = "/v1/responses"
response_transport = "websocket"
