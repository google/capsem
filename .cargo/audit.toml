# cargo-audit ignore list.
#
# Each entry must name a RUSTSEC ID, the crate involved, and WHY we can't
# fix it ourselves. The rule: only ignore advisories where the fix lives
# in an upstream dep we don't control (Tauri / webkit / GTK / unic-*).
# Anything that lands in our own code must be fixed, not ignored: rand,
# rustls-pemfile and bincode were each listed here once and each turned out
# to be ours to fix (a stale pin, one test, one bench).
#
# OSV scans Cargo.lock too and must ignore exactly this list, each entry with
# a review date, in .config/osv-scanner.toml;
# build_system/tests/scripts/test_dependency_audit.py holds the two in step.

[advisories]
ignore = [
  # --- glib VariantStrIter unsoundness (RUSTSEC-2024-0429) ---------------
  # Via webkit2gtk -> wry -> Tauri, and tray-icon/muda, on Linux: all pin
  # gtk-rs 0.18. We never use VariantStrIter. Leaves when Tauri moves on.
  "RUSTSEC-2024-0429",

  # --- proc-macro-error unmaintained (RUSTSEC-2024-0370) -----------------
  # A build-time proc macro of glib-macros 0.18, the same pinned GTK stack.
  # It runs in the compiler, not in anything we ship.
  "RUSTSEC-2024-0370",

  # --- Unmaintained unic-* crates (via urlpattern -> tauri-utils) --------
  # RUSTSEC-2025-0081 unic-char-property
  # RUSTSEC-2025-0075 unic-char-range
  # RUSTSEC-2025-0080 unic-common
  # RUSTSEC-2025-0100 unic-ucd-ident
  # RUSTSEC-2025-0098 unic-ucd-version
  # urlpattern 0.3 depends on the whole unic tree and Tauri pins it.
  # Unmaintained, not vulnerable; drop when Tauri updates urlpattern.
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2025-0098",
]
