ignoreUntil = 2026-12-21T00:00:00Z
reason = "chrono is absent from Capsem, the vendored OCI client, patched rmcp and Linux desktop dependency graphs: all timestamp owners use jiff and cargo tree -i chrono is empty. Their lockfiles retain chrono only because serde_with 3.23/3.24 records its disabled optional chrono feature alongside active jiff support. OSV scans lock metadata without Cargo feature reachability. Recheck serde_with and the four exact graphs by 2026-12-21; remove this hold when serde_with drops the optional chrono feature."

# Upstream container test harness, never part of the shipped OCI client.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0440"
ignoreUntil = 2026-12-16T00:00:00Z
reason = "astral-tokio-tar 0.6.4 is used only by testcontainers 0.28.0, a dev-dependency in third_party/rust/oci-client/Cargo.lock for upstream registry tests. Neither package occurs in the product Cargo.lock, and neither is compiled into native binaries or the guest runtime. Rechecked crates.io and RustSec on 2026-11-16: latest testcontainers 0.28.0 still uses it, latest tar 0.7.1 is also unmaintained, and RUSTSEC-2026-0440 has no patched versions. RELEASE.md section 8.2 permits this upstream build-tool-only exception through 2026-12-16; retain upstream tests and recheck by then."
