# OSV-Scanner exceptions for every lockfile the dependency audit scans.
#
# Only an advisory whose fix lives in an upstream dependency we do not control
# may be listed; anything in our own dependency choices gets fixed instead.
# The Rust entries mirror .cargo/audit.toml, which holds the reasoning, and
# every entry carries an ignoreUntil at most 90 days out: past it the scan
# fails again, so each exception is re-checked against upstream rather than
# accepted forever. build_system/tests/scripts/test_dependency_audit.py holds
# all of this.

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
ignoreUntil = 2026-11-10T00:00:00Z
reason = "deepmerge 4.3.1 is used only for build-configuration merging by @astrojs/svelte 9.0.1 -> @sveltejs/vite-plugin-svelte 7.2.0 in web/app and web/marketing. The Vite plugin runs on the build host; it is not part of the emitted static browser app, native binaries or VM runtime. Reviewed 2026-10-27: npm's complete published-version list ends at 4.3.1 and GHSA-gcqx-w48m-w2h4 lists no patched version. Upstream must ship the fix; RELEASE.md section 8.2 permits this build-time-only exception. Recheck by 2026-11-10."

