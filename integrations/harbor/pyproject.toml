[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "harbor-capsem-sandbox"
version = "0.1.0"
description = "Capsem sandbox environment provider for Harbor and Terminal-Bench"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "capsem>=0.7.1",
    "capsem-integrations>=0.1.0",
    "harbor>=0.24.0",
]

[project.urls]
Homepage = "https://capsem.org"
Repository = "https://github.com/google/capsem"

[tool.hatch.build.targets.wheel]
packages = ["harbor_capsem"]

[dependency-groups]
dev = [
    "google-auth>=2.0.0",
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.15.16",
    "ty>=0.0.46",
    "build>=1.2",
    "hatchling==1.29.0",
    "editables==0.5",
]

[tool.uv.sources]
capsem = { path = "../../sdk/python", editable = true }
capsem-integrations = { path = "../common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=harbor_capsem --cov-report=term-missing:skip-covered --cov-report=xml"

[tool.coverage.run]
branch = true
source = ["harbor_capsem"]
data_file = "../../cache/target/coverage/harbor.coverage"

[tool.coverage.report]
precision = 2
fail_under = 90

[tool.coverage.xml]
output = "../../cache/target/coverage/harbor/coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["../../build_system"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "PIE", "RET", "RUF", "SIM", "UP"]
ignore = ["UP042"]

[tool.ty.environment]
python-version = "3.12"
