[control.failure_artifacts]
stage = "test-evidence"
minimum_count = 5
maximum_count = 30
maximum_age_hours = 336
maximum_bytes = 8589934592 # 8 GiB
maximum_file_bytes = 26214400
skip_names = [
  "rootfs.img",
  "scratch.img",
  "disk.img",
  "rootfs.erofs",
  "vmlinuz",
  "initrd.img",
]
source_patterns = [
  "containers/logs/build.log",
  "containers/logs/runtime-mutations.jsonl",
  "target/tests/ironbank/build-*.log",
  "target/tests/ironbank/*/run-failure/**/*",
]
