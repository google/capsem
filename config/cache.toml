max_size_bytes = 2147483648 # 2 GiB
prune_strategy = "lru"
maximum_age_hours = 168
maximum_count = 20
managed_globs = ["cpython-*"]
lease_template = ".{key}.lock"

[stages.python-pytest]
description = "Source-keyed pytest state and test-result metadata."
scope = "disk"
path = "tools/python/pytest"
warm_size_bytes = 268435456 # 256 MiB
max_size_bytes = 536870912 # 512 MiB
prune_strategy = "lru"
maximum_age_hours = 168
maximum_count = 20
managed_globs = ["cpython-*"]
lease_template = ".{key}.lock"

[stages.node-pnpm]
description = "pnpm package store shared by frontend workspaces and release builds."
scope = "disk"
path = "tools/node/pnpm"
warm_size_bytes = 2147483648 # 2 GiB
max_size_bytes = 4294967296 # 4 GiB
prune_strategy = "lru"
maximum_age_hours = 720

[stages.rust-sccache]
description = "Compiler object cache shared across Cargo targets and worktrees."
scope = "disk"
path = "tools/rust/sccache"
warm_size_bytes = 17179869184 # 16 GiB
max_size_bytes = 25769803776 # 24 GiB
prune_strategy = "lru"
maximum_age_hours = 336

[stages.buildkit-exports]
description = "Portable BuildKit cache exports exchanged by hosted lanes."
scope = "disk"
# Transportable BuildKit cache exports live here when a hosted lane needs to
# hand layers to another runner. Local builds keep the hotter native daemon
# cache instead of duplicating it on the same disk; the Docker runtime adapter
# inventories and bounds that native cache separately below.
path = "containers/buildkit"
warm_size_bytes = 17179869184 # 16 GiB
max_size_bytes = 34359738368 # 32 GiB
prune_strategy = "lru"
maximum_age_hours = 72

[stages.container-logs]
description = "Bounded Docker, BuildKit, and Tart cache mutation logs."
scope = "disk"
path = "containers/logs"
warm_size_bytes = 268435456 # 256 MiB
max_size_bytes = 536870912 # 512 MiB
prune_strategy = "lru"
maximum_age_hours = 720

[stages.worktrees]
description = "Source-isolated gate worktrees retained for exact resume."
scope = "disk"
path = "worktrees"
warm_size_bytes = 12884901888 # 12 GiB
max_size_bytes = 21474836480 # 20 GiB
prune_strategy = "lru"
maximum_age_hours = 168
maximum_count = 2
managed_globs = ["[!.]*"]
lease_template = ".{key}.lock"

[stages.state]
description = "Small durable cache-control admission and telemetry state."
scope = "disk"
path = "state"
warm_size_bytes = 134217728 # 128 MiB
max_size_bytes = 268435456 # 256 MiB
prune_strategy = "lru"
maximum_age_hours = 4320

[stages.temporary]
description = "Short-lived cache-library scratch space safe to discard."
scope = "disk"
path = "tmp"
warm_size_bytes = 1073741824 # 1 GiB
max_size_bytes = 2147483648 # 2 GiB
prune_strategy = "ephemeral"
maximum_age_hours = 24
maximum_count = 8

[runtimes.docker]
description = "Docker images, containers, and shared BuildKit layers owned by Capsem."
scope = "docker"
warm_size_bytes = 77309411328 # 72 GiB
max_size_bytes = 103079215104 # 96 GiB
prune_strategy = "docker"
kind = "docker"
command = "docker"
timeout_seconds = 30
mutation_timeout_seconds = 600
inventory_retry_attempts = 3
inventory_retry_delay_milliseconds = 250
log_stage = "container-logs"
image_prefixes = ["capsem-"]
container_prefixes = ["capsem-"]
volume_prefixes = ["capsem-package-target-"]
build_cache_owned = true
maximum_age_hours = 72
keep_image_generations = 1

[runtimes.tart]
description = "Disposable Tart virtual machines owned by Capsem release proof."
scope = "tart"
warm_size_bytes = 51539607552 # 48 GiB
max_size_bytes = 68719476736 # 64 GiB
prune_strategy = "tart"
kind = "tart"
required = false
command = "tart"
timeout_seconds = 30
mutation_timeout_seconds = 60
log_stage = "container-logs"
vm_prefixes = ["capsem-glowup-"]
base_images = ["ghcr.io/cirruslabs/macos-sequoia-base@sha256:fdd8b72a6ee46fc8ad35dc1b9f3b1f162b6607b82a584947d20bb28d3dcb99ed"]
home = "~/.tart"

