# One policy for repository caches, external runtime caches, and generated output.
# Initial limits are based on the 2026-08-31 inventory. Later adjustments require
# the calibration evidence declared here and a reviewed policy change.
version = 1
root = "cache"
minimum_free_bytes = 42949672960 # 40 GiB

[calibration]
minimum_samples = 5
warning_percentile = 95
soft_generation_headroom = 1
hard_generation_headroom = 1

[test_admission]
minimum_commits = 10
state_path = "state/test-admission.jsonl"

[[test_admission.routes]]
prefix = "README.md"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "CHANGELOG.md"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "CITATION.cff"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "web/docs/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "web/marketing/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "build_system/release_site/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "bench/"
groups = ["benchmark"]

[[test_admission.routes]]
prefix = "benchmarks/"
groups = ["benchmark"]

[[test_admission.routes]]
prefix = "sdk/"
groups = ["binaries"]

[[test_admission.routes]]
prefix = "skills/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "config/settings/"
groups = ["binaries", "release-system"]

[[test_admission.routes]]
prefix = "config/data/"
groups = ["binaries"]

