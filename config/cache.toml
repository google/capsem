[stages.python-uv]
description = "uv downloads, wheels, and environment materialization artifacts."
scope = "disk"
path = "tools/python/uv"
warm_size_bytes = 2147483648 # 2 GiB
max_size_bytes = 4294967296 # 4 GiB
prune_strategy = "lru"
maximum_age_hours = 720

[stages.python-ruff]
description = "Ruff analysis results reused across source checks."
scope = "disk"
path = "tools/python/ruff"
warm_size_bytes = 134217728 # 128 MiB
max_size_bytes = 268435456 # 256 MiB
prune_strategy = "lru"
maximum_age_hours = 168

[stages.python-pycache]
description = "Source-keyed Python bytecode environments used by gate commands."
