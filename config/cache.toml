[runtimes.docker]
kind = "docker"
command = "docker"
timeout_seconds = 30
mutation_timeout_seconds = 600
receipt_stage = "container-receipts"
log_stage = "container-logs"
image_prefixes = ["capsem-"]
container_prefixes = ["capsem-"]
build_cache_owned = true
maximum_age_hours = 72
keep_image_generations = 1
build_cache_keep_bytes = 85899345920

[runtimes.tart]
kind = "tart"
command = "tart"
timeout_seconds = 30
mutation_timeout_seconds = 60
receipt_stage = "container-receipts"
log_stage = "container-logs"
vm_prefixes = ["capsem-glowup-"]
base_images = ["ghcr.io/cirruslabs/macos-sequoia-base@sha256:fdd8b72a6ee46fc8ad35dc1b9f3b1f162b6607b82a584947d20bb28d3dcb99ed"]
home = "~/.tart"

[control.docker]
runtime_id = "docker"
capacity_probe_image = "debian:bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171"
minimum_disk_bytes = 171798691840 # 160 GiB
recommended_disk_bytes = 214748364800 # 200 GiB

