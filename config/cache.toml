# One policy for repository caches, external runtime caches, and generated output.
version = 1
root = "cache"
authority_environment = "CAPSEM_CACHE_AUTHORITY"

[test_admission]
minimum_commits = 10
state_path = "state/test-admission.jsonl"

[[test_admission.routes]]
prefix = "README.md"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "CHANGELOG.md"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "CITATION.cff"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "web/docs/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "web/marketing/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "build_system/release_site/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "bench/"
groups = ["benchmark"]

[[test_admission.routes]]
prefix = "benchmarks/"
groups = ["benchmark"]

[[test_admission.routes]]
prefix = "sdk/"
groups = ["binaries"]

[[test_admission.routes]]
prefix = "skills/"
groups = ["release-system"]

[[test_admission.routes]]
prefix = "config/settings/"
groups = ["binaries", "release-system"]

[[test_admission.routes]]
prefix = "config/data/"
groups = ["binaries"]

[stages.cargo]
description = "Cargo build artifacts shared across source-isolated gate runs."
scope = "disk"
path = "target/cargo"
warm_size_bytes = 68719476736 # 64 GiB
max_size_bytes = 103079215104 # 96 GiB
prune_strategy = "none"
maximum_age_hours = 720

[stages.generated]
description = "Generated schemas and source-derived build products."
scope = "disk"
path = "target/generated"
warm_size_bytes = 2147483648 # 2 GiB
max_size_bytes = 4294967296 # 4 GiB
prune_strategy = "generational"
maximum_age_hours = 336
maximum_count = 5

[stages.build-workspaces]
description = "Reusable image and package build workspaces."
scope = "disk"
path = "target/build"
warm_size_bytes = 12884901888 # 12 GiB
max_size_bytes = 25769803776 # 24 GiB
prune_strategy = "generational"
maximum_age_hours = 336
maximum_count = 8

[stages.gate-runs]
description = "Gate journals, timing evidence, and reusable completion lineages."
scope = "disk"
path = "target/gate-runs"
warm_size_bytes = 1073741824 # 1 GiB
max_size_bytes = 2147483648 # 2 GiB
prune_strategy = "lru"
maximum_age_hours = 720
maximum_count = 60
managed_globs = ["20*-*"]

[stages.materialized-config]
description = "Validated profile configuration materialized for builders and tests."
scope = "disk"
path = "target/config"
warm_size_bytes = 67108864 # 64 MiB
max_size_bytes = 134217728 # 128 MiB
prune_strategy = "generational"
maximum_age_hours = 336
maximum_count = 8

[stages.objects]
description = "Content-addressed immutable objects shared across build and release lanes."
scope = "disk"
path = "objects"
warm_size_bytes = 34359738368 # 32 GiB
max_size_bytes = 51539607552 # 48 GiB
prune_strategy = "none"
maximum_age_hours = 2160

[stages.prefix-products]
description = "Cargo outputs lent between source-isolated gate worktrees."
scope = "disk"
path = "target/prefix-products"
warm_size_bytes = 8589934592 # 8 GiB
max_size_bytes = 17179869184 # 16 GiB
prune_strategy = "generational"
maximum_age_hours = 336
maximum_count = 2

[stages.assets]
description = "Content-addressed kernel, initrd, and rootfs generations reused by VM tests."
scope = "disk"
path = "target/assets"
entry_root = "generations"
selector_globs = [
  "target/assets/*/build-*",
  "worktrees/*/cache/target/assets/*/build-*",
]
warm_size_bytes = 8589934592 # 8 GiB
max_size_bytes = 17179869184 # 16 GiB
prune_strategy = "generational"
maximum_age_hours = 336
maximum_count = 10

[stages.packages]
description = "Built Debian packages and their provenance receipts."
scope = "disk"
path = "target/packages"
warm_size_bytes = 1073741824 # 1 GiB
max_size_bytes = 2147483648 # 2 GiB
prune_strategy = "lru"
maximum_age_hours = 336
maximum_count = 12

[stages.coverage]
description = "Merged language coverage data produced by complete test runs."
scope = "disk"
path = "target/coverage"
warm_size_bytes = 2147483648 # 2 GiB
max_size_bytes = 4294967296 # 4 GiB
prune_strategy = "generational"
