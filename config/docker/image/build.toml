[build]
materialize_network = "default"

[build.erofs]
enabled = true
compression = "lz4hc"
compression_level = 12

[build.kernel]
version = "6.18.44"
sha256 = "0f72d938f06828e82c90405174fe572287db7bfe089e2fc46572a99a7f240d43"

[build.asset_dependencies]
tag_template = "capsem-{template}-dependencies-{arch}:{digest}"
rootfs_template = "Dockerfile.rootfs-dependencies.j2"
kernel_template = "Dockerfile.kernel-dependencies.j2"
source_build_network = "none"

[build.guest_rust_builder]
dockerfile = "docker/Dockerfile.guest-rust-builder"
tag_template = "capsem-guest-rust-{arch}:{digest}"
identity_inputs = ["Cargo.lock", "rust-toolchain.toml"]
# The cross helper is allowed one network-open APK materialization edge. Pin
# every direct package so the input-keyed tag cannot silently select a newer C
# compiler on a cold machine while a warm machine reuses older bytes.
cross_packages = ["clang21=21.1.2-r2"]
runtime_network = "none"

[build.asset_tools]
dockerfile = "docker/Dockerfile.asset-tools"
tag_template = "capsem-asset-tools-{arch}:{digest}"
debian_snapshot_base = "https://snapshot.debian.org/archive/debian"
debian_security_snapshot_base = "https://snapshot.debian.org/archive/debian-security"
debian_snapshot_id = "20260810T000000Z"
materialize_network = "default"
runtime_network = "none"

[build.asset_tools.architectures.arm64.cdxgen]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.7.0/cdxgen-linux-arm64"
sha256 = "b9df01473f0cd28a1911b276feb81a8ed410c947eb84266b59333513ec8afdc5"

[build.asset_tools.architectures.arm64.cdx_validate]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.7.0/cdx-validate-linux-arm64"
sha256 = "0a585e0888876d68f424dbb0f7cf7e5f26fd79d9141458234062dc804e75d00e"

[build.asset_tools.architectures.x86_64.cdxgen]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.7.0/cdxgen-linux-amd64"
sha256 = "e202de54d1a99e388eddf9b21bf11b3301f8495a77e84a5d323f9b867160d731"

[build.asset_tools.architectures.x86_64.cdx_validate]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.7.0/cdx-validate-linux-amd64"
sha256 = "865c98417126eaac34b33de49ec21a60339553ce3bcf034bdc70948c003ad942"

[build.version_commands]
node = "node --version 2>&1 | tr -d v"
npm = "npm --version 2>&1"
uv = "uv --version 2>&1 | awk '{print $2}'"
pip = "pip3 --version 2>&1 | awk '{print $2}'"

[build.architectures.arm64]
base_image = "docker.io/library/debian@sha256:817e6cf99d6fc127ff4ffe8580049b60deba0adfbbb2bd65ddc3ef8fbb7aade0"
# Exact linux/arm64 child of rust:1.97.1-alpine3.23.
rust_builder_base_image = "docker.io/library/rust@sha256:ec97f172f73f5ec381a238dad6ddd99e0e9c14fd3709a05beb41ccdf50eb666a"
docker_platform = "linux/arm64"
rust_target = "aarch64-unknown-linux-musl"
kernel_image = "arch/arm64/boot/Image"
defconfig = "kernel/defconfig.arm64"
node_major = 24

[build.architectures.x86_64]
base_image = "docker.io/library/debian@sha256:362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143"
# Exact linux/amd64 child of rust:1.97.1-alpine3.23.
rust_builder_base_image = "docker.io/library/rust@sha256:83b16fd204613a557527e81ef4f87fd513229187c49635e3c7f96b08dfa43c33"
docker_platform = "linux/amd64"
rust_target = "x86_64-unknown-linux-musl"
kernel_image = "arch/x86_64/boot/bzImage"
defconfig = "kernel/defconfig.x86_64"
node_major = 24
