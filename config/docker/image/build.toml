[build]
materialize_network = "default"

[build.erofs]
enabled = true
compression = "lz4hc"
compression_level = 12
# Larger physical clusters preserve the release LZ4HC format while allowing
# redundancy across adjacent blocks instead of bloating the published asset.
cluster_size = 65536

[build.rootfs]
# Release rootfs assets were historically below 1 GB. These independent raw
# and packed ceilings catch dependency-payload explosions before publication.
# The packed ceiling sits about 11% above the largest real asset (x86_64 packs
# to ~843 MB). Tighter than that and an ordinary dependency bump trips the
# guard mid-qualification, costing a full cycle to learn nothing; looser and it
# stops describing "historically below 1 GB". Either way it catches the
# regression it exists for by a wide margin -- that one reached nearly 3 GB.
max_uncompressed_bytes = 2500000000
max_erofs_bytes = 950000000
# The whole package set of the VM runtime: the container launcher's tools
# (runc, umoci, python3, iptables, iproute2), what capsem-init needs (auditd
# for the execve ledger, e2fsprogs to format the system overlay), the system
# trust store the Capsem CA is installed into (ca-certificates), and what
# capsem-doctor, capsem-bench and the network diagnostics run with.
# Applications are not installed here; they come from OCI images.
runtime_apt_packages = [
    "runc",
    "umoci",
    "python3",
    "iptables",
    "iproute2",
    "ca-certificates",
    "curl",
    "procps",
    "python3-pytest",
    "python3-rich",
    "python3-venv",
    "auditd",
    "e2fsprogs",
]

[build.kernel]
version = "6.18.44"
sha256 = "0f72d938f06828e82c90405174fe572287db7bfe089e2fc46572a99a7f240d43"
# Applied in order with --fuzz=0, so a kernel bump that moves the patched code
# fails the build instead of silently compiling an unpatched kernel. Each one
# carries its reason in its header; drop it when the pinned kernel has the fix.
patches = [
    "kernel/patches/0001-fuse-refuse-posix-acls-without-fuse-posix-acl.patch",
    "kernel/patches/0002-virtiofs-allow-idmapped-mounts.patch",
]

[build.asset_dependencies]
tag_template = "capsem-{template}-dependencies-{arch}:{digest}"
rootfs_template = "Dockerfile.rootfs-dependencies.j2"
kernel_template = "Dockerfile.kernel-dependencies.j2"
source_build_network = "none"

[build.guest_rust_builder]
dockerfile = "build_system/docker/Dockerfile.guest-rust-builder"
tag_template = "capsem-guest-rust-{arch}:{digest}"
identity_inputs = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "sdk/rust/Cargo.toml"]
source_roots = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "crates/capsem-agent",
    "crates/capsem-bench",
    "crates/capsem-foundation",
    "crates/capsem-proto",
    "build_system/builder/image/docker.py",
    "build_system/builder/image/guestbinarycache.py",
]
# The cross helper is allowed one network-open APK materialization edge. Pin
# every direct package so the input-keyed tag cannot silently select a newer C
# compiler on a cold machine while a warm machine reuses older bytes.
cross_packages = ["clang21=21.1.2-r2"]
runtime_network = "none"

[build.asset_tools]
dockerfile = "build_system/docker/Dockerfile.asset-tools"
tag_template = "capsem-asset-tools-{arch}:{digest}"
debian_snapshot_base = "https://snapshot.debian.org/archive/debian"
debian_security_snapshot_base = "https://snapshot.debian.org/archive/debian-security"
debian_snapshot_id = "20260810T000000Z"
materialize_network = "default"
runtime_network = "none"

[build.asset_tools.architectures.arm64.cdxgen]
url = "https://github.com/CycloneDX/cdxgen/releases/download/v12.7.0/cdxgen-linux-arm64"
sha256 = "b9df01473f0cd28a1911b276feb81a8ed410c947eb84266b59333513ec8afdc5"

