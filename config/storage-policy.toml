[debug_artifacts]
root = "test-artifacts"
minimum_runs = 5
maximum_runs = 30
maximum_age_days = 14
maximum_total_gib = 8
maximum_file_mib = 25
skip_names = [
  "rootfs.img",
  "scratch.img",
  "disk.img",
  "rootfs.erofs",
  "vmlinuz",
  "initrd.img",
]
