reason = "No lane mounts a named volume: the base image carries the toolchain and dependency graph, and every build directory is an anonymous volume."

# The three caches the parity lane used to carry between runs. The base image
# resolves all three now -- `cargo fetch` against `Cargo.lock` and the rustup
# toolchain are baked in at a tag keyed by the lockfiles that determine them --
# so a cold machine and a warm one get the same bytes instead of whatever the
# last run happened to leave. `test_release_doctor_contract.py` asserts two of
# these names never reappear in the lane's argv.
[resources.capsem-linux-rust-cargo-registry]
kind = "volume"
retention = "obsolete"
owner = "none"
reason = "No lane mounts a named volume: the base image carries the toolchain and dependency graph, and every build directory is an anonymous volume."

