# Which profile a client gets when it names none, per runtime. The gateway
# publishes both in GET /status, so no client compiles a profile name into
# itself; a container's default is free to move away from the VM's.
#
# This lives here, compiled into the binary, and not in a profile's
# profile.toml: a profile ledger is published once and then staged by
# binaries already in the field, and Capsem 0.6.3 parses it strictly. A field
# it does not know -- `default_for` was one -- failed every 0.6.3 automatic
# update to 0.6.4.

[defaults]
vm = "code"
container = "code"
