# Product-wide runtime ceilings embedded into every Capsem binary.
# User overrides belong to the typed settings contract tracked by #349.

[network]
max_concurrent_clients = 512
# A pool can hold active, idle and retiring connections for one client slot.
traffic_grants_per_client = 3
# Each intercepted client consumes a guest TCP descriptor and a VSOCK
# descriptor. The remaining per-client allowance covers listeners, the Tokio
# reactor, DNS, control traffic, and overlap while connections retire.
file_descriptors_per_client = 8

[ledger]
# A DNS query contributes a primary row, a decision transition and a rule row.
# Two persistent DNS sessions can overlap; two additional event slots per
# client absorb the bounded handoff between protocol and SQLite batches.
producer_events_per_network_client = 8
# One transport exchange carries this many consecutive producer events. The
# queue must be an exact multiple so a full burst drains without a tail shape.
admission_batch_capacity = 64
# A lone event waits briefly for its immediate followers. This is far below a
# network round trip while avoiding singleton IPC under concurrent bursts.
admission_coalesce_wait_microseconds = 100
