# Product-wide runtime ceilings embedded into every Capsem binary.
# User overrides belong to the typed settings contract tracked by #349.

[network]
max_concurrent_clients = 512
# A pool can hold active, idle and retiring connections for one client slot.
traffic_grants_per_client = 3
# Each intercepted client consumes a guest TCP descriptor and a VSOCK
# descriptor. The remaining per-client allowance covers listeners, the Tokio
# reactor, DNS, control traffic, and overlap while connections retire.
file_descriptors_per_client = 8
