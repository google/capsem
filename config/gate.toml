[suites.pytest]
# Where the tests are. Spelled here rather than in the module, so the broad
# suite and the compatibility runs cannot come to disagree about it.
root = "tests/"
# The Citadel: source-level guards recording architectural mistakes that must
# not be repeated. Named separately from `root` because it belongs in the fast
# phase, not the broad suite. It reads source and asserts on it -- no artifact,
# no VM, no daemon, seconds not minutes -- and was previously reached only
# through `root`, which carries `require_artifacts` and runs after the whole
# asset build. A DB-boundary violation was therefore reported after the VMs
# booted rather than in the first second, which is the one thing a guard
# written to "fail before it can ship green" must not do.
citadel = "tests/citadel/"
# Collection is a cheap source-shape proof: no cache writes, no artifacts, and
# strict rejection of unknown configuration or markers.
collection_flags = ["--collect-only", "-qq", "-p", "no:cacheprovider", "--strict-config", "--strict-markers"]
# One spelling of "run pytest", so sixteen call sites cannot drift into
# sixteen slightly different opinions about --tb, --maxfail and -n.
base_flags = ["-v", "--tb=short"]
# A failure budget, not a hair trigger. `--maxfail=1` turned every run into one
# fact: the release-contracts phase, which is the one place this was already
# off, reported four failures in a single eleven-minute run and all four were
# fixed in one pass -- four runs and three quarters of an hour if it had stopped
# at the first. Unbounded is the opposite mistake: a broken VM or service fails
# every remaining test the same way and spends an hour restating it. Five is
# enough to show a pattern and few enough to stop a cascade.
stop_at_first = "--maxfail=5"
parallel_flags = ["-n", "4", "--dist=loadfile"]
coverage_flags = ["--cov=src/capsem", "--cov-report=xml:codecov-python.xml"]

# Directories the broad suite never collects, each for its own reason.
#
#   capsem-recipes   its meta-tests invoke `cargo build --workspace`, which
#                    atomically replaces the codesigned binaries a concurrent
#                    VM test is using
#   capsem-install   also spawns `cargo build -p capsem` from inside pytest;
#                    owned by the install gate, which runs it in Docker
#   capsem-build-chain / capsem-release
#                    artifact and composition suites with their own entrypoints
#   citadel          source-level guards owned by the fast phase; collecting
#                    them here too would run them a second time an hour later,
#                    and a guard with two owners has none
broad_ignores = [
    "tests/capsem-recipes",
    "tests/capsem-install",
    "tests/capsem-build-chain",
    "tests/capsem-release",
    "tests/citadel",
]

# Production has one service and one service-scoped save/restore lock. An
# xdist worker per service does not reproduce that, so these run alone.
host_snapshot_serial = [
    "tests/capsem-mcp/test_state_transitions.py",
    "tests/capsem-service/test_svc_resume_paths.py",
    "tests/capsem-service/test_svc_suspend_corruption.py",
    "tests/capsem-service/test_svc_loop_device_after_resume.py",
]

# Timing probes. They run alone so their numbers measure Capsem rather than
# another benchmark file competing for the same Apple VZ launch budget.
serial_paths = [
    "tests/capsem-serial/",
    "tests/ironbank/test_route_health.py",
]
benchmark_baseline = "tests/capsem-serial/test_capsem_bench_baseline.py"
benchmark_deselect = "not test_capsem_bench_baseline"

# Fails closed before collection rather than passing vacuously against a tree
# whose assets were never built.
require_artifacts = "CAPSEM_REQUIRE_ARTIFACTS"
profile_variable = "CAPSEM_TEST_PROFILE"
# The profile every broad proof runs against first. The rest are the
# compatibility axis, and run the VM-owned suites again behind it.
base_profile = "code"
materialized_profiles = "target/config/profiles"
test_manifest = "assets/manifest.json"

[functional]
# The two legacy VM drivers. Neither is pytest, both need a real VM, and both
# take the same three coordinates -- which is why they are here rather than
# spelled out at each of their four call sites.
injection_script = "scripts/injection_test.py"
integration_script = "scripts/integration_test.py"
binary = "target/debug/capsem"
assets_dir = "assets"
config_root = "target/config"
# The Node workspaces these suites render, and only those. `toolchain.node`
# installs every workspace the local gate exercises, which is more than this
# module needs and more than a release lane has warmed: the docs and site
# stores are not populated there, so installing them reached the network from
# inside a namespace that has none.
node_workspaces = ["release-site"]
profiles_subdir = "profiles"
# Overridable so a release lane can point the same proof at pulled artifacts
# instead of source-built ones.
binary_variable = "CAPSEM_TEST_BINARY"
assets_variable = "CAPSEM_TEST_ASSETS_DIR"
config_root_variable = "CAPSEM_TEST_CONFIG_ROOT"
assets_dir_variable = "CAPSEM_ASSETS_DIR"

[modules]
# The build-chain suites that need built artifacts. The release-contracts
# module excludes them because it is the cheap composition proof; the artifacts
# module runs exactly them, once the assets exist.
build_chain_artifact_tests = [
    "tests/capsem-build-chain/test_cargo_build.py",
    "tests/capsem-build-chain/test_codesign.py",
    "tests/capsem-build-chain/test_full_chain.py",
    "tests/capsem-build-chain/test_manifest_regen.py",
    "tests/capsem-build-chain/test_materialized_profile_payload.py",
    "tests/capsem-build-chain/test_pack_initrd.py",
]
release_suites = ["tests/capsem-release/", "tests/capsem-build-chain/"]
# A release test named `test_*contract.py` was in the contracts phase; one named
# anything else was not, and ran only in the broad phase behind a VM build.
# `test_release_refuses_a_dirty_tree.py` was such a file: it asserts what
# `--force` waives, and a forced release -- which skips the broad phase
# entirely -- was the one run that never checked it. Match the subject, not the
# filename. The `test_gate_*` files are already named in [suites].source_contract.
contract_globs = ["tests/test_*contract.py", "tests/test_release_*.py"]

# The Rust coverage floor is 63, not 100. Some files -- uninstall, completions
# -- are intentionally at 0% because they are thin shells over OS and CLI
# primitives, and some defensive paths only execute under live VM traffic and
# are covered by the integration suites rather than by unit tests. The floor
# exists to catch "we deleted half the test suite", not to gate an honest
# defensive branch.
# Through Nextest, whose `ci` profile is the reason: a test that hangs
# currently hangs the whole gate until the 7200-second lock timeout, and runs
# have died past the two-hour mark. `slow-timeout` reports every 120s and fails
# after three consecutive slow periods. Measured at 99s against 115s for the
# plain runner on a warm workspace -- 14% -- with line coverage 65.11% against
# 65.13%. The 23-line
# difference is process-per-test isolation, not a selector mismatch; it is the
# same with and without the target flags, and both clear the floor by 2pp.
rust_coverage = ["cargo", "llvm-cov", "nextest", "--workspace", "--bins", "--lib", "--tests", "--no-cfg-coverage"]
rust_coverage_floor = "--fail-under-lines=63"
# Nextest reads its profile from the environment; `--profile` on the command
# line belongs to cargo-llvm-cov and would select a build profile instead.
rust_test_profile_variable = "NEXTEST_PROFILE"
rust_test_profile = "ci"
# Doctests, which Nextest does not run and never will -- `rustinventory` says
# so and models them as a separate target set for exactly this reason. Swapping
# the runner without this line silently stops executing them, which is how a
# passing gate comes to prove less than it did before.
rust_doctests = ["cargo", "test", "--workspace", "--doc"]

guest_binary_tests = [
    "tests/capsem-bootstrap/test_cross_compile.py",
    "tests/capsem-security/test_binary_perms.py::test_agent_binaries_555",
]

# Release-lane inputs. When these are set the module verifies pulled immutable
# artifacts instead of building source ones.
release_input_dir = "CAPSEM_RELEASE_INPUT_DIR"
release_profile = "CAPSEM_RELEASE_PROFILE"
release_package = "CAPSEM_RELEASE_PACKAGE"
verify_inputs_script = "scripts/verify-release-inputs.py"
prove_profile_assets_script = "scripts/prove-release-profile-assets.py"
glowup_script = "scripts/local-release-glowup.py"
macos_glowup_script = "scripts/macos_release_glowup.py"
# Proves the published package runs on every release [platforms.linux]
# claims and is refused below the floor. The rest of the install chain
# only ever runs on ubuntu:24.04, where a wrong floor is invisible.
platform_support_script = "scripts/prove-deb-platform-support.py"
macos_glowup_report = "target/macos-tart-glowup/report.json"
macos_report_variable = "CAPSEM_MACOS_NATIVE_GLOWUP_REPORT"
glowup_work_dir = "target/release-module-glowup"
channel_switch_work_dir = "target/release-module-channel-switch"

# The local rehearsal of the release lane's pulled path. `just test` builds
# every artifact and installs the one it built; what it never did is resolve a
# cohort from a manifest, verify it by digest, and prove the package against
# that. Those are the only steps a binary release runs and a local gate does
# not, which is why every defect in them cost a release dispatch to find.
#
# The channel is stable because that is the one a first release publishes into,
# and the rehearsal exists for the pairing a first release makes.
rehearsal_script = "scripts/rehearse-release-cohort.py"
rehearsal_channel = "stable"
rehearsal_work_dir = "target/release-rehearsal"
rehearsal_inputs_dir = "target/release-rehearsal-inputs"
# `{version}` is the workspace version and `{arch}` the dpkg architecture, and
# both are load-bearing. `capsem-admin assets channel record-binary` refuses a
# name that does not carry the version, and the exact pairing then matches the
# candidate against its manifest row *by filename* -- so a stable placeholder
# name is refused at authoring time and, if it got past that, would match no
# package record at all. The plan can still name this before anything is built,
# because the version comes from `Cargo.toml`.
rehearsal_package = "target/release-rehearsal-package/Capsem_{version}_{arch}.deb"
rehearsal_content_root = "target/release-rehearsal-content"
rehearsal_glowup_work_dir = "target/release-rehearsal-glowup"
rehearsal_channel_switch_work_dir = "target/release-rehearsal-channel-switch"
# The public before-state the rehearsal pairs against, and the candidate
# manifest it authored. `{channel}` is the rehearsal channel.
#
# The before-state is an unpublished channel, and that shape is not invented:
# for live stable, `select-runtime-preflight-manifest.py` reports
# `bootstrap=true`, so the lane projects its before-state with
# `project-first-channel-before.py`, and that projection returns exactly
# `packages: []` and `profiles: {}`. That is what makes the pairing
# FRESH_INSTALL -- the pairing a first release makes, and the one that had never
# run anywhere before this rehearsal existed.
rehearsal_before_inputs = "target/release-rehearsal-before"
rehearsal_after_manifest = "target/release-rehearsal/dist/assets/{channel}/manifest.json"
release_bin_dir = "CAPSEM_RELEASE_BIN_DIR"
default_bin_dir = "target/debug"
# Cleared for the channel-switch run: it has to rediscover the channel from
# the installed state rather than inherit what the previous run was told.
channel_switch_cleared = [
    "CAPSEM_RELEASE_CHANNEL",
    "CAPSEM_RELEASE_TRANSITION",
    "CAPSEM_RELEASE_BEFORE_MANIFEST",
    "CAPSEM_RELEASE_AFTER_MANIFEST",
    "CAPSEM_RELEASE_BEFORE_PACKAGE",
    "CAPSEM_RELEASE_BEFORE_PROFILE_INPUTS",
    "CAPSEM_RELEASE_AFTER_PROFILE_INPUTS",
    "CAPSEM_RELEASE_PROFILE",
    "CAPSEM_RELEASE_CANDIDATE_PROFILE_PUBLICATION",
    "CAPSEM_RELEASE_PUBLICATION_BASE",
]

# What a glow-up is told about the transition it proves. A workflow exports
# these; the local rehearsal passes them for a cohort it fabricated itself.
# Every name here must also appear in `channel_switch_cleared` above, which the
# schema checks rather than trusts: two lists of the same names drift, and a
# survivor hands the second proof the answer it exists to rediscover.
[modules.release_pairing]
channel = "CAPSEM_RELEASE_CHANNEL"
transition = "CAPSEM_RELEASE_TRANSITION"
before_manifest = "CAPSEM_RELEASE_BEFORE_MANIFEST"
after_manifest = "CAPSEM_RELEASE_AFTER_MANIFEST"
before_profile_inputs = "CAPSEM_RELEASE_BEFORE_PROFILE_INPUTS"
after_profile_inputs = "CAPSEM_RELEASE_AFTER_PROFILE_INPUTS"

# ---------------------------------------------------------------------------
# The isolated home a gate run works in
# ---------------------------------------------------------------------------

[prefix]
# A private copy of the checkout, one per run, so what the gate reads cannot be
# edited by anyone while it runs. Clonefiled on APFS: 2074 tracked files plus
# `.git` measured 2.2s and 186 MB, against 84s and 164 GB for a copy that also
# took `target/` -- which is why the seed the first draft of this design wanted
# is not here.
#
# `parent` is deliberately tiny. `tests/test_gate_prefix.py` checks the
# arithmetic, but the budget is `SUN_LEN` 104 minus the gateway's 64-byte
# `instances/<uuid>-ws.sock` suffix; `/tmp/capsem-gate-<32hex>` is 41
# characters and reproduced a 12,024-error socket failure. `~/.cg/<8hex>` is 24.
parent = "~/.cg"
lease_template = ".{identity}.lock"

# Where `[prefix] lent` output lives between runs, written as a position
# relative to the prefix root rather than as a second absolute path.
#
# Beside that root and never inside it: `sweep` reclaims every directory under
# `parent` except the newest `keep`, and it recognizes a prefix by where it is
# rather than by what it is called, so a cache underneath would survive exactly
# one run. On the same filesystem, because lending is a `rename`.
#
# `{parent}` rather than a path of its own because the two must move together.
# Three separate tests relocated the prefix root to a temporary directory,
# left the cache on the real filesystem, and failed on a cross-device rename
# that had nothing to do with what they were testing.
build_cache = "{parent}-build"

# Where cargo writes, for every run, at one absolute path.
#
# Lending a build directory between prefixes cannot work: cargo records
# `OUT_DIR` under whatever target directory it was given, so a build script's
# generated paths name the prefix that produced them, and the next run is a
# different prefix. Tauri's permission files hit exactly that. Sharing does
# work, and for the same reason lending does not -- the path never changes, so
# every absolute path baked into build output stays true.
#
# Sound because cargo, not this gate, decides what is stale. That is what
# fingerprints are for, and it is the same judgement a developer relies on
# switching branches in one checkout. `[prefix] lent` cannot make that judgement
# and so may only carry content-addressed output.
#
# One writer, because one gate runs per machine under `flock`. Outside `parent`
# so a sweep does not reclaim it as a prefix, and beside it so both sit on one
# filesystem. `--clean-build` discards it, which is what makes that flag mean
# what it says.
#
# The prefix gets a symlink per profile at `target/<profile>`, so the ~30
# checked-in `target/debug/...` and `target/release/...` paths keep resolving
# and the rest of `target/` -- the journal, the materialized config, the test
# homes -- stays private to the run that made it.
cargo_target = "{parent}-target"
cargo_profiles = ["debug", "release"]

# How large that shared directory may get before a run discards it whole.
#
# The bound this system was missing. Prefixes are swept to `keep` on the way
# into every run and `build_cache` is a rename target that never accumulates,
# but cargo never garbage-collects: every dependency bump and deleted crate
# leaves output here forever. Measured 8 GB in three days.
#
# `[disk] required_free_gb` is not this. That is a floor on the filesystem --
# it reports that something has already eaten the disk and stops whoever runs
# next, rather than bounding whatever grew. It stays as the backstop; this is
# the mechanism.
#
# Generous on purpose. Crossing it costs one cold build, so the number should
# be large enough that a working week never does and small enough that the
# floor is never what fires first.
cargo_target_max_gb = 40.0

name_length = 8

# How many prefixes survive a sweep. A failed run keeps its tree so it can be
# resumed into, and the *next* run is the one that no longer needs the one
# before -- the same shape as `[workspace] home`, which is wiped on entry
# rather than on exit so a crash leaves something to inspect.
#
# Bounded because they are not small: one retained prefix on this machine was
# 42 GiB, and it carried the copied signing material with it. Nothing else
# reclaims them -- `[disk] reclaimable` only accepts paths inside the checkout.
#
# Still one, and deliberately: raising it was the other candidate answer to
# cold rebuilds, and it is the wrong one. Ten retained prefixes are ten copies
# of the same `target/`, none of which the eleventh run may use, because a
# prefix is named for its commit and no run may work in another commit's tree.
# `build_cache` reuses the output without duplicating it.
keep = 1

# Copied wholesale despite being invisible to `git ls-files`, which is what the
# source digest counts. `.git` because build provenance goes through `build.rs`
# and every source-state action shells out to git; `private` because it is
# gitignored (`.gitignore:47`) and holds the Tauri signing keys -- a prefix
# built from the digest set alone loses them, and the package lane finds out
# during a release rather than here.
carried = ["private"]

# Lent to whichever prefix is running and taken back when it ends, by rename,
# so build output survives the copy that produced it. Everything here is
# gitignored, which is not a coincidence but the rule: anything the source
# digest counts is the subject under qualification, and a subject carried over
# from an earlier commit is not the tree the operator asked to prove.
# `tests/citadel/test_build_cache_is_reusable.py` checks it against
# `git check-ignore` rather than against a second list here.
#
# Only content-addressed artifacts. `assets/` is VM images plus a manifest of
# their digests: nothing in it records where it was built, so the same bytes are
# valid under any prefix name, and the asset conditions already decide from
# content whether a rebuild is needed.
#
# `target/` is not here, and that was measured rather than assumed. Cargo
# relocates a build directory happily; build *scripts* do not. Tauri records its
# generated permission files by absolute `OUT_DIR`, so the first run given a
# borrowed `target/` died with
#
#   failed to read plugin permissions: failed to read file
#   '~/.cg/6d7cc52c/target/debug/build/tauri-.../permissions/app/.../app_hide.toml'
#
# naming a prefix that had already been reclaimed. That is why compiler output
# is not lent: it is shared instead, at `cargo_target` above, which is the one
# arrangement under which an absolute `OUT_DIR` stays true.
#
# `.venv` and `node_modules` are absent for the same reason with a different
# mechanism: a uv venv records its own absolute path in `pyvenv.cfg` and in
# every console-script shebang, and both are already fast from warm global
# stores.
lent = ["assets"]

# What must come back out before the prefix is reclaimed. A release publishes
# from these, and without the export they die with the copy that made them.
exports = ["dist", "packages", "assets", "target/config", "target/gate-runs"]

# ---------------------------------------------------------------------------
# The host-kernel sandbox
# ---------------------------------------------------------------------------
# `(allow default)` narrowed by targeted denials, not `(deny default)` widened
# by enumerated allows. The second was measured and abandoned: every read list
# tried produced a silent SIGABRT with no stdout, no stderr and a kernel denial
# log that needs sudo to read, so each iteration cost a rebuild to learn
# nothing. Denying writes and the network is where the value is anyway.
[sandbox]
command = "sandbox-exec"
linux_command = "bwrap"
# Same scope as the Seatbelt profile: preserve the host filesystem and UNIX
# sockets, but give the whole gate a network namespace with loopback only.
# Docker still answers over /var/run/docker.sock and its daemon may perform the
# explicitly declared container fetches; direct host-gate egress has no route.
linux_args = [
    "--unshare-net",
    "--die-with-parent",
    "--new-session",
    "--bind", "/", "/",
    # A root bind alone leaves device nodes visible but unusable in Bubblewrap's
    # user namespace (`open(/dev/null)` returns EACCES). Preserve the host device
    # mount explicitly so pytest capture and the KVM/vhost VM proofs both work.
    "--dev-bind", "/dev", "/dev",
]
linux_device_mount = "/dev"
# A pre-gate kernel proof, not a marker: only loopback may exist and a numeric
# external connection must fail. The timeout is config-owned so runner/network
# variance is never hidden in a script literal.
linux_probe_loopback_host = "127.0.0.1"
linux_probe_egress_host = "1.1.1.1"
linux_probe_egress_port = 53
linux_probe_timeout_seconds = 1.0
# Ubuntu 24.04 hosted runners can permit user namespaces but deny Bubblewrap's
# loopback RTM_NEWADDR under AppArmor. Only that exact ephemeral-host signature
# may lift the one sysctl, and the complete kernel proof must then pass again.
linux_hosted_failure_marker = "Failed RTM_NEWADDR"
linux_hosted_repair_command = ["sudo", "sysctl", "-w"]
linux_hosted_userns_sysctl = "kernel.apparmor_restrict_unprivileged_userns"
linux_hosted_userns_required_value = 1
linux_hosted_userns_repair_value = 0
profile_name = "gate.sb"

# Three live advisory queries, plus a release's manifest resolution, exact-main
# publication, and workflow dispatch, are irreducibly networked. The plan
# executor remains inside the kernel sandbox; a helper born immediately before
# it accepts only authenticated, explicitly marked commands for those edges.
# The one-time metadata is deleted before the first plan action, so ordinary
# qualification children never inherit the capability.
egress_metadata_variable = "CAPSEM_GATE_EGRESS_METADATA"
egress_socket_template = "/tmp/capsem-egress-{pid}-{nonce}.sock"
egress_metadata_template = ".egress-{pid}-{nonce}.json"
egress_start_timeout = 5.0
egress_stop_timeout = 5.0
egress_max_message_bytes = 8388608

network_reason = "No mid-run fetch. This is the rule the whole profile exists for."
socket_reason = "`(deny network*)` covers AF_UNIX too, so these come back explicitly."

# Absolute or `~`-relative. Denying the Docker socket makes a running daemon
# look absent -- `permission denied ... docker.sock` -- which is how the first
# sandboxed run is misdiagnosed.
sockets = ["~/.colima/default/docker.sock", "~/.colima/_lima/colima/ha.sock"]

# The gate's own sockets are created per run under paths it does not know
# ahead of time, so they are matched by prefix rather than listed.
# Measured, not guessed. One report-mode run named every socket the gate
# actually opens, and three classes were missing from this list -- an
# enforcing run would have died on each in turn, which is precisely the
# forty-runs-one-discovery-each outcome report mode exists to avoid:
#
#   /private/var/folders/<...>/T/capsem-test-<id>/run/*.sock   552 times
#   <prefix>/target/test-home/.capsem/run/service.sock         463 times
#   ~/.colima/_lima/colima/ha.sock                             169 times
#
# The first is `$TMPDIR` on macOS, which is a per-user path under
# `/private/var/folders` and not `/tmp` at all -- the reason a rule naming
# `/tmp/capsem-` looked complete and was not.
local_socket_prefixes = [
    "/tmp/capsem-",
    "/private/tmp/capsem-",
    "/private/var/folders/",
    "/var/folders/",
]

# The gate's own service, gateway and per-VM sockets live under the workspace,
# which is inside the prefix and therefore has no fixed path to list.
local_socket_regexes = ["target/test-home/\\.capsem/run/"]

# Servers the gate starts and talks to: the mock upstream, the gateway, and
# every per-VM listener. `local:*:0` alone was 1915 of the observed events.
local_binds = true

# The service, the gateway and the mock upstream all talk over loopback.
# `localhost` only: SBPL refuses any other host in a network address --
# `sandbox-exec: host must be * or localhost in network address` -- so
# `127.0.0.1:*` is a profile that will not load rather than a narrower rule.
loopback = ["localhost:*"]

# Report mode's collector. `(with report)` permits an operation and writes it
# to the unified log; without something reading that log, report mode measures
# nothing -- which is exactly what a full report-mode gate run produced before
# this existed: an errors.log with zero sandbox entries.
#
# The absolute path is deliberate. `log` is a zsh builtin, so a bare name here
# resolves to the shell's own and fails with `too many arguments`.
log_command = "/usr/bin/log"
report_predicate = 'sender == "Sandbox"'
report_style = "ndjson"
report_log_name = "sandbox-report.ndjson"
# The deduplicated allow-list, written beside the raw capture on release.
report_summary_suffix = ".allowlist.txt"
# Where the streamer's pid is left for the sandboxed process to find. It has to
# be a file: `log` cannot run sandboxed, so the collector is started before the
# re-exec and the resource that stops it lives on the other side of that exec
# with no handle to inherit.
report_pid_suffix = ".pid"
report_stop_timeout = 10.0

[workspace]
# Everything the gate does happens against this home, never the developer's.
# Wiped at the start of a run, which is why the machine lock is taken first and
# why the lockfile lives outside it.
home = "target/test-home/.capsem"
# AF_UNIX paths must not grow with a full 40-character release prefix. The
# source-root digest makes parallel synthetic checkouts distinct; the machine
# lock makes the production path single-owner.
run_dir = "/tmp/capsem-r-{root_id}"
# Created up front: the service writes into all three and creating them lazily
# was how a first run differed from every later one.
seeded_dirs = ["run", "sessions", "logs"]

# Deliberately NOT cleared per module. `just test` runs several modules in
# sequence and the VM performance recordings are written by the functional one;
# a later module wiping them is why a fortnight of full gates left this empty
# and froze the published arm64 history. The entry point clears it once.
benchmark_root = "target/test-benchmarks"
coverage_file = "target/coverage/.coverage"

# What a failing run leaves behind, copied out before the run directory goes.
evidence_dir = "target/test-artifacts"

# ---------------------------------------------------------------------------
# The step attribute migration
# ---------------------------------------------------------------------------

[boundary.step_attributes]
# Every `step(...)` declares what it is: `kind`, `needs`, `arch`, `speed` and
# `concurrency`. Those attributes are what makes the plan a graph that can be
# reasoned about instead of a set of labels that has to be grepped -- a lint is
# a lint because it says so, not because someone matched `fast.` against its
# name.
#
# The migration is done: every call site declares. The ledger stays as the
# ratchet -- an empty inventory with `max_undeclared = 0` refuses the first
# step that arrives without saying what it is, which is the state the migration
# was for.
max_undeclared = 0



[boundary.step_attributes.undeclared_by_module]

# Commands one plan runs more than once on purpose, each saying why.
# Composition is where repetition hides: every module owns its prerequisites so
# it can run alone, which is right, and nothing noticed what happens when three
# of them are composed into one run. `generate-settings.sh` ran three times in
# a single candidate plan, seventy-five seconds each, for the same file in the
# same prefix.
[[boundary.repeated_actions]]
subject = "pnpm install --frozen-lockfile"
reason = """
Idempotent, and a no-op against a warm tree. Each module that renders a web
surface installs its own node_modules so it can run alone; the alternative is a
module whose independence depends on having been run after another one, which
is more expensive to reason about than a second install that does nothing.
"""

# ---------------------------------------------------------------------------
# The execution log
# ---------------------------------------------------------------------------

[runlog]
# One directory per run, so a failed gate is a directory you attach to a bug
# rather than a scrollback you had to be present for.
root = "target/gate-runs"
events = "run.jsonl"
# Spelled `event_schema` here and emitted as `schema` in each event: a Pydantic
# field named `schema` shadows a BaseModel attribute.
event_schema = "capsem.gate.runlog.v1"
step_log_dir = "steps"
summary = "summary.txt"
# What each run watches for filesystem faults, and where it writes them the
# moment they happen -- not at the end, and not only into `run.jsonl`, because
# a fault nobody sees until someone reads a file is a fault nobody acts on.
# Source trees, because a gate must not edit what it is qualifying; plus the
# staged release channel, because a hardlink *to* checked-in source lands in
# build output and leaves the source directory untouched.
observed_roots = ["config", "crates", "scripts", "guest", "src", "target/web-parity"]
# Trees inside those roots where two files holding identical bytes is somebody
# else's decision. Exact and short on purpose: the duplicate-content rule earns
# its place everywhere else -- it caught a package lane copying a hardlinked
# alias tree into distinct inodes, silently breaking the zero-copy relation --
# so this is a list of trees, never a blanket exemption for generated files.
#
# Tauri writes `desktop-schema.json` and `linux-schema.json` byte-identical on
# Linux. We neither produce nor can deduplicate them, so every fast-lane run
# reported one filesystem fault, and a fault count that is never zero is a
# fault count nobody reads.
duplicate_content_exempt = ["crates/capsem-app/gen"]
# `source.record` intentionally copies every Git-visible byte into this exact
# tree. Duplicate and empty bytes there are properties of checked-in input,
# while hardlinks, mode churn, and concurrent writers remain faults.
source_replica_roots = ["target/gate-source-snapshot"]
# How Linux answers "what path is this descriptor". `shutil.rmtree` deletes
# through a directory descriptor, so the observer receives a bare entry name
# and has to anchor it -- without this it resolved against the working
# directory, which is the checkout root, and reported tracked files nothing had
# touched. macOS answers the same question through `fcntl(F_GETPATH)`, which
# takes no path to name here.
fd_path_template = "/proc/self/fd/{handle}"
error_log = "errors.log"
# Bounded, because a run that trips one rule per file trips it thousands of
# times and an unbounded fault log on a machine that gates daily is a
# disk-full outage wearing a helpful name. Total stays under
# max_bytes * (keep + 1); the newest faults -- the ones describing the failure
# being looked at -- are the ones kept.
error_log_max_bytes = 4194304
error_log_keep = 3
latest_link = "latest"
# Allocation, rotation and repointing `latest` are serialized on this, briefly.
# Not the machine lock: that is held for a whole gate, and opening a run log
# must not wait for one.
history_lock = ".history.lock"
# Held for the length of a run, so retention can tell a run still being
# written from a crashed one somebody wants to read.
active_marker = ".active"
# Exact-source attempt journals are hard-linked here before their terminal
# event is written. Ordinary run rotation may remove the large step logs, but
# it cannot erase the small journal that proves (or resumes) a source commit.
source_archive_dir = "source-runs"
# Rotation by count and by bytes. A forty-minute gate writes a lot, and the
# machine running it is also the machine building VM images.
keep_runs = 20
keep_bytes = 2_000_000_000
# blake3 because the asset pipeline already speaks it.
artifact_digest = "blake3"
# Actions slower than this are named in the timing summary.
slow_action_seconds = 30
# How much of a failed command's own output is repeated in the error. The whole
# log stays in `steps/`; this is the part that has to be in front of whoever is
# reading the failure, without putting a gigabyte of compiler output in JSONL.
failure_tail_lines = 40

# Nothing bounds how long `fast-test` may take, and deliberately so. The
# wall-clock budget that did was removed after it failed two releases: a
# constant cannot tell a slow test from a cold runner, and the escape hatch it
# needed to stop doing that made it a budget suspended everywhere it would
# fire. `timing_regression` below is added only at
# `TimingBoundary.QUALIFICATION`, so it does not reach this lane either.
#
# The replacement is a report, not a gate. Every run already records per-step
# durations; what is missing is comparing them to the previous comparable run
# and *saying so* -- per step, so "the lane got slower" arrives as "this step
# went from 4s to 40s" rather than as a number to argue with. Nothing fails on
# it. A step can be legitimately slower, and the run that discovers this should
# tell whoever is watching, not stop them.
#
# Comparing two fast-lane runs is only meaningful now because a shared build
# directory removed the cold/warm split that dominated every earlier
# measurement.
[runlog.timing_regression]
# A release guard, not a stopwatch SLA. Compare complete qualification with
# its latest successful run on the same platform/machine/core count and exact
# graph. Durations come only from those journals: config owns the allowed
# relative increase and how many baseline-ranked slow steps matter, never a
# guessed number of seconds.
maximum_factor = 1.5
slowest_steps = 10

# Which HTTP routes the benchmark system measures.
#
# A route added to the router and to neither list fails
# `tests/test_bench_route_coverage.py`. That is the point: 53 of the 101
# service routes had no timing signal of any kind, and nothing noticed,
# because coverage was a hand-maintained list of 27 contracts in a test file
# rather than something derived from the router.
#
# `unmeasured` is a debt inventory, not an exemption list. It starts holding
# every route because the bench system measures none of them yet, and each
# entry is deleted as the routes collector covers it.
[benchmark.routes]
measured = [
    "/status",
    "/version",
    "/vms/list",
    "/profiles/list",
    "/profiles/status",
    "/stats",
    "/system/status",
    "/update/status",
]
unmeasured = [
    "/corp/edit",
    "/corp/info",
    "/corp/reload",
    "/corp/validate",
    "/detection/latest",
    "/detection/status",
    "/enforcement/latest",
    "/enforcement/status",
    "/host-logs/{name}",
    "/panics",
    "/profiles/reload",
    "/profiles/{profile_id}/assets/ensure",
    "/profiles/{profile_id}/assets/info",
    "/profiles/{profile_id}/assets/status",
    "/profiles/{profile_id}/detection/evaluate",
    "/profiles/{profile_id}/detection/info",
    "/profiles/{profile_id}/detection/reload",
    "/profiles/{profile_id}/detection/rules/list",
    "/profiles/{profile_id}/detection/rules/{rule_id}/delete",
    "/profiles/{profile_id}/detection/rules/{rule_id}/edit",
    "/profiles/{profile_id}/enforcement/evaluate",
    "/profiles/{profile_id}/enforcement/info",
    "/profiles/{profile_id}/enforcement/reload",
    "/profiles/{profile_id}/enforcement/rules/list",
    "/profiles/{profile_id}/enforcement/rules/{rule_id}/delete",
    "/profiles/{profile_id}/enforcement/rules/{rule_id}/edit",
    "/profiles/{profile_id}/info",
    "/profiles/{profile_id}/mcp/default/edit",
    "/profiles/{profile_id}/mcp/default/info",
    "/profiles/{profile_id}/mcp/info",
    "/profiles/{profile_id}/mcp/servers/list",
    "/profiles/{profile_id}/mcp/servers/{server_id}/delete",
    "/profiles/{profile_id}/mcp/servers/{server_id}/edit",
    "/profiles/{profile_id}/mcp/servers/{server_id}/refresh",
    "/profiles/{profile_id}/mcp/servers/{server_id}/tools/list",
    "/profiles/{profile_id}/mcp/servers/{server_id}/tools/{tool_id}/call",
    "/profiles/{profile_id}/mcp/servers/{server_id}/tools/{tool_id}/edit",
    "/profiles/{profile_id}/obom",
    "/profiles/{profile_id}/plugins/credential_broker/credentials/info",
    "/profiles/{profile_id}/plugins/credential_broker/credentials/reload",
    "/profiles/{profile_id}/plugins/info",
    "/profiles/{profile_id}/plugins/list",
    "/profiles/{profile_id}/plugins/{plugin_id}/edit",
    "/profiles/{profile_id}/plugins/{plugin_id}/info",
    "/profiles/{profile_id}/reload",
    "/profiles/{profile_id}/skills/add",
    "/profiles/{profile_id}/skills/info",
    "/profiles/{profile_id}/skills/list",
    "/profiles/{profile_id}/skills/{skill_id}/delete",
    "/profiles/{profile_id}/skills/{skill_id}/edit",
    "/profiles/{profile_id}/validate",
    "/purge",
    "/run",
    "/security/latest",
    "/security/status",
    "/service-logs",
    "/settings/edit",
    "/settings/info",
    "/triage",
    "/update/apply",
    "/update/check",
    "/vms/create",
    "/vms/{id}/delete",
    "/vms/{id}/detection/latest",
    "/vms/{id}/detection/status",
    "/vms/{id}/enforcement/latest",
    "/vms/{id}/enforcement/status",
    "/vms/{id}/exec",
    "/vms/{id}/files/content",
    "/vms/{id}/files/list",
    "/vms/{id}/files/read",
    "/vms/{id}/files/write",
    "/vms/{id}/fork",
    "/vms/{id}/fork/status",
    "/vms/{id}/history",
    "/vms/{id}/history/counts",
    "/vms/{id}/history/processes",
    "/vms/{id}/history/transcript",
    "/vms/{id}/info",
    "/vms/{id}/logs",
    "/vms/{id}/pause",
    "/vms/{id}/resume",
    "/vms/{id}/save",
    "/vms/{id}/save/status",
    "/vms/{id}/security/latest",
    "/vms/{id}/security/status",
    "/vms/{id}/snapshots/list",
    "/vms/{id}/snapshots/status",
    "/vms/{id}/start",
    "/vms/{id}/stats/detail",
    "/vms/{id}/status",
    "/vms/{id}/stop",
    "/vms/{id}/timeline",
]

[benchmark_regression]
# Product benchmarks use the latest checked-in result as evidence. A release
# fails when any measured duration or allocated-byte metric grows by more than
# this ratio; there is deliberately no independently authored seconds/MB cap.
maximum_factor = 1.2

[runlog.ledger]
# What survives rotation. `keep_runs` above is twenty and a day of gating
# spends that before lunch, so every question worth asking -- is this getting
# slower, does that keep failing, did the change help -- was answerable only
# across whatever had not yet been deleted. A row is a couple of kilobytes.
path = "target/gate-runs/ledger.jsonl"
row_schema = "capsem.gate.ledger.v2"
# Months of history for a few megabytes. Trimmed at every append, so the file
# cannot become the thing that fills the disk it was added to protect.
keep_rows = 2000

[runlog.digest]
# The overview regenerated on every run and injected into every agent session.
# It is read far more often than it is written, and it is paid for in context
# on work that has nothing to do with the gate, so both bounds below are about
# staying worth reading rather than about storage.
path = "target/gate-runs/DIGEST.md"
# Comparable in the ledger's sense: same command, argv, host class and plan
# shape. Ten is enough for a median to survive one bad neighbour.
compare_runs = 10
recent_runs = 8
# Looser than the release ratchet's 1.5x, which refuses a release. This writes
# a sentence, and a sentence that fires on ordinary variance gets ignored.
regression_factor = 1.6
improvement_factor = 1.5
# Trends read every measured step, not just the critical path -- growth is
# worth seeing before it becomes what the run waits for. Across a hundred-step
# plan that needs a floor and a bound, or the document stops being read: a
# factor means least where the absolute numbers are smallest, and this file is
# paid for in context on every session.
trend_floor_seconds = 5.0
trends = 8
# Two failures is not noise and not yet a pattern. Naming it is the point: an
# intermittent step is excused every time it is seen alone.
thrash_runs = 2
residency_fraction = 0.6
# Past this, the advice changes from "make it faster" to "it is queueing" --
# a critical path made of waiting does not shorten when its steps do.
wait_fraction = 0.3
hotspots = 6
# A `FAST` step owning this much of a lane's critical path is reported. Against
# the critical path, not the sum of a stage: the sum makes a two-second `ty`
# pass read as most of a stage that contains nothing else, while the critical
# path is what the run actually waits for.
lane_share = 0.25

# ---------------------------------------------------------------------------
# Disk the gate is allowed to occupy
# ---------------------------------------------------------------------------

[disk]
# Everything the gate can create, so reclaiming is a policy rather than whoever
# remembers a path. Nothing outside this list may be removed: a guard proves the
# reclaimer cannot reach past it, and the loader rejects an absolute path or a
# `..` so the list cannot be aimed at the wrong tree.
reclaimable = [
    "target/gate-runs",
    "target/test-home",
    "target/image-workspace",
    "target/test-benchmarks",
    "target/linux-rust-coverage",
    "target/install-test-assets",
    "target/release-channel",
    "target/release-module-glowup",
    "target/release-module-channel-switch",
]
# Refuse to start an expensive phase below this, after reclaiming what we can.
# The gate builds two architectures of VM images; running out at minute thirty
# wastes the thirty.
required_free_gb = 60
# The same floor for the scratch filesystem, which is often not the one the
# checkout is on. `required_free_gb` measures where `target/` lives; the suites
# do their bulk scratch work under the temporary directory, and on a host where
# that is a tmpfs it is a much smaller, entirely separate volume. One run died
# on ENOSPC twenty-five minutes in with 196GB free beside it, because nothing
# was measuring the 32GB tmpfs that filled.
#
# Lower than `required_free_gb` because this holds a run's transient working
# set rather than its built artifacts: VM session directories, per-test
# temporary trees and image audit unpacks.
#
# Checked but never reclaimed. Every `reclaimable` entry is relative to the
# checkout by construction, so the gate cannot -- and must not -- delete
# anything out there.
required_free_scratch_gb = 15
# Warn when a single run's own footprint passes this.
run_footprint_warn_gb = 40

# ---------------------------------------------------------------------------
# Discarded verdicts
# ---------------------------------------------------------------------------
#
# `command || true` runs a command and throws its exit status away. Most uses
# here are legitimate -- clearing state that may not be set, killing a process
# that may not be running, printing diagnostics after a failure -- and a few
# are deliberate cache prewarms. None is wrong today.
#
# They are ratcheted anyway, because this is the shape that costs the most for
# the least: `test "$X" = success || true` satisfied a release contract while
# branch protection was switched off, and nothing anywhere said so.
#
# The ratchet is on the *exact command*, hashed. Not a count -- a count fails
# you for adding legitimate cleanup and passes the one dangerous change. Not a
# program name either -- `launchctl bootout` on an unloaded service is expected
# to fail while `launchctl` elsewhere is a real check, so the program says
# nothing about whether the verdict mattered.
#
# The hash is taken over the command's parsed argv, not its source text, so
# reformatting, requoting or moving the line does not churn the ledger. Change
# *what* is suppressed and the hash changes, which is a new decision and has to
# be stated as one.
#
# Every entry carries its reason. An entry with no reason is refused: the whole
# point is that discarding a verdict is a choice somebody made on purpose, and
# a choice nobody can explain later is the one worth finding.
#
# The reasons below were written by reading each call site at the time the
# ledger was seeded, not by the author of the line. Correct one if it is wrong
# -- that is cheaper than the alternative, which is trusting it.

[[boundary.sequenced_runs]]
subject = "Dockerfile.install-builder:RUN[7]"
reason = "starts a system dbus that may already be running and whose absence the following linger fallback handles; adding set -e would turn a tolerated probe into a build failure"

[[boundary.discarded_verdicts]]
digest = "7538ffecc5da"
