# The build and release gate's data, in one place.
#
# `src/capsem/gate/` holds the decisions; this holds the values those decisions
# are made from -- container names, scratch paths, timeouts, the boundary/rail
# pairs the storage policy accepts, the artifacts an asset build must produce.
#
# It exists because the same values were previously spelled inside whichever
# module happened to need them, which is how the justfile ended up with eleven
# hand-written copies of one storage command and four disagreeing `case` blocks
# over architecture names. A value that lives in one file can be read by the
# code, by the contract tests, and by a person deciding whether to change it.
#
# Loaded through `capsem.gate.config`, which validates it with Pydantic: a
# missing key or a wrong type fails at load with the field named, not deep
# inside a forty-minute run.
version = 1

# ---------------------------------------------------------------------------
# Architectures
# ---------------------------------------------------------------------------
# One target under every name some tool insists on. `uname -m` says aarch64,
# the assets tree says arm64, dpkg says arm64 for ARM but amd64 for Intel, and
# rustc wants a full triple.

# `/usr/lib/<gnu>/pkgconfig` is where every multiarch cross toolchain puts its
# `.pc` files; the tuple is the only part that varies.
pkg_config_template = "/usr/lib/{gnu}/pkgconfig:/usr/share/pkgconfig"

[architectures.arm64]
rust_target = "aarch64-unknown-linux-gnu"
dpkg = "arm64"
gnu = "aarch64-linux-gnu"
apt_cross_compilers = ["gcc-aarch64-linux-gnu", "g++-aarch64-linux-gnu"]
docker_platform = "linux/arm64"
aliases = ["arm64", "aarch64"]

[architectures.x86_64]
rust_target = "x86_64-unknown-linux-gnu"
dpkg = "amd64"
gnu = "x86_64-linux-gnu"
apt_cross_compilers = ["gcc-x86-64-linux-gnu", "g++-x86-64-linux-gnu"]
docker_platform = "linux/amd64"
aliases = ["x86_64", "amd64"]

# ---------------------------------------------------------------------------
# Docker storage
# ---------------------------------------------------------------------------

[storage]
policy_script = "scripts/docker-storage-policy.py"
ensure_space_script = "scripts/ensure-docker-space.sh"

# Points at which storage held for a finished rail may be released, and the
# rail whose headroom that release serves. Eleven recipes used to spell these
# pairs by hand, so the legal set existed only as a habit.
[storage.phases]
completed-docker-rails = { boundary = "after-assets", rail = "package" }
completed-package-arm64 = { boundary = "after-package-arm64", rail = "install" }
completed-package-x86_64 = { boundary = "after-package-x86_64", rail = "install" }
deferred-install-target = { boundary = "before-packages", rail = "package" }
after-install = { boundary = "after-install", rail = "install" }

# ---------------------------------------------------------------------------
# Stopping gate-owned daemons
# ---------------------------------------------------------------------------

[doctor]
storage_policy = "config/storage-policy.toml"
# The host-tooling half of `just doctor`. The gate command checks its own
# wiring; this checks the machine, and reads the skip variables an image
# build sets so the asset and KVM checks do not fail on the very thing that
# build is about to produce.
common_script = "scripts/doctor-common.sh"

[pidfiles]
# Ordered. The gateway owns the fixed localhost port, so it must stop before
# the service -- otherwise the next profile attaches to an orphan gateway whose
# UDS points at a deleted run directory.
names = ["gateway.pid", "service.pid"]
term_wait_seconds = 2.0
kill_wait_seconds = 1.0
poll_interval_seconds = 0.1
# Linux reports process state here. A zombie answers `kill -0` until someone
# waits on it, so liveness needs more than the signal.
proc_stat_template = "/proc/{pid}/stat"

# ---------------------------------------------------------------------------
# What the published product runs on
# ---------------------------------------------------------------------------
# One home for the user-facing support claim. These floors were written out
# longhand in both public install.sh copies, the Tauri bundle, the README and
# the docs, with nothing comparing them -- and they had already drifted: the
# installers refused anything below macOS 14 while the bundle advertised 13.0.

[platforms.macos]
minimum_version = "14.0"
minimum_release_name = "Sonoma"

[platforms.linux]
# Derived from the shipped binaries by scripts/derive-deb-libc-floor.py and
# declared by the .deb, so apt refuses an install it cannot run. Lowering it is
# a build-base change, not a source change; see issue #181.
minimum_glibc = "2.39"

# Every release the glow-up proof runs the package on. One list: the proof
# reads each image's real glibc and derives whether the package must run or
# must be refused, so a release cannot sit in the wrong bucket and still pass.
# The image reference is derived from `version`, never written out beside it.
[[platforms.linux.distributions]]
name = "Ubuntu"
version = "26.04"
libc = "glibc 2.43"
repository = "ubuntu"
digest = "sha256:678c6550cc43645e08669028bc177f50be4e7c5b8cca677067b1914d4afc7a03"

[[platforms.linux.distributions]]
name = "Ubuntu"
version = "24.04"
libc = "glibc 2.39"
repository = "ubuntu"
digest = "sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"

[[platforms.linux.distributions]]
name = "Ubuntu"
version = "22.04"
libc = "glibc 2.35"
repository = "ubuntu"
digest = "sha256:3b06811b2afd352be909dd088a004166d665dc76d38b13eada33522a9d915c6f"

[[platforms.linux.distributions]]
name = "Ubuntu"
version = "20.04"
libc = "glibc 2.31"
repository = "ubuntu"
digest = "sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214"

[[platforms.linux.distributions]]
name = "Debian"
version = "13"
libc = "glibc 2.41"
repository = "debian"
tag_suffix = "-slim"
digest = "sha256:3a39a0592364683e6bab97937b72cad5a8fa6dcbbee90edb3bb48c7f8e94f258"

[[platforms.linux.distributions]]
name = "Debian"
version = "12"
libc = "glibc 2.36"
repository = "debian"
tag_suffix = "-slim"
digest = "sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241"

# musl, not a slightly older glibc. A glibc floor says nothing about these, so
# they are here to keep that distinction proved rather than assumed. Serving
# them needs a musl-linked package, not a lower floor -- see issue #182.
[[platforms.linux.distributions]]
name = "Alpine"
version = "3.24"
libc = "musl 1.2.6"
repository = "alpine"
