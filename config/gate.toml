version = "3.23"
libc = "musl 1.2.5"
repository = "alpine"
digest = "sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40"

[[platforms.linux.distributions]]
name = "Alpine"
version = "3.22"
libc = "musl 1.2.5"
repository = "alpine"
digest = "sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce"

[[platforms.linux.distributions]]
name = "Alpine"
version = "3.21"
libc = "musl 1.2.5"
repository = "alpine"
digest = "sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d"

# ---------------------------------------------------------------------------
# The native install and glow-up proof
# ---------------------------------------------------------------------------

[apt_snapshot]
# One signed immutable Ubuntu archive for every network-open helper. Sharing
# the authority prevents package and install qualification from selecting two
# different OS cohorts under the same source revision.
base = "https://snapshot.ubuntu.com/ubuntu"
id = "20260810T000000Z"
configure_script = "scripts/configure-apt-snapshot.sh"

[install]
# The source image, smoke, and privileged systemd runtime are all sealed. The
# only egress is the input-keyed helper materializer below.
runtime_network = "none"
container = "capsem-install-test"
image = "capsem-install-test"
dockerfile = "docker/Dockerfile.install-test"
# The build context. `.` -- the checkout root -- because the Dockerfile copies
# from it; named here so the wrapper is told rather than assuming.
context = "."
smoke_network = "none"
venv = "/home/capsem/.venv-install-test"
# A current-source CLI compiled once while the source image is still being
# built. Update/channel tests need behavior newer than the package under test,
# but the privileged runtime is deliberately unable to run Cargo or Rustup.
source_cli = "/opt/capsem/install-test/bin/capsem-current"
mount = "/src"
channel = "local"
# The install proof re-publishes immutable, already-selected public inputs into
# a loopback-only graph. Current public profiles predate the strict SemVer
# authoring rule; release authoring never selects this policy and remains strict.
profile_revision_policy = "selected-input"
manifest_version = "1.0.0"

# Build output the install proof reads, which the image cannot carry because
# it is produced *after* the image is built. ProfileContent supplies its exact
# assets/config pair separately. Mounted read-only -- an install proof that
# could rewrite the package it is proving would be proving nothing.
generated_inputs = ["dist"]
systemd_ready_attempts = 30
systemd_ready_interval_seconds = 0.5
serve_ready_file = "/tmp/capsem-install-release.json"
serve_ready_attempts = 100
serve_ready_interval_seconds = 0.05

# Present and writable means this host can boot a real guest, and the glow-up
# runs complete rather than packaging-only.
vm_devices = ["/dev/kvm", "/dev/vhost-vsock"]
optional_vm_devices = ["/dev/vsock"]
# Docker keeps host numeric device ownership. This wrapper maps only the
# selected non-root device gids onto the unprivileged proof user before
# systemd creates that user's manager and recomputes supplementary groups.
vm_device_setup_script = "scripts/prepare-install-vm-devices.sh"
rosetta_binfmt = "/proc/sys/fs/binfmt_misc/rosetta"

# Where the extracted-but-not-installed package lands. Deliberately not
# /usr/bin: nothing that authors the release graph may depend on the package
# under test having been installed first.
# What a systemd container is, wherever one is started.
systemd_command = "/usr/lib/systemd/systemd"
cgroup_path = "/sys/fs/cgroup"
# Options spelled out: Docker's default tmpfs flags are `rw,nosuid,nodev,
# noexec`, and the install proof unpacks the shipped package into /tmp and runs
# its capsem-admin from there. On a noexec mount `test -x` simply returns
# false, and `test` prints nothing when it says no -- so the gate failed after
# fifty-three minutes with an exit status and no explanation.
tmpfs_paths = ["/run:rw,exec,mode=755", "/tmp:rw,exec,mode=1777"]

# Where an installed package puts things, and what the runtime calls them.
bin_dir = "/usr/bin"
installed_capsem = "/usr/bin/capsem"
capsem_home = ".capsem"
manifest_name = "manifest.json"
sbom_name = "capsem-sbom.spdx.json"
candidate_prefix = "v"
file_url_scheme = "file://"
release_site_dir = "release-site"
storage_ledger = "target/storage"
test_output_root = "/tmp/capsem-test-output"

# Where the postinst records which channel it hydrated from. Read back after
# `dpkg -i`: the sealed image has no repair/fetch rail, and a stale handoff
# must not let the package hydrate from somewhere else.
install_log_glob = "$HOME/.capsem/logs/install-*.log"
preinstall_root = "/tmp/capsem-preinstall"
admin_relative = "usr/bin/capsem-admin"
request_script = "scripts/install-manifest-request.sh"

# The authoritative release graph, and the legacy runtime projection an
# operator can mistake for it. Handing the installer the second produces an
# install that looks fine and carries the wrong manifest.
graph_manifest = "assets/local/manifest.json"
legacy_projection = "manifest.json"
# Manifest-selected release inputs are retained beneath the paired content
# root so every rewritten file:// URL remains available inside the sealed
# install container.  The whole root is mounted read-only at the same absolute
# address; assets and config are still mounted at their product-facing paths.
selected_inputs_dir = "inputs"
# The narrow exact-package proof mounts its immutable content here, then copies
# it into writable staging before capsem-admin records the candidate binary.
proof_content_mount = "/mnt/capsem-proof-content"
proof_assets_name = "assets"
proof_config_name = "config"
# The package's complete runtime dependency names.  Release hosts verify the
# actual Depends field against this tuple before installing from apt_snapshot.
package_runtime_packages = [
    "libwebkit2gtk-4.1-0",
    "libgtk-3-0",
    "libxdo3",
    # Derived from the shipped binaries by scripts/derive-deb-libc-floor.py,
    # not hand-written: the hand-written list above omitted libc entirely, so
    # the package installed on glibc older than it needs and then every binary
    # failed at runtime instead of apt refusing the install.
    "libc6",
]

[install.builder]
dockerfile = "docker/Dockerfile.install-builder"
tag_template = "capsem-install-builder:{digest}"
source_tag_template = "capsem-install-test:{digest}"
source_identity_file = "target/install-image-identity.json"
identity_inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    ".cargo/config.toml",
    "pyproject.toml",
    "uv.lock",
    "release-site/package.json",
    "release-site/pnpm-lock.yaml",
    "release-site/pnpm-workspace.yaml",
    "docker/Dockerfile.install-builder",
    "docker/materialize-install-os.sh",
    "scripts/configure-apt-snapshot.sh",
]
identity_globs = ["crates/*/Cargo.toml"]
materialize_build_network = "default"
source_build_network = "none"
cargo_store = "/opt/capsem/install-cargo"
pnpm_store = "/opt/capsem/install-pnpm"
# Includes both the real systemd harness and every dependency declared by the
# publishable Debian package. They are reinstalled from `apt_snapshot` so
# `dpkg -i` succeeds once; qualification never repairs through apt.
apt_packages = [
    "systemd",
    "systemd-container",
    "dbus",
    "dbus-user-session",
    "sudo",
    "zstd",
    "libwebkit2gtk-4.1-0",
    "libgtk-3-0",
    "libxdo3",
    "libc6",
]

# The unprivileged user the container runs proofs as. Every one of these paths
# has to stay off the bind mount: /src belongs to the host uid, so anything
# written there by `capsem` fails with EACCES on Linux and only on Linux.
[install.guest_user]
name = "capsem"
home = "/home/capsem"
runtime_dir = "/run/user/1000"
tmp = "/home/capsem/tmp"
pytest_cache = "/home/capsem/.pytest_cache"
asset_manifest = "/home/capsem/.capsem/assets/manifest.json"

# The suite proving the installed package, run from inside the container.
[install.suite]
path = "tests/capsem-install/"
glowup_script = "scripts/local-release-glowup.py"
macos_report_check = "scripts/check-macos-native-glowup.py"
serve_script = "scripts/serve-release-test-root.py"
sbom_script = "scripts/generate-host-binary-sbom.py"
web_surface_script = "scripts/check-web-surface.sh"
runtime_dependencies_script = "scripts/install-deb-runtime-dependencies.py"
runtime_dependencies_config = "config/gate.toml"
# The Debian package name, as dpkg-query reports it.
package_name = "capsem"

# Scratch, all under target/ so a failed run leaves evidence without dirtying
# the checkout.
[install.layout]
assets = "target/install-test-assets"
config = "target/install-test-config"
channel = "target/install-test-channel"
packages = "target/install-test-packages"
glowup = "target/local-release-glowup"
glowup_evidence = "target/local-release-glowup-evidence"

# Written by the container as its own user, and handed back on the way out.
extra_owned_paths = ["release-site/node_modules", "release-site/dist"]

# ---------------------------------------------------------------------------
# The Linux package rail
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# The files a bootable asset tree is made of
# ---------------------------------------------------------------------------
# The variables that say which capsem a process is talking to
# ---------------------------------------------------------------------------
#
# Workspace exports them and Service reads them, and they were spelled
# separately in both -- so an isolated workspace could export one name while
# the daemon inside it honoured another, and the daemon would quietly attach
# to the developer's own home.

# Which capsem a process is talking to, and where it looks. One owner: these
# were spelled here and again as dictionary keys in `assets`, `service` and
# `devloop`, and the guard that watches for literal environment *reads* could
# not see a write.
[environment]
home = "CAPSEM_HOME"
run_dir = "CAPSEM_RUN_DIR"
assets_dir = "CAPSEM_ASSETS_DIR"
profiles_dir = "CAPSEM_PROFILES_DIR"
benchmark_root = "CAPSEM_BENCHMARK_OUTPUT_ROOT"
coverage_file = "COVERAGE_FILE"
# Set by the parent that built a private checkout, and read by the child that
# runs inside it. This is what stops the re-exec recursing: a process that
# already sees it is already in a prefix and builds no second one. It carries
# the *source* checkout's path, because a run in a prefix still has to be able
# to name the tree it is qualifying.
source_checkout = "CAPSEM_GATE_SOURCE_CHECKOUT"
# Where cargo compiles, shared by every run; see `[prefix] cargo_target`.
cargo_target = "CARGO_TARGET_DIR"
# Full immutable release source selected by the parent. Unlike
# source_checkout, this says the outer working tree is not the subject.
source_commit = "CAPSEM_GATE_SOURCE_COMMIT"
# The commit the tree under this run identifies as. Distinct from
# source_commit, which says the outer working tree is *not* the subject: this is
# set for every run, including an ordinary `just test`, and it exists so a step
# can be told which commit it is proving instead of resolving one itself.
#
# `scripts/local-release-glowup.py` is the reason. It authors a release graph
# with package provenance, and a graph that invented its own commit from
# whatever tree the script happened to sit in would be provenance about the
# wrong bytes -- inside the install container, that tree is a mount. So the
# script is told, and the gate is the one that knows.
qualified_source_commit = "CAPSEM_GATE_QUALIFIED_SOURCE_COMMIT"
# The effective typed owning-command policy, injected into ordinary plan
# actions and cleared at explicitly outside-sandbox edges. Doctor uses it to
# distinguish an enforcing candidate from a network-open standalone build
# without guessing from the lock.
command_sandbox_mode = "CAPSEM_GATE_COMMAND_SANDBOX_MODE"

# What the install-test image's smoke check is told. `UV_PROJECT_ENVIRONMENT`
# is uv's own convention rather than a Capsem rail, but it is named here for
# the same reason as the rest: a rename should be one edit, not a search.
[environment.install]
test_output_root = "CAPSEM_TEST_OUTPUT_ROOT"
project_environment = "UV_PROJECT_ENVIRONMENT"
# pnpm asks before purging a `node_modules` it did not create, and refuses when
# it cannot ask: `ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY`. The install
# proof reaches that state legitimately now -- `/src/release-site` comes from
# the image while its `node_modules` is a cross-run volume, so the two can
# disagree. This is a gate; there is never a TTY and never anyone to ask.
ci = "CI"

# What the builder container is told about the target it is building for.
# `HOST_UID` and `HOST_GID` stay literal: they are the standard convention for
# handing container output back to the invoking user, not a Capsem rail.
[environment.package]
target_arch = "TARGET_ARCH"
rust_target = "RUST_TARGET"
dpkg_arch = "DPKG_ARCH"
rust_toolchain = "RUST_TOOLCHAIN"
# Where the builder writes what it produced. A container path, so the artifact
# this lane publishes does not arrive through the writable bind mount that made
# a release die on an intermittent EACCES -- `docker cp` brings it out instead.
output_dir = "CAPSEM_PACKAGE_OUTPUT_DIR"
# The source revision, told to the builder instead of read from a repository.
# The lane image is `COPY . /src` and `.dockerignore` drops `.git`, so a
# container has no repository to ask -- and shipping one into every lane image
# to answer a single question is not the trade. `build.rs` embeds this and
# `check-build-provenance.sh` refuses a binary that does not.
build_revision = "CAPSEM_BUILD_REVISION"

# Where a release-site build reads its inputs from and writes its output to.
# `CAPSEM_RELEASE_GRAPH` is the input and `CAPSEM_RELEASE_CHANNEL_DIST` the
# output; one name meant both until they were split, and keeping them adjacent
# here is what makes the pair readable.
[environment.release_site]
url = "CAPSEM_RELEASE_URL"
graph = "CAPSEM_RELEASE_GRAPH"
channel_dist = "CAPSEM_RELEASE_CHANNEL_DIST"

# What the in-container install proof is told about the package it just
# installed.
[environment.install_proof]
installed = "CAPSEM_DEB_INSTALLED"
bin_src = "CAPSEM_BIN_SRC"
asset_manifest = "CAPSEM_TEST_ASSET_MANIFEST"
source_cli = "CAPSEM_INSTALL_SOURCE_CLI"

# Where the Linux parity runner writes, told to the checked-in script.
[environment.linux_rust]
output_dir = "CAPSEM_LINUX_RUST_OUTPUT_DIR"

# ---------------------------------------------------------------------------
#
# One owner. These were listed in `[imagebuild] required` and again in
# `[assets] required_artifacts`, and `initrd.py` reached for the initrd by
# spelling its filename -- three places to keep in step, none of which
# referred to the others.

[artifacts]
kernel = "vmlinuz"
initrd = "initrd.img"
rootfs = "rootfs.erofs"

[package]
# The rail's inputs, named here so a release lane and the gate agree on one
# spelling. These were literals inside `os.environ.get(...)`, which meant
# renaming a rail required finding every one of them by hand.
manifest_variable = "CAPSEM_INSTALL_MANIFEST_URL"
channel_variable = "CAPSEM_INSTALL_CHANNEL"
require_proof_variable = "CAPSEM_REQUIRE_LINUX_DEB_PROOF"

builder_image = "capsem-host-builder:latest"
build_script = "scripts/build-linux-package.sh"
proof_selector = "scripts/select-linux-deb-proof.sh"

# The sidecar a release lane stages beside its manifest.
release_inputs_name = "release-inputs.json"
default_manifest_url = "https://release.capsem.org/assets/stable/manifest.json"
channels = ["stable", "nightly", "corp"]
default_channel = "stable"
toolchain_pin = "rust-toolchain.toml"
clock_script = "scripts/sync-container-clock.py"
cargo_target_mount = "/cargo-target"
package_suffix = ".deb"
dist_dir = "dist"
# The container the build runs in, kept until its output has been copied out.
# `--rm` and `docker cp` are mutually exclusive, which is the same constraint
# the Linux parity lane hit: a removed container has nothing left to read.
# Network-open dependency work belongs to `[package.builder]`. Both the source
# image build and the qualifying container below are explicitly network-none.
lane_container = "capsem-package-{arch}"
# The source goes in as an image layer, not a mount. See
# `docker/Dockerfile.package` for why a mount could not be sealed: the frontend
# bundler writes atomic temporaries in `frontend/` itself, so `:ro` was
# impossible and scratch over `frontend/` would have masked the source.
# One tag for every architecture -- the source is the same, and `COPY`
# invalidates the layer on any source change, which is the correct cache key.
# Build output the lane consumes and the image deliberately does not carry.
# `assets/` is 3.0 GB and changes every run; `target/config` is the
# materialized profile catalog `repack-deb.sh` reads. Both are produced by
# earlier steps, so they are mounted read-only rather than copied.
generated_inputs = ["assets", "target/config"]
lane_dockerfile = "docker/Dockerfile.package"
lane_image = "capsem-package-lane:latest"
# The checkout is copied into the source image; these three paths get
# container-local scratch grafted over them, because the build genuinely
# writes to all three and none of those writes belongs in the source layer.
# `pnpm install` fills
# node_modules, `pnpm build` fills dist, and Tauri's build script regenerates
# ACL schemas into the app crate's `gen/`. Anonymous volumes rather than tmpfs:
# node_modules is 356 MB and the Colima VM's RAM is not where it belongs.
writable_paths = [
    "frontend/node_modules",
    "frontend/dist",
    "crates/capsem-app/gen",
]
container_output_dir = "/package-output"
# The trailing `/.` copies the directory's *contents*; without it the package
# nests one level down from where `resolve()` looks.
container_output_contents = "/package-output/."
# Per-architecture, so alternating targets does not rebuild the world.
# No `target_volume`. The build directory is an anonymous volume, spelled by
# its container path in `cargo_target_mount` and allocated per container, so
# there is no name for two gates to share.

[package.builder]
dockerfile = "docker/Dockerfile.package-builder"
tag_template = "capsem-package-builder-{arch}:{digest}"
identity_inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    ".cargo/config.toml",
    "frontend/package.json",
    "frontend/pnpm-lock.yaml",
    "frontend/pnpm-workspace.yaml",
    "docker/Dockerfile.package-builder",
    "docker/swap-dev-libs.sh",
    "scripts/materialize-package-ort.py",
]
identity_globs = ["crates/*/Cargo.toml"]
# BuildKit and containers have different network vocabularies. `default` is
# the ordinary networked BuildKit boundary; `bridge` is a container mode and
# is deliberately rejected by the image adapter before Docker is invoked.
materialize_build_network = "default"
source_build_network = "none"
runtime_network = "none"
cargo_store = "/opt/capsem/package-cargo"
pnpm_store = "/opt/capsem/package-pnpm"
ort_lib_location = "/opt/capsem/onnxruntime"

# Installing the exact package into a clean systemd container and proving it
# works: every binary present and reporting the package's own version, the
# service and gateway up, every profile ready, and a real guest shell.

# Local signing material. Absent on a developer machine, which is why the rail
# treats it as optional -- the release lanes sign in CI from secrets. Declared
# here so "where is the key" has one answer rather than a path spelled inside
# a function.
[package.signing]
directory = "private/tauri"
key = "capsem.key"
password = "password.txt"
key_variable = "TAURI_SIGNING_PRIVATE_KEY"
password_variable = "TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
[package.proof]
container = "capsem-qualified-deb-proof"
systemd_ready_attempts = 60
verify_script = "scripts/verify-installed-release.py"
shell_proof_script = "scripts/prove-installed-shell.py"
shell_marker = "CAPSEM_QUALIFIED_DEB_SHELL_OK"
session_name = "qualification-exact-deb-shell"
shell_timeout_seconds = 300

# Every binary the package must install. Each reports the package version
# except capsem-app, which is the Tauri bundle and has no --version.
binaries = [
    "capsem",
    "capsem-admin",
    "capsem-app",
    "capsem-gateway",
    "capsem-mcp",
    "capsem-mcp-aggregator",
    "capsem-mcp-builtin",
    "capsem-process",
    "capsem-service",
    "capsem-tray",
    "capsem-tui",
    "capsem-mock-server",
    "capsem-bench-rs",
]
binaries_without_version = ["capsem-app"]

# `capsem status` lines that must be present. A package that installs and then
# cannot start its own service passes every file-existence check.
status_requires = [
    "Installed: true",
    "Running:   true",
    "Service:   ok",
    "Gateway:   ok",
]

# No shared package volumes. `capsem-cargo-registry`, `-cargo-git` and
# `-rustup` mounted over `/usr/local/cargo` and `/usr/local/rustup`, which is
# exactly where `Dockerfile.host-builder` installs the toolchain, the
# cross-targets, tauri-cli and cargo-auditable -- so the image carried all of
# it and the container saw the volume instead. Nothing is mounted over them
# now, so a container sees what the image actually carries.

# ---------------------------------------------------------------------------
# The VM asset build and boot gate
# ---------------------------------------------------------------------------

[assets]
test_root = "target/ironbank-assets"
profiles_glob = "config/profiles/*/profile.toml"

# A build that exits zero having produced none of these is the failure worth
# naming here rather than much later, inside a VM boot.
# Derived from `[artifacts]`: the three bootable files plus this build's own
# evidence. Spelling the three here as well is how two lists come to disagree.
evidence_artifacts = ["obom.cdx.json", "software-inventory.json"]
# The evidence member with a semantic contract beyond manifest identity.
obom_artifact = "obom.cdx.json"
failure_tail_lines = 200
# What the run watches for filesystem faults, and where it writes them the
# moment they happen. Source trees only: `target/` is where a gate is supposed
# to write, and watching it would drown the report -- except that build output
# is exactly where a hardlink to checked-in source lands, so the staged
# release channel is watched too.
shell_proof_timeout_seconds = 300

# `cargo run` rather than a built binary: the asset gate runs before anything
# has installed one, and the admin under test is this checkout's.
admin_command = ["cargo", "run", "-p", "capsem-admin", "--"]
capsem_binary = "target/debug/capsem"
hash_assets_script = "scripts/create_hash_assets.py"
shell_proof_script = "scripts/prove-installed-shell.py"
container_cleanup_script = "scripts/cleanup-docker-containers-by-mount.sh"

# Docker must be able to execute the *other* architecture before any lane
# starts, or the second lane fails an hour in with an exec format error. The
# image and platform come from the exact per-architecture base in `source_config`.
cross_platform_probe_command = "/bin/true"
# The probe runs `/bin/true` to ask whether the daemon can execute the other
# architecture. It needs nothing from the network, and every container has to
# say what it needs rather than omitting the decision.
cross_platform_probe_network = "none"
merged_assets_dir = "assets"
merged_config_dir = "config"
profile_home_dir = "home"
failure_evidence_dir = "run-failure"
# The subdirectory `capsem-admin profile materialize` writes into.
materialized_profiles_dir = "profiles"
# The alias the image builders repoint at whichever architecture they built last.
current_link = "current"

# Copied out of a failed run before its scratch is removed. Host-side
# diagnostics only: `guest/` and `auto_snapshots/` duplicate the guest's own
# workspace once per generation, and the same filter keeps the VM disk image
# and session.db out of target/.
evidence_suffixes = [".log", ".json", ".toml"]
evidence_prune_dirs = ["guest", "auto_snapshots"]
# AF_UNIX paths must stay under macOS SUN_LEN once the gateway appends its
# session path, and target/ironbank-assets is already too long.
run_dir_template = "/tmp/capsem-a.XXXXXX"

# ---------------------------------------------------------------------------
# The candidate gate
# ---------------------------------------------------------------------------

[candidate]
# macOS sleeps an unattended machine mid-gate, and a forty-minute run that dies
# at minute thirty proves nothing.
keep_awake_command = ["caffeinate", "-dimsu"]
keep_awake_marker = "CAPSEM_TEST_CAFFEINATED"

source_digest_script = "scripts/source-state-digest.py"
orphan_script = "scripts/check-orphan-processes.py"
# Where the recorded state waits between the step that measures it and the one
# that re-asserts it.
source_state_file = "target/gate-source-state.json"
# Source-derived Docker builds consume this immutable copy. Tests may mutate
# checkout metadata transiently; one recorded context prevents two phases from
# assigning different identities to the same eventual source state.
source_snapshot_dir = "target/gate-source-snapshot"

# The Colima binary, restored to whatever the developer had. This used to be a
# shell trap around the expensive half of the gate, so it was correct only for
# the commands that happened to sit inside the wrapper.
colima = "colima"

bootstrap_script = "bootstrap.sh"
clean_stale_script = "scripts/clean_stale.py"
generated_settings_script = "scripts/check-generated-settings.sh"
materialize_script = "scripts/materialize-config.sh"
recipe_suite = ["uv", "run", "python", "-m", "pytest", "tests/capsem-recipes/", "-v", "--tb=short", "-m", "recipe"]
# The rail and boundary the whole gate's disk budget is taken against.
candidate_budget = ["default", "candidate-boundary"]
# Where a failed gate's evidence is kept, and what to call a run whose
# source state was never recorded.
failure_rail = "default"
unknown_head = "unknown"

# ---------------------------------------------------------------------------
# Version stamping
# ---------------------------------------------------------------------------
# Files carrying a copy of the workspace version. Cargo.lock and uv.lock are
# absent on purpose: their copies are refreshed by the tools that own them.

[versions]
# The one authority: a human decision, recorded here and fanned out.
cargo_manifest = "Cargo.toml"
tag_prefix = "refs/tags/v"

[[versions.stamped]]
path = "crates/capsem-app/tauri.conf.json"
kind = "json_key"
key = "version"

[[versions.stamped]]
path = "pyproject.toml"
kind = "toml_key"
key = "version"

# ---------------------------------------------------------------------------
# Python source gates
# ---------------------------------------------------------------------------

[lint]
python_roots = ["src", "scripts", "tests", "guest"]
# Already passes every rule, and must keep doing so.
strict_roots = ["src"]
# Check the same cross-platform Python surface on Linux and macOS so the exact
# diagnostic ratchet cannot change merely because the gate moved hosts.
python_platform = "all"
# A ty warning exits zero, so without this a warning-level rule on the ratchet
# could never be detected as fixed. The option is policy; the flag that spells
# it is the adapter's business.
error_on_warning = true

# Rules held back outside strict_roots. Roughly four hundred diagnostics,
# dominated by inference over untyped fixture data: `json.load` returning
# `object` and then being subscripted, `helpers.*` imports that resolve only
# through conftest's sys.path wiring. Every rule NOT listed here is enforced on
# those trees today, which is four hundred more than when ty ran on
# src/capsem alone.
#
# A ratchet in two dimensions: no family may join and no count may grow.
# Reductions must lower the count immediately, so stale exemptions fail too.
[lint.ty_ratchet]
call-top-callable = 1
invalid-argument-type = 122
invalid-assignment = 15
invalid-attribute-override = 1
invalid-method-override = 2
invalid-return-type = 6
no-matching-overload = 9
not-iterable = 2
not-subscriptable = 172
possibly-missing-submodule = 2
unknown-argument = 4
unresolved-attribute = 91
unresolved-import = 26
unsupported-operator = 5
unused-ignore-comment = 4
unused-type-ignore-comment = 3

# Exact counts make every new inline or configured suppression a reviewed
# policy change. This is historical debt, not capacity: every value may shrink
# and no value may grow.
[lint.suppression_budget]
noqa = 67
type_ignore = 22
ty_ignore = 6
ruff_global_ignore = 1
ruff_per_file_ignore = 2
justification = "Existing repository-wide debt baseline; additions are forbidden and removals must ratchet these counts down."

# ---------------------------------------------------------------------------
# The justfile/package boundary
# ---------------------------------------------------------------------------

[boundary]
# A recipe body over this many executable lines is inline logic, and a gate
# module over its ceiling is the 2000-line justfile growing back in Python.
max_recipe_lines = 5
max_module_lines = 300

# Steps that drive cargo without claiming `workspace_binaries`.
#
# Empty, and it should stay that way. The one entry it ever held was
# `fast.clippy`, on the theory that a step-level exclusive is coarser than the
# lock cargo takes on its own target directory, and would park the fast lane's
# longest job behind two short ones.
#
# Measured back to back, same machine, same warm cache: 3m47s without the
# claim, 3m49s with it. Two seconds, against run-to-run variance of minutes.
#
# The theory was wrong in an instructive way. Cargo was already serialising
# those steps. Clippy's 2m20s of "execution" without the claim was 1m27s of
# work plus about fifty seconds blocked on that lock, charged to execution
# because nothing had declared it. Declaring the claim does not add the wait --
# it moves it out of a number nobody can attribute and into the queueing
# report, where `runs schedule` names it.
#
# So an entry here needs a measurement, not an argument. The argument that
# sounded right cost four minutes to check and was wrong.
unclaimed_cargo = []
# Script scope and its exact historical-debt ratchet are declared below the
# rest of this table, immediately before the execution section.

# Shell control flow in a body with no shebang is still a program no test can
# reach: `just` hands each line to a shell, so a `for` loop spread across
# continuations runs untested.
shell_control_flow = ["if ", "for ", "while ", "case ", "until ", "trap "]
# Empty, and it stays empty: a recipe is a dispatch or a single command.
recipes_with_inline_control_flow = []

# The only modules allowed to touch the machine directly. Each owns one piece
# of machine state as its entire purpose, so there is no gate work here for a
# dry run to show and routing it through an action would be ceremony.
#
#   actions      the process primitives, including a detached launch that
#                has to record the pid `pidfiles` will later stop
#   fileactions  the filesystem primitives themselves
#   proc         the single funnel every invocation passes through, and so the
#                one place the run log has to hook
#   pidfiles     where a signal is sent, so "which process did the gate kill"
#                has a single answer
#   locks        the lockfile that makes one gate per machine true, which has
#                to be placed before any workspace exists to put it in
#   filesystem   the operations `fileactions` wraps, for the phases that are
#                already inside a step and cannot render their argv
#   runlog       the run directory itself, which cannot be written through
#                actions because actions report into it
#   summary      the human-readable half of that same directory, for the same
#                reason: it is written after the run whose actions it describes
#   runhistory   reclaiming those directories, for the same reason
#   disk         reclaiming every other tree the gate creates, with the
#                resolved-path and symlink guards that makes safe
#   workspace    the isolated CAPSEM_HOME, wiped on the way in and cleared on
#                the way out -- it is the tree the actions run against
#
# The through-line: these are the harness, and the harness is what gate work is
# expressed *in*. Anything built on top of it -- a capability, a command -- goes
# through actions, or its work is invisible to the dry run and the log.
#
# Widening this is a design decision, not a convenience.
direct_machine_access = [
    "actions.py",
    "fileactions.py",
    "filesystem.py",
    "proc.py",
    # The process half of proc's one execution funnel, split at the module
    # ceiling. It owns exact foreground process trees across sandbox sessions.
    "processgroup.py",
    "pidfiles.py",
    "locks.py",
    "runlog.py",
    "summary.py",
    "runhistory.py",
    "disk.py",
    "workspace.py",
    # Observation has to touch the machine: it exists to report what the
    # machine did. `faults.py` stats and hashes what changed; `faultlog.py`
    # writes and fsyncs the report so a killed run still leaves one.
    "faults.py",
    "faultlog.py",
    # And `interception.py` *is* the primitives, proxied -- the whole point is
    # that nothing reaches `os` without passing through it.
    "interception.py",
    "observation.py",
    # `prefix.py` builds the tree the run happens *in*, which is necessarily
    # before there is a run to record it against: it is consulted by
    # `reexec()`, above every resource and outside the machine lock, so there
    # is no journal to write an action into and no dry run that could show one.
    # Composing it from actions would mean a plan whose first step creates the
    # directory the plan is already executing from.
    "prefix.py",
    # Same reason: `snapshot` is the copying half, split out at the ceiling.
    "snapshot.py",
    # And `buildcache` is the third: it lends the machine's build output to
    # whichever prefix is about to run and takes it back on the way out, both
    # of which happen where `prefix` happens -- before the journal exists and
    # outside the machine lock. A plan step that moved the directory the plan
    # is already executing from is not a step anything could order.
    "buildcache.py",
    # And the shared build directory those two work against, split out of
    # `prefix` at the module ceiling. Same pre-run position: it links the
    # profile directories the child compiles into and bounds their size, both
    # from `reexec()` -- before the journal, outside the machine lock. An
    # action expressing it would have to be a plan step that creates the
    # directory the plan is already compiling into.
    "cargotarget.py",
    # Immutable release source selection is the other pre-run half of prefix:
    # its Git validation, detached clone, and exact-prefix lease must exist
    # before the process and journal in that source can start.
    "sourcecommit.py",
    "commitsnapshot.py",
    "prefixlease.py",
    "sandbox.py",
    # `sandboxreport.py` holds a `log stream` open for the entire run, which is
    # the one thing an action cannot express: actions are commands that finish
    # and are recorded once, and this is a process that must outlive the call
    # starting it and be terminated on the way out. A `Resource` is exactly
    # that lifetime, and it needs `Popen` rather than the runner's exec
    # accounting to get it.
    "sandboxreport.py",
    # Release qualification is sandboxed, but immutable-input resolution and
    # publication cannot be. `egress` creates and owns the one-time capability
    # before the sandbox exists; `egressbroker` is its deliberately planless
    # process half. Commands still pass through a GuardedRunner in the owning
    # plan, so their argv, timing and output remain in the same journal.
    "egress.py",
    "egressbroker.py",
    # `auditfs.py` is the audited place a file may be hardlinked into
    # published output from. It has to touch the machine: deciding between a
    # link and a copy *is* a filesystem question, and routing it through an
    # action would put the decision behind the layer that exists to record it.
    "auditfs.py",
]

# Only the plan schedules concurrent work. A module that reaches for its own
# thread pool has parallelism the graph cannot see -- and therefore parallelism
# the exclusives cannot constrain, which is exactly what seven bare `&` in one
# recipe body were.
direct_concurrency = ["planrunner.py"]

# A script added today must stay at or below this ceiling. Historical larger
# scripts are exact line-count ratchets below: they may not grow, and any
# shrink must update or remove its entry immediately. This is debt inventory,
# not an exemption list.
[boundary.scripts]
roots = ["scripts"]
suffixes = [".py", ".sh"]
max_lines = 300

# Only Git-tracked files in the first-party roots above are considered. That
# excludes build-generated output and vendored dependency trees by rule while
# still catching suffix-less package scripts through their shebang.
# Rust, at a ceiling read from its own distribution rather than borrowed from
# Python. Rust's median tracked file is 232 lines and p90 is 1265; a 300-line
# ceiling would flag 169 of 388 files, which is a rewrite mandate rather than
# an outlier detector and would be deleted the first time it blocked someone.
# 1000 sits just under p90 and flags 58 -- the genuine outliers.
#
# Rolled out by scope, one crate at a time, because the ceiling applies to
# everything in `roots` and listing only some files would fail the rest.
# capsem-service first: two entries freeze the two largest files in the
# repository, in the crate CLAUDE.md calls a thin shell.
[boundary.rust]
roots = ["crates/capsem-service"]
suffixes = [".rs"]
max_lines = 1000

[boundary.rust.oversized_line_counts]
"crates/capsem-service/src/main.rs" = 13802
"crates/capsem-service/src/tests.rs" = 11953

[boundary.scripts.oversized_line_counts]
"scripts/bootstrap-linux.sh" = 599
"scripts/build-pkg.sh" = 352
"scripts/check-hardcoded-release-selections.py" = 301
"scripts/check-public-binary-release.py" = 934
"scripts/check-remote-release-readiness.py" = 1973
"scripts/check_session.py" = 381
"scripts/clean_stale.py" = 769
"scripts/docker-storage-policy.py" = 1539
"scripts/doctor-common.sh" = 446
"scripts/doctor_session_test.py" = 570
"scripts/fetch-release-artifacts.py" = 353
"scripts/integration_test.py" = 1191
"scripts/local-release-glowup.py" = 2092
"scripts/macos_release_glowup.py" = 399
"scripts/macos_tart_glowup.py" = 622
"scripts/macos_tart_guest.sh" = 341
"scripts/preflight.sh" = 338
"scripts/protocol_fixture_recorder.py" = 500
"scripts/prove-installed-shell.py" = 318
"scripts/release-binaries.py" = 435
"scripts/release_collect_evidence.py" = 462
"scripts/release_glowup.py" = 807
"scripts/release_inputs.py" = 337
"scripts/resolve-reusable-profile-assets.py" = 334
"scripts/stage-release-test-inputs.py" = 459

# ---------------------------------------------------------------------------
# What may not run beside what
# ---------------------------------------------------------------------------

# Each entry names one thing only one step may hold at a time, and why. The
# reason is the point. Written as `&` and `wait`, this knowledge lived in shell
# comments -- seven backgrounded jobs in `_test-candidate-run` and three more in
# `smoke`, with nothing to stop an eighth from violating a constraint recorded
# three hundred lines away.
#
# A step names what it contends for; the plan gives each name a lock. Two
# claimants of one entry can never overlap, and claimants of different entries
# still do.

[execution]
# How many steps may be in flight at once. A bound rather than "as many as the
# plan has": claims are reserved before submission now, so a worker is never
# occupied purely by waiting, and eighty-one threads bought nothing. Chosen
# from measurement rather than from cores -- a gate step is rarely one process,
# and eight steps each starting four pytest workers is not eight-way anything.
max_parallel_steps = 8
# Foreground actions own a dedicated process group. Cancellation checks this
# often, then gives the exact group this long to stop before SIGKILL. Both are
# operational policy rather than subprocess call-site folklore.
cancellation_poll_seconds = 0.1
# Where a leaked process is reported rather than refused. It is a real defect
# either way and is reaped either way -- but the machine it protects is this
# one, and a hosted runner is deleted minutes after the run. Enforced by
# absence, so a developer machine keeps the guard without opting in.
survivors_unenforced_when_set = "CI"
cancellation_grace_seconds = 10.0

[execution.exclusives.apple_vz]
reason = "two benchmark files launching VMs at once measure each other, not Capsem"

[execution.exclusives.host_service]
reason = "production has one service and one service-scoped snapshot lock; an xdist worker per service does not reproduce that"

[execution.exclusives.workspace_binaries]
reason = "cargo build --workspace atomically replaces the binaries a running VM test is using, and two cargo invocations block on the target directory's own lock -- a wait that lands in execution time and never reaches the queueing report"

[execution.exclusives.docker_daemon]
reason = "the storage rails reserve and release a single daemon's disk budget"

[execution.exclusives.astro_build]
reason = "Astro stages prerendering in a path derived from the project root, not from the invocation, so two overlapping builds delete each other's staging -- and neither --outDir nor --cacheDir moves it"

[execution.exclusives.node_modules]
reason = "pnpm install rewrites a workspace's node_modules in place, and every web build reads it"

# ---------------------------------------------------------------------------
# One gate per machine
# ---------------------------------------------------------------------------

[locks.gate]
# User-scoped, never checkout-scoped: linked worktrees, detached qualification
# prefixes, and independent clones all mutate the same service home, Docker
# daemon, ports, and signing state. A target-relative path gives each tree a
# different inode and lets those gates destroy one another.
path = "~/.capsem-gate/capsem-test-execution.lock"
# flock, not a pidfile: the kernel releases it when the holder dies, so there is
# no stale-lock heuristic to get wrong. The holder writes who it is here so
# contention can name it.
holder_record = "~/.capsem-gate/capsem-test-execution.holder"
# Report the holder rather than blocking mutely. Someone who left `just test`
# running in another terminal deserves to be told that, not to watch a cursor.
report_after_seconds = 2
wait_timeout_seconds = 7200
poll_interval_seconds = 0.25
# Exported for the length of a run, so a descendant can tell it is one. flock
# alone cannot say this: a lock the parent holds looks exactly like a lock a
# stranger holds, and the child dutifully waits out the two hours.
run_marker = "CAPSEM_GATE_RUN"

# ---------------------------------------------------------------------------
# The tools a gate needs before it can start
# ---------------------------------------------------------------------------

[toolchain]
# Every entry is idempotent: present means nothing happens. Written as eight
# near-identical `if ! ... ; then ... fi` blocks in shell, where the only thing
# that varied was the probe and the install.
sync = ["uv", "sync", "--frozen"]
node_workspaces = ["frontend", "docs", "site", "release-site"]
# CI=true suppresses pnpm's interactive "remove and reinstall node_modules?"
# prompt, which hangs an unattended gate when the store layout drifts from the
# lockfile.
node_install = ["pnpm", "install", "--frozen-lockfile"]
node_env = { CI = "true" }

# Every non-native Rust target the gate compiles. The GNU pair exercises both
# KVM architecture branches under Clippy; the musl pair builds guest binaries.
rust_targets = [
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# rust-lld comes from here.
rust_components = ["llvm-tools"]

# ort-sys has a networked build script even after Cargo has fetched every
# locked crate. Resolve its static library once through the named egress edge,
# then point Clippy, coverage and the package helper at the same verified
# bytes. Host selection is data: Linux and Apple Silicon use different
# archives, while both Linux package targets share this authority.
[toolchain.ort]
script = "scripts/materialize-package-ort.py"
archive_cache_template = "~/.cache/capsem/ort/archive-{sha256}.tar.lzma2"
output_template = "target/toolchain/ort/{consumer}-{target}-{sha256}"
strategy_variable = "ORT_STRATEGY"
location_variable = "ORT_LIB_LOCATION"
strategy = "system"

[toolchain.ort.host_targets]
Linux = { arm64 = "aarch64-unknown-linux-gnu", x86_64 = "x86_64-unknown-linux-gnu" }
Darwin = { arm64 = "aarch64-apple-darwin" }

[toolchain.ort.distributions.aarch64-unknown-linux-gnu]
url = "https://cdn.pyke.io/0/pyke:ort-rs/ms@1.23.2/aarch64-unknown-linux-gnu.tar.lzma2"
sha256 = "c25248c32d84f228b9d584b84b31e1577e4810d46beb5e304e9fa340c000176c"

[toolchain.ort.distributions.x86_64-unknown-linux-gnu]
url = "https://cdn.pyke.io/0/pyke:ort-rs/ms@1.23.2/x86_64-unknown-linux-gnu.tar.lzma2"
sha256 = "8c57d059aaaee407812a5698d6706c79e090ad69e1a14204309e802dcbbaa35f"

[toolchain.ort.distributions.aarch64-apple-darwin]
url = "https://cdn.pyke.io/0/pyke:ort-rs/ms@1.23.2/aarch64-apple-darwin.tar.lzma2"
sha256 = "0897a0e1b840566a97e5a49497b02cbc204be2d006815174b639bc99731840f9"

# One native Linux dependency authority. Bootstrap, both hosted Linux gates,
# and the Docker host builder consume these exact values; none keeps a private
# package list. The probes make a removed/transitively-missing dev package fail
# before Clippy spends a minute discovering the first missing .pc file.
[toolchain.linux]
apt_packages = [
    "build-essential",
    "bubblewrap",
    "file",
    "libayatana-appindicator3-dev",
    "librsvg2-dev",
    "libssl-dev",
    "libwebkit2gtk-4.1-dev",
    "libxdo-dev",
    "libgtk-3-dev",
    "musl-tools",
    "pkg-config",
    "python3",
    "xdg-utils",
]
# Header packages that can be architecture-swapped inside the package helper.
# `librsvg2-dev` is deliberately absent: its target-architecture introspection
# dependency is executable and cannot run on the native builder.
cross_dev_packages = [
    "libayatana-appindicator3-dev",
    "libgtk-3-dev",
    "libssl-dev",
    "libwebkit2gtk-4.1-dev",
    "libxdo-dev",
]
# Host-architecture tools which foreign development packages also accept as
# `:any`. APT otherwise prefers the foreign interpreter while resolving the
# cross graph and attempts to remove the Python/uv toolchain that drives the
# package build.
cross_host_packages = ["python3"]
dnf_packages = [
    "bubblewrap",
    "file",
    "gcc",
    "gcc-c++",
    "gtk3-devel",
    "libappindicator-gtk3-devel",
    "librsvg2-devel",
    "libxdo-devel",
    "make",
    "musl-gcc",
    "openssl-devel",
    "pkgconf-pkg-config",
    "webkit2gtk4.1-devel",
    "xdg-utils",
]
pkg_config_modules = [
    "glib-2.0",
    "gtk+-3.0",
    "webkit2gtk-4.1",
    "ayatana-appindicator3-0.1",
    "openssl",
    "librsvg-2.0",
]
required_commands = ["bwrap", "file", "musl-gcc", "pkg-config"]

# Which crates a job needs, named by what the job does rather than by the tools
# it happens to want. Workflows select a set; this file owns the membership and
# the versions, so neither can be restated in YAML and drift.
#
# `b3sum` was in the fast gate's hand-written list and not the binary pairing
# gate's, though both run the broad suite and its asset-integrity tests shell
# out to `b3sum`. Three tests failed on a missing tool ten minutes into a
# release job where every binary had already built and installed. Nobody chose
# that subset; it was simply never compared with any other.
[toolchain.sets]
# Everything, for the lane that runs everything.
complete = ["cargo-audit", "cargo-nextest", "cargo-llvm-cov", "b3sum", "cargo-sbom", "cargo-tauri"]
# The VM-owned suites: nextest runs the Rust half, b3sum checks that a manifest
# digest matches the bytes it names.
functional = ["cargo-nextest", "b3sum"]
coverage = ["cargo-nextest", "cargo-llvm-cov"]
advisory = ["cargo-audit"]
digest = ["b3sum"]

# `probe` is what proves it is already present; `install` is what puts it
# there. A table rather than eight code blocks, so adding one is a line.
[[toolchain.crates]]
name = "cargo-nextest"
probe = ["cargo-nextest", "--version"]
expected = "cargo-nextest 0.9.137"
install = ["cargo", "install", "cargo-nextest", "--version", "0.9.137", "--locked"]

[[toolchain.crates]]
name = "cargo-llvm-cov"
probe = ["cargo-llvm-cov", "llvm-cov", "--version"]
expected = "cargo-llvm-cov 0.8.5"
install = ["cargo", "install", "cargo-llvm-cov", "--version", "0.8.5", "--locked"]

[[toolchain.crates]]
name = "b3sum"
probe = ["b3sum", "--version"]
expected = "b3sum 1.8.5"
install = ["cargo", "install", "b3sum", "--version", "1.8.5", "--locked"]

[[toolchain.crates]]
name = "cargo-audit"
probe = ["cargo-audit", "--version"]
expected = "cargo-audit 0.22.1"
install = ["cargo", "install", "cargo-audit", "--version", "0.22.1", "--locked"]

[[toolchain.crates]]
name = "cargo-sbom"
probe = ["cargo-sbom", "--version"]
expected = "cargo-sbom 0.10.0"
install = ["cargo", "install", "cargo-sbom", "--version", "0.10.0", "--locked"]

[[toolchain.crates]]
name = "cargo-tauri"
probe = ["cargo-tauri", "--version"]
expected = "tauri-cli 2.11.1"
install = ["cargo", "install", "tauri-cli", "--version", "2.11.1", "--locked"]

[release]
# The selected commit is prepared and committed before release. Qualification
# may create immutable Git refs afterward; it may never edit tracked source.
line = "0.6"
# Channels that may only be released from a commit an operator qualified with
# `just test`. Nightly is deliberately absent: spec 13.2 rebuilds current main
# every day with no human involved, and the dispatched lanes prove themselves
# through qualify-assets and qualify-binaries. Requiring a machine-local
# journal there made the scheduled rebuild impossible to satisfy.
locally_qualified_channels = ["stable"]
# A release publishes a commit, not the working tree, so uncommitted edits are
# silently excluded. Refuse before anything is accepted or published.
clean_worktree = "scripts/require-clean-worktree.py"
source = "scripts/publish-release-source.py"
source_ref_template = "capsem-source-{source_commit}"
tagger_name = "Capsem Release Gate"
tagger_email = "release@capsem.org"
notes = ["scripts/release-binaries.py", "--precheck"]
fetch_manifest = "scripts/fetch-channel-source-manifest.py"
binaries = "scripts/release-binaries.py"
profile = ["cargo", "run", "-p", "capsem-admin", "--", "release"]
preflight_dir = "target/release-preflight"
channel_source = "target/release-preflight/channel-source.json"
default_repository = "google/capsem"
repository_variable = "GITHUB_REPOSITORY"
token_variable = "GITHUB_TOKEN"

# The pre-0.6 stable graph points at a deleted GitHub release. This exact
# catalog-authorized payload alone may be projected as empty during the 0.6
# profile-first replacement; a changed graph remains ordinary public state.
[[release.retired_public_graphs]]
channel = "stable"
sha256 = "e8ddf88034a3e73beb605811d5efe5e03c04e79d1ba4b656ff6ca837ef54640e"

[devloop]
setup_sentinel = ".dev-setup"
dev_lock = "run/execution.lock"
tauri = ["cargo", "tauri", "dev", "--config", "crates/capsem-app/tauri.conf.json"]
frontend_dev = ["pnpm", "run", "dev"]
frontend_dir = "frontend"
tui = ["cargo", "run", "-p", "capsem-tui"]
surfaces = ["ui", "frontend", "tui"]
generate_settings = "scripts/generate-settings.sh"
# Where this step's *tracked* outputs go: build output, not the checkout. The
# step exists to make the gitignored frontend mock, which the web surfaces
# import; rewriting `config/settings/*.generated.json` on the way was a side
# effect, and one the gate cannot have once it may not write its own source.
# `contracts.release` still compares the committed pair against a fresh
# generation, so drift is caught -- by the step whose job that is.
generated_settings_scratch = "target/generated-settings"
check_settings = "scripts/check-generated-settings.sh"
materialize_config = "scripts/materialize-config.sh"

[initrd]
# The guest binaries the initrd carries, all cross-compiled to musl.
binaries = [
    "capsem-pty-agent", "capsem-net-proxy", "capsem-dns-proxy",
    "capsem-mcp-server", "capsem-sysutil", "capsem-bench-rs",
]
staging = "target/linux-agent"
# Rebuilt when a staged binary is missing, or older than anything the build
# reads. Cheaper than an unconditional cross-compile -- but only correct if
# "anything the build reads" is honest, and `*.rs` under these crates is not:
# a dependency bump, a feature change or a toolchain bump leaves every source
# file older than the staged binary while the binary is stale. A stale guest
# binary ships into an initrd that does not match the source it claims.
sources = ["crates/capsem-agent", "crates/capsem-proto", "crates/capsem-bench"]
# Files under the crate roots whose change invalidates a staged binary, and
# the workspace-wide ones. Split because the first are globbed per crate and
# the second are single paths.
freshness_globs = ["*.rs", "Cargo.toml", "build.rs"]
freshness_inputs = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "config/gate.toml",
    "src/capsem/builder/config.py",
    "src/capsem/builder/models.py",
    "src/capsem/builder/cli.py",
    "src/capsem/builder/docker.py",
    "src/capsem/builder/guestbuilder.py",
    "config/docker/image/build.toml",
    "docker/Dockerfile.guest-rust-builder",
]
build = ["uv", "run", "capsem-builder", "agent", "config/docker/image"]

# Checked-in guest payloads copied in beside the binaries.
init = "guest/artifacts/capsem-init"
files = ["guest/artifacts/capsem-doctor", "guest/artifacts/capsem-bench", "guest/artifacts/snapshots"]
trees = ["guest/artifacts/capsem_bench", "guest/artifacts/diagnostics"]
prune = "__pycache__"

# 555 on every guest binary: the rootfs is mounted read-only and the guest may
# not modify its own binaries. The builder applies this after a fresh
# cross-compile; reasserted here because a cached staging directory may have
# had its modes changed between builds.
binary_mode = 0o555
init_mode = 0o755

manifest = ["cargo", "run", "-p", "capsem-admin", "--", "manifest", "generate"]
hash_assets = "scripts/create_hash_assets.py"

[smoke]
# Focused developer feedback, never release qualification. Three groups that
# can share the machine, then the two that cannot.
doctor = ["target/debug/capsem", "doctor"]
run_id_variable = "CAPSEM_TEST_RUN_ID"
log = "target/smoke.log"

# Suspend/resume is host-resource sensitive under Apple VZ: an unrelated VM can
# make a resume fail before the guest signals ready. These run after the
# parallel phase, for the same reason the full gate serializes them.
[[smoke.groups]]
name = "mcp"
paths = ["tests/capsem-mcp/"]
markers = "mcp"
parallel = 0

[[smoke.groups]]
name = "service-cli"
paths = ["tests/capsem-service/", "tests/capsem-cli/"]
markers = "integration"
# The longest group, and the big lever: -n 2 with --dist=loadfile takes it from
# about 67s to about 36s, and loadfile keeps a file's tests on one worker so
# module-scoped fixtures are not rebuilt.
parallel = 2

[[smoke.groups]]
name = "gateway"
paths = ["tests/capsem-gateway/"]
markers = "gateway"
parallel = 0

[[smoke.serial_groups]]
name = "mcp-serial"
paths = ["tests/capsem-mcp/test_state_transitions.py"]
markers = "mcp"

[[smoke.serial_groups]]
name = "service-serial"
paths = [
    "tests/capsem-service/test_svc_resume_paths.py",
    "tests/capsem-service/test_svc_suspend_corruption.py",
    "tests/capsem-service/test_svc_loop_device_after_resume.py",
]
markers = "integration"

[service]
# The development daemon: the same profile/assets rail an installed package
# uses, so the dev service cannot mix stale profile pins with fresh assets and
# make profiles look broken in the UI.
binary = "target/debug/capsem-service"
process_binary = "target/debug/capsem-process"
sync_assets_script = "scripts/sync-dev-assets.sh"
generated_profiles = "target/config/profiles"
assets_dir = "assets"
home_assets = "assets"
home_profiles = "profiles"
socket = "service.sock"
pidfile = "service.pid"
# Config files an older layout wrote into the home. Removed on every start so a
# checkout that predates the change cannot keep booting from them.
retired_config = ["user.toml", "service.toml"]
ready_attempts = 30
ready_interval_seconds = 0.5
log_level = "capsem=debug"

[hostimage]
# The Linux parity lane's dependencies, resolved once with network and then
# never again. These four named volumes used to hold them and persisted
# between runs, which is what made a warm machine and a clean checkout
# disagree about the same commit.
base_dockerfile = "docker/Dockerfile.linux-rust-base"
lane_dockerfile = "docker/Dockerfile.linux-rust"
base_tag_template = "capsem-linux-rust-base:{digest}"
lane_tag = "capsem-linux-rust:latest"
# The files that decide what the base image contains, and therefore its
# identity. `base_dockerfile` is hashed alongside these without being listed
# again -- it carries the ONNX Runtime version, the build arguments' defaults
# and every `RUN` -- and so is the current image id of `tag`, because `:latest`
# is a pointer and a rebuilt parent is a different image under the same name.
#
# Not the workspace manifests: `cargo fetch --locked` fetches everything the
# lock resolves regardless of features, so a manifest edit that leaves
# `Cargo.lock` alone leaves the sealed lane with every source it needs.
identity_inputs = ["Cargo.lock", "rust-toolchain.toml", "frontend/pnpm-lock.yaml"]
# Named here so the lane's refusal and the recipe that answers it cannot drift
# apart. `test_every_recipe_the_gate_tells_an_operator_to_run_exists` checks
# this resolves to a real recipe -- the last time a message named one that did
# not exist, it stopped a release and handed back a command that fails.
warm_recipe = "_warm-linux-rust-base"
# Denied, which is what proves the base image is complete rather than believed
# to be complete.
network = "none"
# The source lane itself consumes only the materialized base image.
source_build_network = "none"
# Copied out with `docker cp`, because `--rm` and `docker cp` are mutually
# exclusive and a writable bind mount is the thing being removed.
container_output_dir = "/linux-rust-output"
# The `docker cp` source. The trailing `/.` copies the directory's *contents*;
# without it the coverage nests at `<dest>/linux-rust-output/` where nothing
# looks for it.
container_output_contents = "/linux-rust-output/."
extract_to = "target/linux-rust-coverage"
lane_container = "capsem-linux-rust-run"
# The Linux builder image, and the Linux-Rust parity lane that runs inside it.
tag = "capsem-host-builder:latest"
dockerfile = "docker/Dockerfile.host-builder"
context = "docker/"
builder_identity_inputs = [
    "docker/Dockerfile.host-builder",
    "docker/sources-multiarch.sh",
    "docker/swap-dev-libs.sh",
    "rust-toolchain.toml",
]
materialize_network = "default"
pnpm_version = "10.34.5"
rust_image = "rust:1.97.1-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97"
uv_image = "ghcr.io/astral-sh/uv:0.12.3@sha256:2d890623d310b57771ce840f0da5eed5fc6d657da05ffaa45d82797b53fa3abc"
cargo_tool_args = { TAURI_CLI_VERSION = "cargo-tauri", CARGO_NEXTEST_VERSION = "cargo-nextest", CARGO_LLVM_COV_VERSION = "cargo-llvm-cov" }
script = "scripts/test-linux-rust.sh"
mount = "/src"
# `probe_user` and `probe_network` are gone with the probe they configured.
# It reproduced Linux CI's "dubious ownership" case -- a checkout owned by
# someone other than the image's user, git refusing /src, and build.rs
# embedding "unknown" instead of failing. Both halves of that are now
# impossible: no lane mounts the checkout, and the revision is passed in as
# `CAPSEM_BUILD_REVISION` rather than discovered, so there is no ownership
# question to get wrong and no path to an "unknown" hash.
# `alpine`, `tmpfs`, `container_home`, `nextest_dir`, `nextest_mount`,
# `output_dir`, `container_output`, `writable_source_mounts` and
# `cached_volumes` are gone with the bind mount that needed them. A writable
# /tmp, a hand-placed HOME, a bound-out nextest directory, a writable graft for
# Tauri's generated ACLs and four cross-run volumes were all repairs for
# sharing the developer's checkout and cache with a root-owned container. The
# lane copies its source into an image and its dependencies live in the base,
# so there is nothing to repair.

[sbom]
script = "scripts/generate-host-binary-sbom.py"
output = "target/ironbank-host-sbom.spdx.json"
dist_glob = "dist/*{version}*.deb"
macos_package = "packages/Capsem-{version}.pkg"
# Two, one per architecture. Fewer means a build did not happen; more means an
# older version's packages are still in dist/ and the SBOM would describe a
# cohort nobody is shipping.
expected_debs = 2
spdx_version = "SPDX-2.3"

[signing]
entitlements = "entitlements.plist"
binaries = [
    "target/debug/capsem", "target/debug/capsem-service", "target/debug/capsem-process",
    "target/debug/capsem-gateway", "target/debug/capsem-mcp", "target/debug/capsem-admin",
]
# Every host binary a run needs on disk, as bin names. A superset of the signed
# list, validated to be one: `binaries` is the subset that calls
# Virtualization.framework and therefore needs the entitlement, while the rest
# only have to exist -- `capsem-process` spawns the MCP pair at boot, and the
# build-chain suite executes the tray and the TUI.
#
# It exists because nothing built any of them. Signing was `codesign --force`
# against whatever an earlier `just build` had left, and a run that did not
# inherit a warm tree failed three times in a row, one binary at a time:
# `codesign: target/debug/capsem: No such file or directory`, then `required
# MCP aggregator binary capsem-mcp-aggregator is missing`, then `Binary not
# found: target/debug/capsem-tray`.
#
# So it is the whole host cohort now, and
# `test_the_built_binaries_are_every_host_binary` holds it against `cargo
# metadata` -- a new crate with a binary joins this list or fails that test,
# rather than being discovered by a gate twenty minutes in.
#
# Two exclusions, both with an owner elsewhere. `capsem-app` embeds
# `frontend/dist` at compile time and belongs to `build-ui`, which builds the
# bundle first; `capsem-agent`'s five bins are musl guest binaries that
# `initrd.guest-agents` cross-compiles.
built = [
    "capsem", "capsem-admin", "capsem-bench-rs", "capsem-gateway", "capsem-mcp",
    "capsem-mcp-aggregator", "capsem-mcp-builtin", "capsem-mock-server", "capsem-process",
    "capsem-service", "capsem-tray", "capsem-tui", "mcp_export",
]
# Host binaries this list deliberately omits, each built by a step that owns
# its prerequisites. Named so the guard can tell an exclusion from an omission.
built_elsewhere = ["capsem-app"]
guest_crate = "capsem-agent"

release_binary = "target/debug/capsem"

[frontend]
build_script = "scripts/check-web-surface.sh"
build_target = "frontend-build"
# capsem-app embeds frontend/dist at compile time, so the bundle has to exist
# before cargo reads it.
app_crate = "capsem-app"
profiles = ["debug", "release"]

[logs]
service_log = ".capsem/run/service.log"
failure_root = "target/test-artifacts"
cli = "target/debug/capsem"

[imagebuild]
# One `capsem-admin image build` invocation, with the template as the only
# thing that varies. Four recipes spelled it out, and the shape of the argv was
# the same in all four.
admin = ["cargo", "run", "-p", "capsem-admin", "--", "image", "build"]
workspace_admin = ["cargo", "run", "-p", "capsem-admin", "--", "image", "workspace"]
dependency_backend = ["uv", "run", "python", "-m", "capsem.builder.image_build_backend"]
# The profile materializer copies this directory byte-for-byte. It is also the
# one authority the gate uses to prefetch exact per-platform base manifests.
source_config = "config/docker/image"
guest_dir = "guest"
workspace_root = "target/image-workspace/{profile}/{arch}"
workspace_guest_dir = "guest"
# The stages a concurrent asset lane builds, in order. Named here because the
# lanes build kernel and rootfs separately while a single-shot build uses
# "all", and a second copy of that list in code is a second opinion.
lane_templates = ["kernel", "rootfs"]
templates = ["kernel", "rootfs", "all"]
profiles_glob = "config/profiles/*/profile.toml"
profile_manifest = "config/profiles/{profile}/profile.toml"
config_root = "config"
output = "assets"
# Doctor is run first, with the checks that would fail on the very thing this
# is about to build turned off.
doctor_skips = { CAPSEM_SKIP_ASSET_CHECK = "1", CAPSEM_SKIP_KVM_CHECK = "1" }
# What a per-architecture asset tree must contain to count as built comes from
# `[artifacts]`; it was spelled here and in `[assets]`, and `initrd.py` spelled
# one of them a third time.

# ---------------------------------------------------------------------------
# The cheap checks, and what they may overlap with
# ---------------------------------------------------------------------------

[audits]
# Independent by construction: none reads what another writes, so the graph
# runs them at once and reports every failure rather than the first. As shell
# these were seven `&` and seven `wait` aggregating into a single FAIL bit,
# which told you something broke but not what.
cargo = "scripts/check-cargo-audit.py"
# Reports, never refuses. A supply-chain signal that fails a build is one people
# learn to route around, and the containment is elsewhere: every compiling step
# runs in a loopback-only namespace, so a build script cannot reach a C2 host.
# This says which package changed shape, before anything is built.
dependency_drift = "scripts/check-dependency-drift.py"
pnpm = "scripts/audit-pnpm-bulk.py"
python_lock = "scripts/audit-python-lock.sh"
public_surface = "scripts/check_public_surface.py"
source_syntax = "scripts/check-source-syntax.py"
hardcoded_selections = "scripts/check-hardcoded-release-selections.sh"
surfaces = "scripts/check-surfaces.py"
# hadolint codes held back, each for its reason:
#   DL3008/DL3018  pinning every apt/apk version in a base image is a
#                  maintenance treadmill the pinned base digest already covers
#   DL4006         pipefail before a piped RUN; worth doing, not worth blocking
#   DL3003         `cd` inside RUN rather than WORKDIR, used deliberately
#   DL3059/DL3066/DL3002  layer consolidation and non-numeric UID in the
#                  install-test image, which exists to reproduce a real user
docker_ignore = ["DL3008", "DL3018", "DL4006", "DL3003", "DL3059", "DL3066", "DL3002"]
# All three surfaces that carry shell -- tracked `*.sh`, every workflow `run:`
# body, and every Dockerfile `RUN` body including the rendered `.j2` templates.
# A linter on one of three is a sampling, and the two that were unlinted are
# where the release logic lives. Fail closed: a surface yielding no sources is
# an error, never a pass.
#
# Warning and above. `info`/`style` add findings that are opinions rather than
# defects, and a gate nobody believes gets disabled.
shell_severity = "warning"
#   SC1091  cannot follow a sourced path it was not given as input; the sourced
#           files are themselves checked, so following would only double-report
#   SC2034  every hit is a variable a *sourced* consumer reads, which the
#           single-file view cannot see -- deb-preinst/postinst and doctor-common
shell_ignore = ["SC1091", "SC2034"]
skills_dir = "skills"
# A skill's frontmatter description is loaded into every agent session before
# any work starts, and it is the text a router chooses from. Both costs point
# the same way: thirty-four paragraphs discriminate worse than thirty-four
# sentences, and picking the wrong skill costs far more than the tokens. The
# set was uniformly over -- median 320 chars, all 34 above 150 -- because each
# carried a trailing "Covers X, Y, Z" enumeration duplicating its own body.
max_skill_description_chars = 200
# Bodies were already healthy at a median of 160 lines, and the
# split-to-references/ pattern is established. A ceiling to stop regrowth,
# not a mandate to rewrite anything.
max_skill_body_lines = 600

# A shell body is a sequence of simple commands. Control flow, multi-line
# string building and here-documents inside a YAML `run:` or a Dockerfile `RUN`
# are a program no test can reach and no reviewer reads in place -- the same
# reasoning `[boundary]` applies to justfile recipes, asked of the other places
# shell hides.
#
# The measurement says simple is already the norm and only the tail is a
# problem: across 274 bodies the median is 3 executable lines and p90 is 14.
# The fix for an entry below is a script under `scripts/`, which ShellCheck
# lints and a test can call -- not a bigger parser.
[boundary.shell_bodies]
max_lines = 20

# Exact ratchets, as everywhere else: an entry may not grow, and a body that
# shrinks updates or removes its entry in the same change.
[boundary.shell_bodies.oversized_line_counts]
"ci.yaml:test:21:Python schema tests with coverage" = 25
"release-assets.yaml:author-profile-release:17:Author selected channel profile in the source manifest" = 32
"release-assets.yaml:publish-profile-release:16:Publish immutable GitHub profile release" = 33
"release-binary-staging.yaml:assemble-binary-channel:9:Prove VM asset metadata did not change" = 34
"release.yaml:build-app-macos:22:Verify macOS package installation path policy" = 31
"release.yaml:preflight:3:Import Apple certificate (preflight)" = 23
"release.yaml:test-binary-pairing:21:Activate exact candidate package binaries for functional tests" = 25
"release.yaml:test-native-linux-package:5:Install and verify exact release deb" = 27
"release.yaml:test-native-macos-package:5:Install and verify exact notarized package" = 31
"release.yaml:verify-release-candidate:5:Verify public GitHub package storage from the candidate manifest" = 34
"release.yaml:verify-release-candidate:6:Prove install.sh selects and installs the candidate Linux package" = 25
"release.yaml:verify-release-downloads:7:Install live public Linux release and prove guest shell execution" = 40

# ---------------------------------------------------------------------------
# Lint coverage: every first-party surface has an enforcing check
# ---------------------------------------------------------------------------

# The question this answers is not "does this file pass" but "is anything
# checking this kind of file at all". Shell went unlinted for 6,821 lines while
# four `# shellcheck disable=` directives sat in the tree, written for a linter
# no lane ran. Nobody decided that; the surface simply never got one, and
# nothing was watching for the gap.
#
# `enforced_by` names the fast-phase step that must exist and must fail the run.
# Adding a surface without a checker fails the Citadel guard, which is the
# point: a new language arrives with its gate or it does not arrive.
[[lint_surfaces]]
name = "python"
pattern = "*.py"
enforced_by = ["python.ruff", "python.ty.strict", "python.ty.relaxed"]

[[lint_surfaces]]
name = "yaml"
pattern = "*.yaml"
enforced_by = ["fast.audit.source-syntax"]

[[lint_surfaces]]
name = "json"
pattern = "*.json"
enforced_by = ["fast.audit.source-syntax"]

[[lint_surfaces]]
name = "toml"
pattern = "*.toml"
enforced_by = ["fast.audit.source-syntax"]

[[lint_surfaces]]
name = "rust"
pattern = "*.rs"
enforced_by = ["fast.clippy"]
# Linting is not testing. Clippy answers in the fast phase; the two runners
# cannot, because both need a compiled workspace. Nextest owns every native
# target and structurally cannot own doctests -- see `rustinventory` -- so
# dropping either line leaves a category of Rust code that nothing executes.
checked_by = ["static.rust-coverage", "static.rust-doctests"]

[[lint_surfaces]]
name = "shell"
pattern = "*.sh"
enforced_by = ["fast.audit.shell"]

[[lint_surfaces]]
name = "dockerfile"
pattern = "docker/Dockerfile*"
enforced_by = ["fast.audit.docker"]

[[lint_surfaces]]
name = "markdown"
pattern = "*.md"
enforced_by = ["fast.audit.markdown"]

[[lint_surfaces]]
name = "web"
pattern = "*.svelte"
# The verify half: `svelte-check` is what actually lints these, and it moved
# out of the build when the two were split so clippy would stop waiting on it.
enforced_by = ["fast.web.frontend-verify"]

[[lint_surfaces]]
name = "skills"
pattern = "skills/*/SKILL.md"
enforced_by = ["fast.audit.skills", "fast.citadel"]

# Documents promising a reader -- usually an agent -- a file that is not there.
# Worse than saying nothing: the reader follows the instruction and finds
# nothing. Four were path bugs and are fixed; these are genuinely missing
# content, inventoried so no new one appears while they are written.
#
# Keyed `document|target`. Removing an entry when the file lands is the fix.
[lint.markdown.known_missing_targets]
# Empty, and it should stay that way. A document promising a reader -- usually
# an agent -- a file that is not there is worse than saying nothing. Fourteen
# entries went in here and all fourteen were fixed rather than suppressed: ten
# were index sections listing siblings never brought across with an imported
# summary, two were pointers written from inside `references/` and resolving to
# `references/references/`, and two were examples of how to write a pointer
# that no checker could tell from a real one.
#
# An entry that no longer applies fails as well, so this cannot quietly refill.

[websurfaces]
script = "scripts/check-web-surface.sh"
# Each is a separate target of the same script, so a failure names the surface.
#
# `frontend` was one target running a type-check, a unit-test run and a build.
# One step is one node, so the graph had no way to say that only the last of
# the three produces anything, and clippy -- which waits on the frontend --
# waited on all of it.
targets = ["frontend-build", "frontend-verify", "docs", "site", "release-site"]
# The frontend build must finish before clippy: capsem-app embeds frontend/dist
# at compile time via `tauri::generate_context!`, so clippy reads a directory
# that build produces. Expressed as an edge, where the shell expressed it as a
# conditional that skipped clippy entirely when the frontend failed.
blocks_clippy = "frontend-build"
# The one surface that reads `mock-settings.generated`, and so the only one
# that waits for `audit.generated-settings`. Three files import it and every
# one of them is under `frontend/src/**/__tests__/`, which makes it a test
# dependency; it reached clippy only because the tests shared a step with the
# build.
needs_generated_settings = "frontend-verify"
# The surfaces that run a bundler, and therefore the ones that take
# `astro_build`. The claim exists because Astro stages prerendering in a path
# derived from the project root; a surface that only type-checks or runs vitest
# stages nothing, and holding it there serialises work that could overlap.
building = ["frontend-build", "docs", "site"]

