# The build and release gate's data, in one place.
#
# `src/capsem/gate/` holds the decisions; this holds the values those decisions
# are made from -- container names, scratch paths, timeouts, the boundary/rail
# pairs the storage policy accepts, the artifacts an asset build must produce.
#
# It exists because the same values were previously spelled inside whichever
# module happened to need them, which is how the justfile ended up with eleven
# hand-written copies of one storage command and four disagreeing `case` blocks
# over architecture names. A value that lives in one file can be read by the
# code, by the contract tests, and by a person deciding whether to change it.
#
# Loaded through `capsem.gate.config`, which validates it with Pydantic: a
# missing key or a wrong type fails at load with the field named, not deep
# inside a forty-minute run.
version = 1

# ---------------------------------------------------------------------------
# Architectures
# ---------------------------------------------------------------------------
# One target under every name some tool insists on. `uname -m` says aarch64,
# the assets tree says arm64, dpkg says arm64 for ARM but amd64 for Intel, and
# rustc wants a full triple.

# `/usr/lib/<gnu>/pkgconfig` is where every multiarch cross toolchain puts its
# `.pc` files; the tuple is the only part that varies.
pkg_config_template = "/usr/lib/{gnu}/pkgconfig:/usr/share/pkgconfig"

[architectures.arm64]
rust_target = "aarch64-unknown-linux-gnu"
dpkg = "arm64"
gnu = "aarch64-linux-gnu"
aliases = ["arm64", "aarch64"]

[architectures.x86_64]
rust_target = "x86_64-unknown-linux-gnu"
dpkg = "amd64"
gnu = "x86_64-linux-gnu"
aliases = ["x86_64", "amd64"]

# ---------------------------------------------------------------------------
# Docker storage
# ---------------------------------------------------------------------------

[storage]
policy_script = "scripts/docker-storage-policy.py"
ensure_space_script = "scripts/ensure-docker-space.sh"

# Points at which storage held for a finished rail may be released, and the
# rail whose headroom that release serves. Eleven recipes used to spell these
# pairs by hand, so the legal set existed only as a habit.
[storage.phases]
completed-linux-rust-target = { boundary = "after-linux-rust", rail = "assets" }
completed-docker-rails = { boundary = "after-assets", rail = "package" }
completed-buildkit-graph = { boundary = "after-packages", rail = "package" }
completed-package-arm64 = { boundary = "after-package-arm64", rail = "install" }
completed-package-x86_64 = { boundary = "after-package-x86_64", rail = "install" }
deferred-install-target = { boundary = "before-packages", rail = "package" }
candidate-boundary = { boundary = "candidate-boundary", rail = "default" }
after-install = { boundary = "after-install", rail = "install" }
linux-rust-builder = { boundary = "after-linux-rust-builder", rail = "install-preflight" }
install-preflight = { boundary = "after-install-preflight", rail = "install-preflight" }

# ---------------------------------------------------------------------------
# Stopping gate-owned daemons
# ---------------------------------------------------------------------------

[doctor]
storage_policy = "config/storage-policy.toml"
# The host-tooling half of `just doctor`. The gate command checks its own
# wiring; this checks the machine, and reads the skip variables an image
# build sets so the asset and KVM checks do not fail on the very thing that
# build is about to produce.
common_script = "scripts/doctor-common.sh"

[pidfiles]
# Ordered. The gateway owns the fixed localhost port, so it must stop before
# the service -- otherwise the next profile attaches to an orphan gateway whose
# UDS points at a deleted run directory.
names = ["gateway.pid", "service.pid"]
term_wait_seconds = 2.0
kill_wait_seconds = 1.0
poll_interval_seconds = 0.1
# Linux reports process state here. A zombie answers `kill -0` until someone
# waits on it, so liveness needs more than the signal.
proc_stat_template = "/proc/{pid}/stat"

# ---------------------------------------------------------------------------
# The native install and glow-up proof
# ---------------------------------------------------------------------------

[install]
container = "capsem-install-test"
image = "capsem-install-test"
dockerfile = "docker/Dockerfile.install-test"
venv = "/home/capsem/.venv-install-test"
mount = "/src"
channel = "local"
manifest_version = "1.0.0"

systemd_ready_attempts = 30
systemd_ready_interval_seconds = 0.5
serve_ready_file = "/tmp/capsem-install-release.json"
serve_ready_attempts = 100
serve_ready_interval_seconds = 0.05

# Present and writable means this host can boot a real guest, and the glow-up
# runs complete rather than packaging-only.
vm_devices = ["/dev/kvm", "/dev/vhost-vsock"]
optional_vm_devices = ["/dev/vsock"]
rosetta_binfmt = "/proc/sys/fs/binfmt_misc/rosetta"

# Where the extracted-but-not-installed package lands. Deliberately not
# /usr/bin: nothing that authors the release graph may depend on the package
# under test having been installed first.
# What a systemd container is, wherever one is started.
systemd_command = "/usr/lib/systemd/systemd"
cgroup_path = "/sys/fs/cgroup"
tmpfs_paths = ["/run", "/tmp"]

# Where an installed package puts things, and what the runtime calls them.
bin_dir = "/usr/bin"
installed_capsem = "/usr/bin/capsem"
capsem_home = ".capsem"
manifest_name = "manifest.json"
sbom_name = "capsem-sbom.spdx.json"
candidate_prefix = "v"
file_url_scheme = "file://"
release_site_dir = "release-site"
storage_ledger = "target/storage"
test_output_root = "/tmp/capsem-test-output"

preinstall_root = "/tmp/capsem-preinstall"
admin_relative = "usr/bin/capsem-admin"
request_script = "scripts/install-manifest-request.sh"

# The authoritative release graph, and the legacy runtime projection an
# operator can mistake for it. Handing the installer the second produces an
# install that looks fine and carries the wrong manifest.
graph_manifest = "assets/local/manifest.json"
legacy_projection = "manifest.json"

# The unprivileged user the container runs proofs as. Every one of these paths
# has to stay off the bind mount: /src belongs to the host uid, so anything
# written there by `capsem` fails with EACCES on Linux and only on Linux.
[install.guest_user]
name = "capsem"
home = "/home/capsem"
runtime_dir = "/run/user/1000"
tmp = "/home/capsem/tmp"
pytest_cache = "/home/capsem/.pytest_cache"
asset_manifest = "/home/capsem/.capsem/assets/manifest.json"

# The suite proving the installed package, run from inside the container.
[install.suite]
path = "tests/capsem-install/"
glowup_script = "scripts/local-release-glowup.py"
macos_report_check = "scripts/check-macos-native-glowup.py"
stage_inputs_script = "scripts/stage-release-test-inputs.py"
serve_script = "scripts/serve-release-test-root.py"
sbom_script = "scripts/generate-host-binary-sbom.py"
web_surface_script = "scripts/check-web-surface.sh"
# The Debian package name, as dpkg-query reports it.
package_name = "capsem"

# Scratch, all under target/ so a failed run leaves evidence without dirtying
# the checkout.
[install.layout]
assets = "target/install-test-assets"
config = "target/install-test-config"
channel = "target/install-test-channel"
packages = "target/install-test-packages"
glowup = "target/local-release-glowup"

# Written by the container as its own user, and handed back on the way out.
extra_owned_paths = ["release-site/node_modules", "release-site/dist"]

# Named so the release-site build does not reinstall its dependencies every run
# or write them into the bind-mounted checkout.
[[install.volumes]]
source = "capsem-install-release-site-node-modules"
target = "/src/release-site/node_modules"

[[install.volumes]]
source = "capsem-install-release-site-dist"
target = "/src/release-site/dist"

# ---------------------------------------------------------------------------
# The Linux package rail
# ---------------------------------------------------------------------------

[package]
builder_image = "capsem-host-builder:latest"
build_script = "scripts/build-linux-package.sh"
proof_selector = "scripts/select-linux-deb-proof.sh"
# The sidecar a release lane stages beside its manifest.
release_inputs_name = "release-inputs.json"
default_manifest_url = "https://release.capsem.org/assets/stable/manifest.json"
channels = ["stable", "nightly", "corp"]
default_channel = "stable"
toolchain_pin = "rust-toolchain.toml"
clock_script = "scripts/sync-container-clock.py"
cargo_target_mount = "/cargo-target"
package_suffix = ".deb"
dist_dir = "dist"
# Per-architecture, so alternating targets does not rebuild the world.
target_volume = "capsem-host-target-{arch}"

# Installing the exact package into a clean systemd container and proving it
# works: every binary present and reporting the package's own version, the
# service and gateway up, every profile ready, and a real guest shell.
[package.proof]
container = "capsem-qualified-deb-proof"
systemd_ready_attempts = 60
verify_script = "scripts/verify-installed-release.py"
shell_proof_script = "scripts/prove-installed-shell.py"
shell_marker = "CAPSEM_QUALIFIED_DEB_SHELL_OK"
session_name = "qualification-exact-deb-shell"
shell_timeout_seconds = 300

# Every binary the package must install. Each reports the package version
# except capsem-app, which is the Tauri bundle and has no --version.
binaries = [
    "capsem",
    "capsem-admin",
    "capsem-app",
    "capsem-gateway",
    "capsem-mcp",
    "capsem-mcp-aggregator",
    "capsem-mcp-builtin",
    "capsem-process",
    "capsem-service",
    "capsem-tray",
    "capsem-tui",
    "capsem-mock-server",
    "capsem-bench-rs",
]
binaries_without_version = ["capsem-app"]

# `capsem status` lines that must be present. A package that installs and then
# cannot start its own service passes every file-existence check.
status_requires = [
    "Installed: true",
    "Running:   true",
    "Service:   ok",
    "Gateway:   ok",
]

# Shared across every package build, so the second architecture reuses the
# first's downloads instead of refetching the index.
[[package.volumes]]
source = "capsem-cargo-registry"
target = "/usr/local/cargo/registry"

[[package.volumes]]
source = "capsem-cargo-git"
target = "/usr/local/cargo/git"

[[package.volumes]]
source = "capsem-rustup"
target = "/usr/local/rustup"

# ---------------------------------------------------------------------------
# The VM asset build and boot gate
# ---------------------------------------------------------------------------

[assets]
test_root = "target/ironbank-assets"
profiles_glob = "config/profiles/*/profile.toml"

# A build that exits zero having produced none of these is the failure worth
# naming here rather than much later, inside a VM boot.
required_artifacts = [
    "vmlinuz",
    "initrd.img",
    "rootfs.erofs",
    "obom.cdx.json",
    "software-inventory.json",
]
failure_tail_lines = 200
shell_proof_timeout_seconds = 300

# `cargo run` rather than a built binary: the asset gate runs before anything
# has installed one, and the admin under test is this checkout's.
admin_command = ["cargo", "run", "-p", "capsem-admin", "--"]
capsem_binary = "target/debug/capsem"
hash_assets_script = "scripts/create_hash_assets.py"
shell_proof_script = "scripts/prove-installed-shell.py"
container_cleanup_script = "scripts/cleanup-docker-containers-by-mount.sh"

# Docker must be able to execute the *other* architecture before any lane
# starts, or the second lane fails an hour in with an exec format error.
cross_platform_probe_image = "debian:bookworm-slim"
cross_platform_prefix = "linux/"
cross_platform_probe_command = "/bin/true"
merged_assets_dir = "assets"
merged_config_dir = "config"
profile_home_dir = "home"
failure_evidence_dir = "run-failure"
# The subdirectory `capsem-admin profile materialize` writes into.
materialized_profiles_dir = "profiles"
# The alias the image builders repoint at whichever architecture they built last.
current_link = "current"

# Copied out of a failed run before its scratch is removed. Host-side
# diagnostics only: `guest/` and `auto_snapshots/` duplicate the guest's own
# workspace once per generation, and the same filter keeps the VM disk image
# and session.db out of target/.
evidence_suffixes = [".log", ".json", ".toml"]
evidence_prune_dirs = ["guest", "auto_snapshots"]
# AF_UNIX paths must stay under macOS SUN_LEN once the gateway appends its
# session path, and target/ironbank-assets is already too long.
run_dir_template = "/tmp/capsem-a.XXXXXX"

# ---------------------------------------------------------------------------
# The candidate gate
# ---------------------------------------------------------------------------

[candidate]
# macOS sleeps an unattended machine mid-gate, and a forty-minute run that dies
# at minute thirty proves nothing.
keep_awake_command = ["caffeinate", "-dimsu"]
keep_awake_marker = "CAPSEM_TEST_CAFFEINATED"

source_digest_script = "scripts/source-state-digest.py"
orphan_script = "scripts/check-orphan-processes.py"
# Where the recorded state waits between the step that measures it and the one
# that re-asserts it.
source_state_file = "target/gate-source-state.json"

# The Colima binary, restored to whatever the developer had. This used to be a
# shell trap around the expensive half of the gate, so it was correct only for
# the commands that happened to sit inside the wrapper.
colima = "colima"

bootstrap_script = "bootstrap.sh"
clean_stale_script = "scripts/clean_stale.py"
generated_settings_script = "scripts/check-generated-settings.sh"
materialize_script = "scripts/materialize-config.sh"
recipe_suite = ["uv", "run", "python", "-m", "pytest", "tests/capsem-recipes/", "-v", "--tb=short", "-m", "recipe"]
# The rail and boundary the whole gate's disk budget is taken against.
candidate_budget = ["default", "candidate-boundary"]
# Where a failed gate's evidence is kept, and what to call a run whose
# source state was never recorded.
failure_rail = "default"
unknown_head = "unknown"

# ---------------------------------------------------------------------------
# Version stamping
# ---------------------------------------------------------------------------
# Files carrying a copy of the workspace version. Cargo.lock and uv.lock are
# absent on purpose: their copies are refreshed by the tools that own them.

[versions]
# The one authority: a human decision, recorded here and fanned out.
cargo_manifest = "Cargo.toml"
tag_prefix = "refs/tags/v"

[[versions.stamped]]
path = "crates/capsem-app/tauri.conf.json"
kind = "json_key"
key = "version"

[[versions.stamped]]
path = "pyproject.toml"
kind = "toml_key"
key = "version"

# ---------------------------------------------------------------------------
# Python source gates
# ---------------------------------------------------------------------------

[lint]
python_roots = ["src", "scripts", "tests", "guest"]
# Already passes every rule, and must keep doing so.
strict_roots = ["src"]
# A ty warning exits zero, so without this a warning-level rule on the ratchet
# could never be detected as fixed.
ty_flags = ["--error-on-warning"]

# Rules held back outside strict_roots. Roughly four hundred diagnostics,
# dominated by inference over untyped fixture data: `json.load` returning
# `object` and then being subscripted, `helpers.*` imports that resolve only
# through conftest's sys.path wiring. Every rule NOT listed here is enforced on
# those trees today, which is four hundred more than when ty ran on
# src/capsem alone.
#
# A ratchet: entries may leave, nothing may join. tests/test_gate_boundary.py
# fails when a rule listed here no longer fires.
ty_ratchet = [
    "call-top-callable",
    "invalid-argument-type",
    "invalid-assignment",
    "invalid-attribute-override",
    "invalid-method-override",
    "invalid-return-type",
    "no-matching-overload",
    "not-iterable",
    "not-subscriptable",
    "possibly-missing-submodule",
    "unknown-argument",
    "unresolved-attribute",
    "unresolved-import",
    "unsupported-operator",
    "unused-ignore-comment",
    "unused-type-ignore-comment",
]

# ---------------------------------------------------------------------------
# The justfile/package boundary
# ---------------------------------------------------------------------------

[boundary]
# A recipe body over this many executable lines is inline logic, and a gate
# module over its ceiling is the 2000-line justfile growing back in Python.
max_recipe_lines = 5
max_module_lines = 300

# Shell control flow in a body with no shebang is still a program no test can
# reach: `just` hands each line to a shell, so a `for` loop spread across
# continuations runs untested.
shell_control_flow = ["if ", "for ", "while ", "case ", "until ", "trap "]
# Empty, and it stays empty: a recipe is a dispatch or a single command.
recipes_with_inline_control_flow = []

# The only modules allowed to touch the machine directly. Each owns one piece
# of machine state as its entire purpose, so there is no gate work here for a
# dry run to show and routing it through an action would be ceremony.
#
#   actions      the process primitives, including a detached launch that
#                has to record the pid `pidfiles` will later stop
#   fileactions  the filesystem primitives themselves
#   proc         the single funnel every invocation passes through, and so the
#                one place the run log has to hook
#   pidfiles     where a signal is sent, so "which process did the gate kill"
#                has a single answer
#   locks        the lockfile that makes one gate per machine true, which has
#                to be placed before any workspace exists to put it in
#   runlog       the run directory itself, which cannot be written through
#                actions because actions report into it
#   runhistory   reclaiming those directories, for the same reason
#   disk         reclaiming every other tree the gate creates, with the
#                resolved-path and symlink guards that makes safe
#   workspace    the isolated CAPSEM_HOME, wiped on the way in and cleared on
#                the way out -- it is the tree the actions run against
#
# The through-line: these are the harness, and the harness is what gate work is
# expressed *in*. Anything built on top of it -- a capability, a command -- goes
# through actions, or its work is invisible to the dry run and the log.
#
# Widening this is a design decision, not a convenience.
direct_machine_access = [
    "actions.py",
    "fileactions.py",
    "proc.py",
    "pidfiles.py",
    "locks.py",
    "runlog.py",
    "runhistory.py",
    "disk.py",
    "workspace.py",
]

# Only the plan schedules concurrent work. A module that reaches for its own
# thread pool has parallelism the graph cannot see -- and therefore parallelism
# the exclusives cannot constrain, which is exactly what seven bare `&` in one
# recipe body were.
direct_concurrency = ["planrunner.py"]

# Modules that still reach past the primitives, pending extraction onto them.
# Work that goes around `actions`/`fileactions` is work the dry run cannot show
# and the run log cannot time.
#
# A ratchet, not an exemption list: a module may leave it, nothing may join it,
# and one that has been extracted must be struck so the list cannot describe a
# past that is no longer true.
modules_bypassing_primitives = [
    "assetlanes.py",
    "assets.py",
    "crosscompile.py",
    "doctor.py",
    "versions.py",
]

# ---------------------------------------------------------------------------
# What may not run beside what
# ---------------------------------------------------------------------------

# Each entry names one thing only one step may hold at a time, and why. The
# reason is the point. Written as `&` and `wait`, this knowledge lived in shell
# comments -- seven backgrounded jobs in `_test-candidate-run` and three more in
# `smoke`, with nothing to stop an eighth from violating a constraint recorded
# three hundred lines away.
#
# A step names what it contends for; the plan gives each name a lock. Two
# claimants of one entry can never overlap, and claimants of different entries
# still do.

[execution.exclusives.apple_vz]
reason = "two benchmark files launching VMs at once measure each other, not Capsem"

[execution.exclusives.host_service]
reason = "production has one service and one service-scoped snapshot lock; an xdist worker per service does not reproduce that"

[execution.exclusives.workspace_binaries]
reason = "cargo build --workspace atomically replaces the binaries a running VM test is using"

[execution.exclusives.docker_daemon]
reason = "the storage rails reserve and release a single daemon's disk budget"

[execution.exclusives.astro_build]
reason = "Astro stages prerendering in a path derived from the project root, not from the invocation, so two overlapping builds delete each other's staging -- and neither --outDir nor --cacheDir moves it"

[execution.exclusives.node_modules]
reason = "pnpm install rewrites a workspace's node_modules in place, and every web build reads it"

# ---------------------------------------------------------------------------
# One gate per machine
# ---------------------------------------------------------------------------

[locks.gate]
# Deliberately outside every tree the gate wipes. The run takes this lock and
# *then* removes CAPSEM_HOME, so a lockfile living inside it would be deleted
# while held -- and the next run would take a lock on a fresh inode and start
# beside the first.
path = "target/capsem-test-execution.lock"
# flock, not a pidfile: the kernel releases it when the holder dies, so there is
# no stale-lock heuristic to get wrong. The holder writes who it is here so
# contention can name it.
holder_record = "target/capsem-test-execution.holder"
# Report the holder rather than blocking mutely. Someone who left `just test`
# running in another terminal deserves to be told that, not to watch a cursor.
report_after_seconds = 2
wait_timeout_seconds = 7200
poll_interval_seconds = 0.25

# ---------------------------------------------------------------------------
# The tools a gate needs before it can start
# ---------------------------------------------------------------------------

[toolchain]
# Every entry is idempotent: present means nothing happens. Written as eight
# near-identical `if ! ... ; then ... fi` blocks in shell, where the only thing
# that varied was the probe and the install.
sync = ["uv", "sync"]
node_workspaces = ["frontend", "docs", "site", "release-site"]
# CI=true suppresses pnpm's interactive "remove and reinstall node_modules?"
# prompt, which hangs an unattended gate when the store layout drifts from the
# lockfile.
node_install = ["pnpm", "install", "--frozen-lockfile"]
node_env = { CI = "true" }

# Rust targets the guest binaries cross-compile to.
rust_targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# rust-lld comes from here.
rust_components = ["llvm-tools"]

# `probe` is what proves it is already present; `install` is what puts it
# there. A table rather than eight code blocks, so adding one is a line.
[[toolchain.crates]]
name = "cargo-llvm-cov"
install = ["cargo", "install", "cargo-llvm-cov"]

[[toolchain.crates]]
name = "b3sum"
install = ["cargo", "install", "b3sum", "--locked"]

[[toolchain.crates]]
name = "cargo-audit"
install = ["cargo", "install", "cargo-audit"]

[[toolchain.crates]]
name = "cargo-sbom"
install = ["cargo", "install", "cargo-sbom", "--locked"]

[[toolchain.crates]]
name = "cargo-tauri"
install = ["cargo", "install", "tauri-cli"]

[release]
# The order is non-negotiable, and it is the reason this exists as a command
# rather than a script: nothing may stamp a version, mutate a tracked file,
# push, tag, or dispatch a workflow before the complete local gate has passed
# against the exact HEAD that gets published.
precheck = ["scripts/publish-tested-main.py", "--precheck"]
notes = ["scripts/extract-release-notes.py", "--check"]
fetch_manifest = "scripts/fetch-channel-source-manifest.py"
publish = "scripts/publish-tested-main.py"
binaries = "scripts/release-binaries.py"
profile = ["cargo", "run", "-p", "capsem-admin", "--", "release"]
preflight_dir = "target/release-preflight"
channel_source = "target/release-preflight/channel-source.json"
default_repository = "google/capsem"
repository_variable = "GITHUB_REPOSITORY"
token_variable = "GITHUB_TOKEN"

[devloop]
setup_sentinel = ".dev-setup"
dev_lock = "run/execution.lock"
tauri = ["cargo", "tauri", "dev", "--config", "crates/capsem-app/tauri.conf.json"]
frontend_dev = ["pnpm", "run", "dev"]
frontend_dir = "frontend"
tui = ["cargo", "run", "-p", "capsem-tui"]
surfaces = ["ui", "frontend", "tui"]
generate_settings = "scripts/generate-settings.sh"
check_settings = "scripts/check-generated-settings.sh"
materialize_config = "scripts/materialize-config.sh"

[initrd]
# The guest binaries the initrd carries, all cross-compiled to musl.
binaries = [
    "capsem-pty-agent", "capsem-net-proxy", "capsem-dns-proxy",
    "capsem-mcp-server", "capsem-sysutil", "capsem-bench-rs",
]
staging = "target/linux-agent"
# Rebuilt when a staged binary is missing, or older than the sources it came
# from. Cheaper than an unconditional cross-compile, and correct because these
# are the only crates that produce them.
sources = ["crates/capsem-agent", "crates/capsem-proto", "crates/capsem-bench"]
build = ["uv", "run", "capsem-builder", "agent", "config/docker/image"]

# Checked-in guest payloads copied in beside the binaries.
init = "guest/artifacts/capsem-init"
files = ["guest/artifacts/capsem-doctor", "guest/artifacts/capsem-bench", "guest/artifacts/snapshots"]
trees = ["guest/artifacts/capsem_bench", "guest/artifacts/diagnostics"]
prune = "__pycache__"

# 555 on every guest binary: the rootfs is mounted read-only and the guest may
# not modify its own binaries. The builder applies this after a fresh
# cross-compile; reasserted here because a cached staging directory may have
# had its modes changed between builds.
binary_mode = 0o555
init_mode = 0o755

manifest = ["cargo", "run", "-p", "capsem-admin", "--", "manifest", "generate"]
hash_assets = "scripts/create_hash_assets.py"
# Touched so cargo re-runs build.rs and picks up the new manifest hashes.
rebuild_trigger = "crates/capsem-app/build.rs"

[smoke]
# Focused developer feedback, never release qualification. Three groups that
# can share the machine, then the two that cannot.
doctor = ["target/debug/capsem", "doctor"]
run_id_variable = "CAPSEM_TEST_RUN_ID"
log = "target/smoke.log"

# Suspend/resume is host-resource sensitive under Apple VZ: an unrelated VM can
# make a resume fail before the guest signals ready. These run after the
# parallel phase, for the same reason the full gate serializes them.
[[smoke.groups]]
name = "mcp"
paths = ["tests/capsem-mcp/"]
markers = "mcp"
parallel = 0

[[smoke.groups]]
name = "service-cli"
paths = ["tests/capsem-service/", "tests/capsem-cli/"]
markers = "integration"
# The longest group, and the big lever: -n 2 with --dist=loadfile takes it from
# about 67s to about 36s, and loadfile keeps a file's tests on one worker so
# module-scoped fixtures are not rebuilt.
parallel = 2

[[smoke.groups]]
name = "gateway"
paths = ["tests/capsem-gateway/"]
markers = "gateway"
parallel = 0

[[smoke.serial_groups]]
name = "mcp-serial"
paths = ["tests/capsem-mcp/test_state_transitions.py"]
markers = "mcp"

[[smoke.serial_groups]]
name = "service-serial"
paths = [
    "tests/capsem-service/test_svc_resume_paths.py",
    "tests/capsem-service/test_svc_suspend_corruption.py",
    "tests/capsem-service/test_svc_loop_device_after_resume.py",
]
markers = "integration"

[service]
# The development daemon: the same profile/assets rail an installed package
# uses, so the dev service cannot mix stale profile pins with fresh assets and
# make profiles look broken in the UI.
binary = "target/debug/capsem-service"
process_binary = "target/debug/capsem-process"
sync_assets_script = "scripts/sync-dev-assets.sh"
generated_profiles = "target/config/profiles"
assets_dir = "assets"
home_assets = "assets"
home_profiles = "profiles"
socket = "service.sock"
pidfile = "service.pid"
# Config files an older layout wrote into the home. Removed on every start so a
# checkout that predates the change cannot keep booting from them.
retired_config = ["user.toml", "service.toml"]
ready_attempts = 30
ready_interval_seconds = 0.5
log_level = "capsem=debug"

[hostimage]
# The Linux builder image, and the Linux-Rust parity lane that runs inside it.
tag = "capsem-host-builder:latest"
dockerfile = "docker/Dockerfile.host-builder"
context = "docker/"
script = "scripts/test-linux-rust.sh"
output_dir = "target/linux-rust-coverage"
nextest_dir = "nextest"
mount = "/src"
container_output = "/linux-rust-output"
container_home = "/tmp/capsem-home"
# A foreign UID reproduces the case Linux CI actually hits: the checkout's
# owner is not the image's user, git rejects /src as "dubious ownership", and
# build.rs answers by embedding "unknown" rather than failing -- which is how a
# binary with no source identity reaches the provenance check. Checked on macOS
# too, because git compares st_uid to euid in userspace.
probe_user = "4242:4242"
alpine = "alpine"
# A writable, executable /tmp: the suite compiles and runs test binaries there,
# and the default read-only overlay makes every one of them fail to exec.
tmpfs = "/tmp:rw,exec,mode=1777"
# nextest writes its own state under the target dir; bound out so the results
# survive the container.
nextest_mount = "target/nextest"
cached_volumes = [
    { source = "capsem-linux-rust-cargo-registry", target = "/usr/local/cargo/registry" },
    { source = "capsem-linux-rust-cargo-git", target = "/usr/local/cargo/git" },
    { source = "capsem-linux-rust-rustup", target = "/usr/local/rustup" },
    { source = "capsem-linux-rust-target", target = "/cargo-target" },
]
environment = { HOME = "/tmp/capsem-home", CAPSEM_SKIP_KVM_TESTS = "1", CAPSEM_LINUX_RUST_OUTPUT_DIR = "/linux-rust-output" }

[sbom]
script = "scripts/generate-host-binary-sbom.py"
output = "target/ironbank-host-sbom.spdx.json"
dist_glob = "dist/*{version}*.deb"
macos_package = "packages/Capsem-{version}.pkg"
# Two, one per architecture. Fewer means a build did not happen; more means an
# older version's packages are still in dist/ and the SBOM would describe a
# cohort nobody is shipping.
expected_debs = 2
spdx_version = "SPDX-2.3"

[signing]
entitlements = "entitlements.plist"
binaries = [
    "target/debug/capsem", "target/debug/capsem-service", "target/debug/capsem-process",
    "target/debug/capsem-gateway", "target/debug/capsem-mcp", "target/debug/capsem-admin",
]
release_binary = "target/debug/capsem"

[frontend]
build_script = "scripts/check-web-surface.sh"
build_target = "frontend-build"
# capsem-app embeds frontend/dist at compile time, so the bundle has to exist
# before cargo reads it.
app_crate = "capsem-app"
profiles = ["debug", "release"]

[logs]
service_log = ".capsem/run/service.log"
failure_root = "target/test-artifacts"
cli = "target/debug/capsem"

[imagebuild]
# One `capsem-admin image build` invocation, with the template as the only
# thing that varies. Four recipes spelled it out, and the shape of the argv was
# the same in all four.
admin = ["cargo", "run", "-p", "capsem-admin", "--", "image", "build"]
# The stages a concurrent asset lane builds, in order. Named here because the
# lanes build kernel and rootfs separately while a single-shot build uses
# "all", and a second copy of that list in code is a second opinion.
lane_templates = ["kernel", "rootfs"]
templates = ["kernel", "rootfs", "all"]
profiles_glob = "config/profiles/*/profile.toml"
profile_manifest = "config/profiles/{profile}/profile.toml"
config_root = "config"
output = "assets"
# Doctor is run first, with the checks that would fail on the very thing this
# is about to build turned off.
doctor_skips = { CAPSEM_SKIP_ASSET_CHECK = "1", CAPSEM_SKIP_KVM_CHECK = "1" }
# What a per-architecture asset tree must contain to count as built.
required = ["vmlinuz", "initrd.img", "rootfs.erofs"]

# ---------------------------------------------------------------------------
# The cheap checks, and what they may overlap with
# ---------------------------------------------------------------------------

[audits]
# Independent by construction: none reads what another writes, so the graph
# runs them at once and reports every failure rather than the first. As shell
# these were seven `&` and seven `wait` aggregating into a single FAIL bit,
# which told you something broke but not what.
cargo = "scripts/check-cargo-audit.py"
pnpm = "scripts/audit-pnpm-bulk.py"
python_lock = "scripts/audit-python-lock.sh"
public_surface = "scripts/check_public_surface.py"
source_syntax = "scripts/check-source-syntax.py"
hardcoded_selections = "scripts/check-hardcoded-release-selections.sh"
skills_dir = "skills"

[websurfaces]
script = "scripts/check-web-surface.sh"
# Each is a separate target of the same script, so a failure names the surface.
targets = ["frontend", "docs", "site", "release-site"]
# The frontend must finish before clippy: capsem-app embeds frontend/dist at
# compile time via `tauri::generate_context!`, so clippy reads a directory the
# frontend build produces. Expressed as an edge, where the shell expressed it
# as a conditional that skipped clippy entirely when the frontend failed.
blocks_clippy = "frontend"

[suites]
# Tests that inspect release/CI/Just composition or adversarially test the
# cheap gate scripts. None needs built artifacts or a VM, which is why they run
# in the fast module and are excluded from the VM matrix later -- one
# inventory, used from both ends, rather than two lists that drift.
#
# Enumerated rather than globbed because membership is a claim about what a
# test *needs*, not about where it happens to live. A guard requires every
# `tests/test_gate_*.py` to appear here, since by construction those need
# neither.
source_contract = [
    "tests/test_agent_skill_index.py",
    "tests/test_authoritative_values_are_not_restated.py",
    "tests/test_build_assets_profile.py",
    "tests/test_build_provenance.py",
    "tests/test_builder_probe_timeouts.py",
    "tests/test_cargo_audit_gate.py",
    "tests/test_check_cargo_audit.py",
    "tests/test_complete_release_channel.py",
    "tests/test_docker_storage_policy.py",
    "tests/test_exec_lock.py",
    "tests/test_exit_status_integrity.py",
    "tests/test_fast_gate_ci_contract.py",
    "tests/test_gate_actions.py",
    "tests/test_gate_assetlanes.py",
    "tests/test_gate_assets.py",
    "tests/test_gate_boundary.py",
    "tests/test_gate_candidate.py",
    "tests/test_gate_cli.py",
    "tests/test_gate_command.py",
    "tests/test_gate_config.py",
    "tests/test_gate_candidate_composition.py",
    "tests/test_gate_crosscompile.py",
    "tests/test_gate_debproof.py",
    "tests/test_gate_disk.py",
    "tests/test_gate_docker.py",
    "tests/test_gate_doctor.py",
    "tests/test_gate_exec_boundary.py",
    "tests/test_gate_execute_funnel.py",
    "tests/test_gate_fileactions.py",
    "tests/test_gate_has_no_literal_data.py",
    "tests/test_gate_hostimage_composition.py",
    "tests/test_gate_install_container.py",
    "tests/test_gate_no_nested_commands.py",
    "tests/test_gate_install_ordering.py",
    "tests/test_gate_lifecycle.py",
    "tests/test_gate_locks.py",
    "tests/test_gate_pidfiles.py",
    "tests/test_gate_plan.py",
    "tests/test_gate_release_head.py",
    "tests/test_gate_primitives_are_the_only_way.py",
    "tests/test_gate_pytestsuite.py",
    "tests/test_gate_proc.py",
    "tests/test_gate_runlog.py",
    "tests/test_gate_smoke_lifecycle.py",
    "tests/test_gate_storage.py",
    "tests/test_gate_testmodules.py",
    "tests/test_gate_timing.py",
    "tests/test_gate_versions.py",
    "tests/test_gate_workspace.py",
    "tests/test_integration_script_profiles.py",
    "tests/test_live_channel_watch.py",
    "tests/test_macos_tart_glowup.py",
    "tests/test_orphan_process_gate.py",
    "tests/test_path_and_log_wrappers_are_mandatory.py",
    "tests/test_pidfile_cleanup_is_wired.py",
    "tests/test_pnpm_bulk_audit.py",
    "tests/test_profile_revision_semver.py",
    "tests/test_prove_installed_shell.py",
    "tests/test_release_gate_integrity.py",
    "tests/test_release_manifest_assets.py",
    "tests/test_release_site_generated_from_json.py",
    "tests/test_release_site_review_regressions.py",
    "tests/test_retired_version_formats.py",
    "tests/test_rust_test_layout.py",
    "tests/test_rust_test_name_assertions.py",
    "tests/test_skills.py",
    "tests/test_source_syntax_gate.py",
    "tests/test_sync_container_clock.py",
]

[suites.pytest]
# Where the tests are. Spelled here rather than in the module, so the broad
# suite and the compatibility runs cannot come to disagree about it.
root = "tests/"
# One spelling of "run pytest", so sixteen call sites cannot drift into
# sixteen slightly different opinions about --tb, --maxfail and -n.
base_flags = ["-v", "--tb=short"]
stop_at_first = "--maxfail=1"
parallel_flags = ["-n", "4", "--dist=loadfile"]
coverage_flags = ["--cov=src/capsem", "--cov-report=xml:codecov-python.xml"]

# Directories the broad suite never collects, each for its own reason.
#
#   capsem-recipes   its meta-tests invoke `cargo build --workspace`, which
#                    atomically replaces the codesigned binaries a concurrent
#                    VM test is using
#   capsem-install   also spawns `cargo build -p capsem` from inside pytest;
#                    owned by the install gate, which runs it in Docker
#   capsem-build-chain / capsem-release
#                    artifact and composition suites with their own entrypoints
broad_ignores = [
    "tests/capsem-recipes",
    "tests/capsem-install",
    "tests/capsem-build-chain",
    "tests/capsem-release",
]

# Production has one service and one service-scoped save/restore lock. An
# xdist worker per service does not reproduce that, so these run alone.
host_snapshot_serial = [
    "tests/capsem-mcp/test_state_transitions.py",
    "tests/capsem-service/test_svc_resume_paths.py",
    "tests/capsem-service/test_svc_suspend_corruption.py",
    "tests/capsem-service/test_svc_loop_device_after_resume.py",
]

# Timing probes. They run alone so their numbers measure Capsem rather than
# another benchmark file competing for the same Apple VZ launch budget.
serial_paths = ["tests/capsem-serial/", "tests/ironbank/test_route_health.py"]
benchmark_baseline = "tests/capsem-serial/test_capsem_bench_baseline.py"
benchmark_deselect = "not test_capsem_bench_baseline"

# Fails closed before collection rather than passing vacuously against a tree
# whose assets were never built.
require_artifacts = "CAPSEM_REQUIRE_ARTIFACTS"
profile_variable = "CAPSEM_TEST_PROFILE"
# The profile every broad proof runs against first. The rest are the
# compatibility axis, and run the VM-owned suites again behind it.
base_profile = "code"
materialized_profiles = "target/config/profiles"
test_manifest = "assets/manifest.json"

[functional]
# The two legacy VM drivers. Neither is pytest, both need a real VM, and both
# take the same three coordinates -- which is why they are here rather than
# spelled out at each of their four call sites.
injection_script = "scripts/injection_test.py"
integration_script = "scripts/integration_test.py"
binary = "target/debug/capsem"
assets_dir = "assets"
config_root = "target/config"
profiles_subdir = "profiles"
# Overridable so a release lane can point the same proof at pulled artifacts
# instead of source-built ones.
binary_variable = "CAPSEM_TEST_BINARY"
assets_variable = "CAPSEM_TEST_ASSETS_DIR"
config_root_variable = "CAPSEM_TEST_CONFIG_ROOT"
assets_dir_variable = "CAPSEM_ASSETS_DIR"

[modules]
# The build-chain suites that need built artifacts. The release-contracts
# module excludes them because it is the cheap composition proof; the artifacts
# module runs exactly them, once the assets exist.
build_chain_artifact_tests = [
    "tests/capsem-build-chain/test_cargo_build.py",
    "tests/capsem-build-chain/test_codesign.py",
    "tests/capsem-build-chain/test_full_chain.py",
    "tests/capsem-build-chain/test_manifest_regen.py",
    "tests/capsem-build-chain/test_materialized_profile_payload.py",
    "tests/capsem-build-chain/test_pack_initrd.py",
]
release_suites = ["tests/capsem-release/", "tests/capsem-build-chain/"]
contract_glob = "tests/test_*contract.py"

# The Rust coverage floor is 63, not 100. Some files -- uninstall, completions
# -- are intentionally at 0% because they are thin shells over OS and CLI
# primitives, and some defensive paths only execute under live VM traffic and
# are covered by the integration suites rather than by unit tests. The floor
# exists to catch "we deleted half the test suite", not to gate an honest
# defensive branch.
rust_coverage = ["cargo", "llvm-cov", "--workspace", "--bins", "--lib", "--tests", "--no-cfg-coverage"]
rust_coverage_floor = "--fail-under-lines=63"

guest_agent_build = ["uv", "run", "capsem-builder", "agent", "config/docker/image"]
guest_binaries = ["capsem-pty-agent", "capsem-net-proxy", "capsem-mcp-server"]
guest_binary_root = "target/linux-agent"
guest_binary_tests = [
    "tests/capsem-bootstrap/test_cross_compile.py",
    "tests/capsem-security/test_binary_perms.py::test_agent_binaries_555",
]

# Release-lane inputs. When these are set the module verifies pulled immutable
# artifacts instead of building source ones.
release_input_dir = "CAPSEM_RELEASE_INPUT_DIR"
release_profile = "CAPSEM_RELEASE_PROFILE"
release_package = "CAPSEM_RELEASE_PACKAGE"
verify_inputs_script = "scripts/verify-release-inputs.py"
prove_profile_assets_script = "scripts/prove-release-profile-assets.py"
glowup_script = "scripts/local-release-glowup.py"
macos_glowup_script = "scripts/macos_release_glowup.py"
macos_glowup_report = "target/macos-tart-glowup/report.json"
macos_report_variable = "CAPSEM_MACOS_NATIVE_GLOWUP_REPORT"
glowup_work_dir = "target/release-module-glowup"
channel_switch_work_dir = "target/release-module-channel-switch"
release_bin_dir = "CAPSEM_RELEASE_BIN_DIR"
default_bin_dir = "target/debug"
# Cleared for the channel-switch run: it has to rediscover the channel from
# the installed state rather than inherit what the previous run was told.
channel_switch_cleared = [
    "CAPSEM_RELEASE_CHANNEL",
    "CAPSEM_RELEASE_TRANSITION",
    "CAPSEM_RELEASE_BEFORE_MANIFEST",
    "CAPSEM_RELEASE_AFTER_MANIFEST",
    "CAPSEM_RELEASE_BEFORE_PACKAGE",
    "CAPSEM_RELEASE_BEFORE_PROFILE_INPUTS",
    "CAPSEM_RELEASE_AFTER_PROFILE_INPUTS",
    "CAPSEM_RELEASE_PROFILE",
    "CAPSEM_RELEASE_CANDIDATE_PROFILE_PUBLICATION",
    "CAPSEM_RELEASE_PUBLICATION_BASE",
]

# ---------------------------------------------------------------------------
# The isolated home a gate run works in
# ---------------------------------------------------------------------------

[workspace]
# Everything the gate does happens against this home, never the developer's.
# Wiped at the start of a run, which is why the machine lock is taken first and
# why the lockfile lives outside it.
home = "target/test-home/.capsem"
run_dir = "target/test-home/.capsem/run"
# Created up front: the service writes into all three and creating them lazily
# was how a first run differed from every later one.
seeded_dirs = ["run", "sessions", "logs"]

# Deliberately NOT cleared per module. `just test` runs several modules in
# sequence and the VM performance recordings are written by the functional one;
# a later module wiping them is why a fortnight of full gates left this empty
# and froze the published arm64 history. The entry point clears it once.
benchmark_root = "target/test-benchmarks"
coverage_file = "target/coverage/.coverage"

# What a failing run leaves behind, copied out before the run directory goes.
evidence_dir = "target/test-artifacts"

# ---------------------------------------------------------------------------
# The execution log
# ---------------------------------------------------------------------------

[runlog]
# One directory per run, so a failed gate is a directory you attach to a bug
# rather than a scrollback you had to be present for.
root = "target/gate-runs"
events = "run.jsonl"
# Spelled `event_schema` here and emitted as `schema` in each event: a Pydantic
# field named `schema` shadows a BaseModel attribute.
event_schema = "capsem.gate.runlog.v1"
step_log_dir = "steps"
summary = "summary.txt"
latest_link = "latest"
# Rotation by count and by bytes. A forty-minute gate writes a lot, and the
# machine running it is also the machine building VM images.
keep_runs = 20
keep_bytes = 2_000_000_000
# blake3 because the asset pipeline already speaks it.
artifact_digest = "blake3"
# Actions slower than this are named in the timing summary.
slow_action_seconds = 30

# ---------------------------------------------------------------------------
# Disk the gate is allowed to occupy
# ---------------------------------------------------------------------------

[disk]
# Everything the gate can create, so reclaiming is a policy rather than whoever
# remembers a path. Nothing outside this list may be removed: a guard proves the
# reclaimer cannot reach past it, and the loader rejects an absolute path or a
# `..` so the list cannot be aimed at the wrong tree.
reclaimable = [
    "target/gate-runs",
    "target/test-home",
    "target/image-workspace",
    "target/test-benchmarks",
    "target/linux-rust-coverage",
    "target/install-test-assets",
    "target/release-channel",
    "target/release-module-glowup",
    "target/release-module-channel-switch",
]
# Refuse to start an expensive phase below this, after reclaiming what we can.
# The gate builds two architectures of VM images; running out at minute thirty
# wastes the thirty.
required_free_gb = 60
# Warn when a single run's own footprint passes this.
run_footprint_warn_gb = 40
