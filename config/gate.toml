[suites.pytest]
# Where the tests are. Spelled here rather than in the module, so the broad
# suite and the compatibility runs cannot come to disagree about it.
root = "tests/"
# Collection is a cheap source-shape proof: no cache writes, no artifacts, and
# strict rejection of unknown configuration or markers.
collection_flags = ["--collect-only", "-qq", "-p", "no:cacheprovider", "--strict-config", "--strict-markers"]
# One spelling of "run pytest", so sixteen call sites cannot drift into
# sixteen slightly different opinions about --tb, --maxfail and -n.
base_flags = ["-v", "--tb=short"]
stop_at_first = "--maxfail=1"
parallel_flags = ["-n", "4", "--dist=loadfile"]
coverage_flags = ["--cov=src/capsem", "--cov-report=xml:codecov-python.xml"]

# Directories the broad suite never collects, each for its own reason.
#
#   capsem-recipes   its meta-tests invoke `cargo build --workspace`, which
#                    atomically replaces the codesigned binaries a concurrent
#                    VM test is using
#   capsem-install   also spawns `cargo build -p capsem` from inside pytest;
#                    owned by the install gate, which runs it in Docker
#   capsem-build-chain / capsem-release
#                    artifact and composition suites with their own entrypoints
broad_ignores = [
    "tests/capsem-recipes",
    "tests/capsem-install",
    "tests/capsem-build-chain",
    "tests/capsem-release",
]

# Production has one service and one service-scoped save/restore lock. An
# xdist worker per service does not reproduce that, so these run alone.
host_snapshot_serial = [
    "tests/capsem-mcp/test_state_transitions.py",
    "tests/capsem-service/test_svc_resume_paths.py",
    "tests/capsem-service/test_svc_suspend_corruption.py",
    "tests/capsem-service/test_svc_loop_device_after_resume.py",
]

# Timing probes. They run alone so their numbers measure Capsem rather than
# another benchmark file competing for the same Apple VZ launch budget.
serial_paths = [
    "tests/capsem-serial/",
    "tests/ironbank/test_route_health.py",
    "tests/ironbank/test_route_latency.py",
]
benchmark_baseline = "tests/capsem-serial/test_capsem_bench_baseline.py"
benchmark_deselect = "not test_capsem_bench_baseline"

# Fails closed before collection rather than passing vacuously against a tree
# whose assets were never built.
require_artifacts = "CAPSEM_REQUIRE_ARTIFACTS"
profile_variable = "CAPSEM_TEST_PROFILE"
# The profile every broad proof runs against first. The rest are the
# compatibility axis, and run the VM-owned suites again behind it.
base_profile = "code"
materialized_profiles = "target/config/profiles"
test_manifest = "assets/manifest.json"

[functional]
# The two legacy VM drivers. Neither is pytest, both need a real VM, and both
# take the same three coordinates -- which is why they are here rather than
# spelled out at each of their four call sites.
injection_script = "scripts/injection_test.py"
integration_script = "scripts/integration_test.py"
binary = "target/debug/capsem"
assets_dir = "assets"
config_root = "target/config"
profiles_subdir = "profiles"
# Overridable so a release lane can point the same proof at pulled artifacts
# instead of source-built ones.
binary_variable = "CAPSEM_TEST_BINARY"
assets_variable = "CAPSEM_TEST_ASSETS_DIR"
config_root_variable = "CAPSEM_TEST_CONFIG_ROOT"
assets_dir_variable = "CAPSEM_ASSETS_DIR"

[modules]
# The build-chain suites that need built artifacts. The release-contracts
# module excludes them because it is the cheap composition proof; the artifacts
# module runs exactly them, once the assets exist.
build_chain_artifact_tests = [
    "tests/capsem-build-chain/test_cargo_build.py",
    "tests/capsem-build-chain/test_codesign.py",
    "tests/capsem-build-chain/test_full_chain.py",
    "tests/capsem-build-chain/test_manifest_regen.py",
    "tests/capsem-build-chain/test_materialized_profile_payload.py",
    "tests/capsem-build-chain/test_pack_initrd.py",
]
release_suites = ["tests/capsem-release/", "tests/capsem-build-chain/"]
contract_glob = "tests/test_*contract.py"

# The Rust coverage floor is 63, not 100. Some files -- uninstall, completions
# -- are intentionally at 0% because they are thin shells over OS and CLI
# primitives, and some defensive paths only execute under live VM traffic and
# are covered by the integration suites rather than by unit tests. The floor
# exists to catch "we deleted half the test suite", not to gate an honest
# defensive branch.
rust_coverage = ["cargo", "llvm-cov", "--workspace", "--bins", "--lib", "--tests", "--no-cfg-coverage"]
rust_coverage_floor = "--fail-under-lines=63"

guest_binary_tests = [
    "tests/capsem-bootstrap/test_cross_compile.py",
    "tests/capsem-security/test_binary_perms.py::test_agent_binaries_555",
]

# Release-lane inputs. When these are set the module verifies pulled immutable
# artifacts instead of building source ones.
release_input_dir = "CAPSEM_RELEASE_INPUT_DIR"
release_profile = "CAPSEM_RELEASE_PROFILE"
release_package = "CAPSEM_RELEASE_PACKAGE"
verify_inputs_script = "scripts/verify-release-inputs.py"
prove_profile_assets_script = "scripts/prove-release-profile-assets.py"
glowup_script = "scripts/local-release-glowup.py"
macos_glowup_script = "scripts/macos_release_glowup.py"
macos_glowup_report = "target/macos-tart-glowup/report.json"
macos_report_variable = "CAPSEM_MACOS_NATIVE_GLOWUP_REPORT"
glowup_work_dir = "target/release-module-glowup"
channel_switch_work_dir = "target/release-module-channel-switch"
release_bin_dir = "CAPSEM_RELEASE_BIN_DIR"
default_bin_dir = "target/debug"
# Cleared for the channel-switch run: it has to rediscover the channel from
# the installed state rather than inherit what the previous run was told.
channel_switch_cleared = [
    "CAPSEM_RELEASE_CHANNEL",
    "CAPSEM_RELEASE_TRANSITION",
    "CAPSEM_RELEASE_BEFORE_MANIFEST",
    "CAPSEM_RELEASE_AFTER_MANIFEST",
    "CAPSEM_RELEASE_BEFORE_PACKAGE",
    "CAPSEM_RELEASE_BEFORE_PROFILE_INPUTS",
    "CAPSEM_RELEASE_AFTER_PROFILE_INPUTS",
    "CAPSEM_RELEASE_PROFILE",
    "CAPSEM_RELEASE_CANDIDATE_PROFILE_PUBLICATION",
    "CAPSEM_RELEASE_PUBLICATION_BASE",
]

# ---------------------------------------------------------------------------
# The isolated home a gate run works in
# ---------------------------------------------------------------------------

[prefix]
# A private copy of the checkout, one per run, so what the gate reads cannot be
# edited by anyone while it runs. Clonefiled on APFS: 2074 tracked files plus
# `.git` measured 2.2s and 186 MB, against 84s and 164 GB for a copy that also
# took `target/` -- which is why the seed the first draft of this design wanted
# is not here.
#
# `parent` is deliberately tiny. `tests/test_gate_prefix.py` checks the
# arithmetic, but the budget is `SUN_LEN` 104 minus the gateway's 64-byte
# `instances/<uuid>-ws.sock` suffix; `/tmp/capsem-gate-<32hex>` is 41
# characters and reproduced a 12,024-error socket failure. `~/.cg/<8hex>` is 24.
parent = "~/.cg"
name_length = 8

# How many prefixes survive a sweep. A failed run keeps its tree so it can be
# resumed into, and the *next* run is the one that no longer needs the one
# before -- the same shape as `[workspace] home`, which is wiped on entry
# rather than on exit so a crash leaves something to inspect.
#
# Bounded because they are not small: one retained prefix on this machine was
# 22 GiB, and it carried the copied signing material with it. Nothing else
# reclaims them -- `[disk] reclaimable` only accepts paths inside the checkout.
keep = 1

# Copied wholesale despite being invisible to `git ls-files`, which is what the
# source digest counts. `.git` because build provenance goes through `build.rs`
# and every source-state action shells out to git; `private` because it is
# gitignored (`.gitignore:47`) and holds the Tauri signing keys -- a prefix
# built from the digest set alone loses them, and the package lane finds out
# during a release rather than here.
carried = [".git", "private"]

# What must come back out before the prefix is reclaimed. A release publishes
# from these, and without the export they die with the copy that made them.
exports = ["dist", "packages", "assets", "target/config", "target/gate-runs"]

# ---------------------------------------------------------------------------
# The host-kernel sandbox
# ---------------------------------------------------------------------------
# `(allow default)` narrowed by targeted denials, not `(deny default)` widened
# by enumerated allows. The second was measured and abandoned: every read list
# tried produced a silent SIGABRT with no stdout, no stderr and a kernel denial
# log that needs sudo to read, so each iteration cost a rebuild to learn
# nothing. Denying writes and the network is where the value is anyway.
[sandbox]
command = "sandbox-exec"
linux_command = "bwrap"
# Same scope as the Seatbelt profile: preserve the host filesystem and UNIX
# sockets, but give the whole gate a network namespace with loopback only.
# Docker still answers over /var/run/docker.sock and its daemon may perform the
# explicitly declared container fetches; direct host-gate egress has no route.
linux_args = [
    "--unshare-net",
    "--die-with-parent",
    "--new-session",
    "--bind", "/", "/",
    # A root bind alone leaves device nodes visible but unusable in Bubblewrap's
    # user namespace (`open(/dev/null)` returns EACCES). Preserve the host device
    # mount explicitly so pytest capture and the KVM/vhost VM proofs both work.
    "--dev-bind", "/dev", "/dev",
]
linux_device_mount = "/dev"
# A pre-gate kernel proof, not a marker: only loopback may exist and a numeric
# external connection must fail. The timeout is config-owned so runner/network
# variance is never hidden in a script literal.
linux_probe_loopback_host = "127.0.0.1"
linux_probe_egress_host = "1.1.1.1"
linux_probe_egress_port = 53
linux_probe_timeout_seconds = 1.0
# Ubuntu 24.04 hosted runners can permit user namespaces but deny Bubblewrap's
# loopback RTM_NEWADDR under AppArmor. Only that exact ephemeral-host signature
# may lift the one sysctl, and the complete kernel proof must then pass again.
linux_hosted_failure_marker = "Failed RTM_NEWADDR"
linux_hosted_repair_command = ["sudo", "sysctl", "-w"]
linux_hosted_userns_sysctl = "kernel.apparmor_restrict_unprivileged_userns"
linux_hosted_userns_required_value = 1
linux_hosted_userns_repair_value = 0
profile_name = "gate.sb"

# Three live advisory queries, plus a release's manifest resolution, exact-main
# publication, and workflow dispatch, are irreducibly networked. The plan
# executor remains inside the kernel sandbox; a helper born immediately before
# it accepts only authenticated, explicitly marked commands for those edges.
# The one-time metadata is deleted before the first plan action, so ordinary
# qualification children never inherit the capability.
egress_metadata_variable = "CAPSEM_GATE_EGRESS_METADATA"
egress_socket_template = "/tmp/capsem-egress-{pid}-{nonce}.sock"
egress_metadata_template = ".egress-{pid}-{nonce}.json"
egress_start_timeout = 5.0
egress_stop_timeout = 5.0
egress_max_message_bytes = 8388608

network_reason = "No mid-run fetch. This is the rule the whole profile exists for."
socket_reason = "`(deny network*)` covers AF_UNIX too, so these come back explicitly."

# Absolute or `~`-relative. Denying the Docker socket makes a running daemon
# look absent -- `permission denied ... docker.sock` -- which is how the first
# sandboxed run is misdiagnosed.
sockets = ["~/.colima/default/docker.sock", "~/.colima/_lima/colima/ha.sock"]

# The gate's own sockets are created per run under paths it does not know
# ahead of time, so they are matched by prefix rather than listed.
# Measured, not guessed. One report-mode run named every socket the gate
# actually opens, and three classes were missing from this list -- an
# enforcing run would have died on each in turn, which is precisely the
# forty-runs-one-discovery-each outcome report mode exists to avoid:
#
#   /private/var/folders/<...>/T/capsem-test-<id>/run/*.sock   552 times
#   <prefix>/target/test-home/.capsem/run/service.sock         463 times
#   ~/.colima/_lima/colima/ha.sock                             169 times
#
# The first is `$TMPDIR` on macOS, which is a per-user path under
# `/private/var/folders` and not `/tmp` at all -- the reason a rule naming
# `/tmp/capsem-` looked complete and was not.
local_socket_prefixes = [
    "/tmp/capsem-",
    "/private/tmp/capsem-",
    "/private/var/folders/",
    "/var/folders/",
]

# The gate's own service, gateway and per-VM sockets live under the workspace,
# which is inside the prefix and therefore has no fixed path to list.
local_socket_regexes = ["target/test-home/\\.capsem/run/"]

# Servers the gate starts and talks to: the mock upstream, the gateway, and
# every per-VM listener. `local:*:0` alone was 1915 of the observed events.
local_binds = true

# The service, the gateway and the mock upstream all talk over loopback.
# `localhost` only: SBPL refuses any other host in a network address --
# `sandbox-exec: host must be * or localhost in network address` -- so
# `127.0.0.1:*` is a profile that will not load rather than a narrower rule.
loopback = ["localhost:*"]

# Report mode's collector. `(with report)` permits an operation and writes it
# to the unified log; without something reading that log, report mode measures
# nothing -- which is exactly what a full report-mode gate run produced before
# this existed: an errors.log with zero sandbox entries.
#
# The absolute path is deliberate. `log` is a zsh builtin, so a bare name here
# resolves to the shell's own and fails with `too many arguments`.
log_command = "/usr/bin/log"
report_predicate = 'sender == "Sandbox"'
report_style = "ndjson"
report_log_name = "sandbox-report.ndjson"
# The deduplicated allow-list, written beside the raw capture on release.
report_summary_suffix = ".allowlist.txt"
# Where the streamer's pid is left for the sandboxed process to find. It has to
# be a file: `log` cannot run sandboxed, so the collector is started before the
# re-exec and the resource that stops it lives on the other side of that exec
# with no handle to inherit.
report_pid_suffix = ".pid"
report_stop_timeout = 10.0

[workspace]
# Everything the gate does happens against this home, never the developer's.
# Wiped at the start of a run, which is why the machine lock is taken first and
# why the lockfile lives outside it.
home = "target/test-home/.capsem"
run_dir = "target/test-home/.capsem/run"
# Created up front: the service writes into all three and creating them lazily
# was how a first run differed from every later one.
seeded_dirs = ["run", "sessions", "logs"]

# Deliberately NOT cleared per module. `just test` runs several modules in
# sequence and the VM performance recordings are written by the functional one;
# a later module wiping them is why a fortnight of full gates left this empty
# and froze the published arm64 history. The entry point clears it once.
benchmark_root = "target/test-benchmarks"
coverage_file = "target/coverage/.coverage"

# What a failing run leaves behind, copied out before the run directory goes.
evidence_dir = "target/test-artifacts"

# ---------------------------------------------------------------------------
# The execution log
# ---------------------------------------------------------------------------

[runlog]
# One directory per run, so a failed gate is a directory you attach to a bug
# rather than a scrollback you had to be present for.
root = "target/gate-runs"
events = "run.jsonl"
# Spelled `event_schema` here and emitted as `schema` in each event: a Pydantic
# field named `schema` shadows a BaseModel attribute.
event_schema = "capsem.gate.runlog.v1"
step_log_dir = "steps"
summary = "summary.txt"
# What each run watches for filesystem faults, and where it writes them the
# moment they happen -- not at the end, and not only into `run.jsonl`, because
# a fault nobody sees until someone reads a file is a fault nobody acts on.
# Source trees, because a gate must not edit what it is qualifying; plus the
# staged release channel, because a hardlink *to* checked-in source lands in
# build output and leaves the source directory untouched.
observed_roots = ["config", "crates", "scripts", "guest", "src", "target/web-parity"]
# How Linux answers "what path is this descriptor". `shutil.rmtree` deletes
# through a directory descriptor, so the observer receives a bare entry name
# and has to anchor it -- without this it resolved against the working
# directory, which is the checkout root, and reported tracked files nothing had
# touched. macOS answers the same question through `fcntl(F_GETPATH)`, which
# takes no path to name here.
fd_path_template = "/proc/self/fd/{handle}"
error_log = "errors.log"
# Bounded, because a run that trips one rule per file trips it thousands of
# times and an unbounded fault log on a machine that gates daily is a
# disk-full outage wearing a helpful name. Total stays under
# max_bytes * (keep + 1); the newest faults -- the ones describing the failure
# being looked at -- are the ones kept.
error_log_max_bytes = 4194304
error_log_keep = 3
latest_link = "latest"
# Allocation, rotation and repointing `latest` are serialized on this, briefly.
# Not the machine lock: that is held for a whole gate, and opening a run log
# must not wait for one.
history_lock = ".history.lock"
# Held for the length of a run, so retention can tell a run still being
# written from a crashed one somebody wants to read.
active_marker = ".active"
# Rotation by count and by bytes. A forty-minute gate writes a lot, and the
# machine running it is also the machine building VM images.
keep_runs = 20
keep_bytes = 2_000_000_000
# blake3 because the asset pipeline already speaks it.
artifact_digest = "blake3"
# Actions slower than this are named in the timing summary.
slow_action_seconds = 30
# How much of a failed command's own output is repeated in the error. The whole
# log stays in `steps/`; this is the part that has to be in front of whoever is
# reading the failure, without putting a gigabyte of compiler output in JSONL.
failure_tail_lines = 40

[runlog.timing_regression]
# A release guard, not a stopwatch SLA. Compare complete qualification with
# its latest successful run on the same platform/machine/core count and exact
# graph. Durations come only from those journals: config owns the allowed
# relative increase and how many baseline-ranked slow steps matter, never a
# guessed number of seconds.
maximum_factor = 1.5
slowest_steps = 10

# ---------------------------------------------------------------------------
# Disk the gate is allowed to occupy
# ---------------------------------------------------------------------------

[disk]
# Everything the gate can create, so reclaiming is a policy rather than whoever
# remembers a path. Nothing outside this list may be removed: a guard proves the
# reclaimer cannot reach past it, and the loader rejects an absolute path or a
# `..` so the list cannot be aimed at the wrong tree.
reclaimable = [
    "target/gate-runs",
    "target/test-home",
    "target/image-workspace",
    "target/test-benchmarks",
    "target/linux-rust-coverage",
    "target/install-test-assets",
    "target/release-channel",
    "target/release-module-glowup",
    "target/release-module-channel-switch",
]
# Refuse to start an expensive phase below this, after reclaiming what we can.
# The gate builds two architectures of VM images; running out at minute thirty
# wastes the thirty.
required_free_gb = 60
# Warn when a single run's own footprint passes this.
run_footprint_warn_gb = 40
