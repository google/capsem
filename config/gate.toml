# The build and release gate's data, in one place.
#
# `src/capsem/gate/` holds the decisions; this holds the values those decisions
# are made from -- container names, scratch paths, timeouts, the boundary/rail
# pairs the storage policy accepts, the artifacts an asset build must produce.
#
# It exists because the same values were previously spelled inside whichever
# module happened to need them, which is how the justfile ended up with eleven
# hand-written copies of one storage command and four disagreeing `case` blocks
# over architecture names. A value that lives in one file can be read by the
# code, by the contract tests, and by a person deciding whether to change it.
#
# Loaded through `capsem.gate.config`, which validates it with Pydantic: a
# missing key or a wrong type fails at load with the field named, not deep
# inside a forty-minute run.
version = 1

# ---------------------------------------------------------------------------
# Architectures
# ---------------------------------------------------------------------------
# One target under every name some tool insists on. `uname -m` says aarch64,
# the assets tree says arm64, dpkg says arm64 for ARM but amd64 for Intel, and
# rustc wants a full triple.

# `/usr/lib/<gnu>/pkgconfig` is where every multiarch cross toolchain puts its
# `.pc` files; the tuple is the only part that varies.
pkg_config_template = "/usr/lib/{gnu}/pkgconfig:/usr/share/pkgconfig"

[architectures.arm64]
rust_target = "aarch64-unknown-linux-gnu"
dpkg = "arm64"
gnu = "aarch64-linux-gnu"
aliases = ["arm64", "aarch64"]

[architectures.x86_64]
rust_target = "x86_64-unknown-linux-gnu"
dpkg = "amd64"
gnu = "x86_64-linux-gnu"
aliases = ["x86_64", "amd64"]

# ---------------------------------------------------------------------------
# Docker storage
# ---------------------------------------------------------------------------

[storage]
policy_script = "scripts/docker-storage-policy.py"
ensure_space_script = "scripts/ensure-docker-space.sh"

# Points at which storage held for a finished rail may be released, and the
# rail whose headroom that release serves. Eleven recipes used to spell these
# pairs by hand, so the legal set existed only as a habit.
[storage.phases]
completed-linux-rust-target = { boundary = "after-linux-rust", rail = "assets" }
completed-docker-rails = { boundary = "after-assets", rail = "package" }
completed-buildkit-graph = { boundary = "after-packages", rail = "package" }
completed-package-arm64 = { boundary = "after-package-arm64", rail = "install" }
completed-package-x86_64 = { boundary = "after-package-x86_64", rail = "install" }
deferred-install-target = { boundary = "before-packages", rail = "package" }
candidate-boundary = { boundary = "candidate-boundary", rail = "default" }
after-install = { boundary = "after-install", rail = "install" }
linux-rust-builder = { boundary = "after-linux-rust-builder", rail = "install-preflight" }
install-preflight = { boundary = "after-install-preflight", rail = "install-preflight" }

# ---------------------------------------------------------------------------
# Stopping gate-owned daemons
# ---------------------------------------------------------------------------

[doctor]
storage_policy = "config/storage-policy.toml"

[pidfiles]
# Ordered. The gateway owns the fixed localhost port, so it must stop before
# the service -- otherwise the next profile attaches to an orphan gateway whose
# UDS points at a deleted run directory.
names = ["gateway.pid", "service.pid"]
term_wait_seconds = 2.0
kill_wait_seconds = 1.0
poll_interval_seconds = 0.1
# Linux reports process state here. A zombie answers `kill -0` until someone
# waits on it, so liveness needs more than the signal.
proc_stat_template = "/proc/{pid}/stat"

# ---------------------------------------------------------------------------
# The native install and glow-up proof
# ---------------------------------------------------------------------------

[install]
container = "capsem-install-test"
image = "capsem-install-test"
dockerfile = "docker/Dockerfile.install-test"
venv = "/home/capsem/.venv-install-test"
mount = "/src"
channel = "local"
manifest_version = "1.0.0"

systemd_ready_attempts = 30
systemd_ready_interval_seconds = 0.5
serve_ready_file = "/tmp/capsem-install-release.json"
serve_ready_attempts = 100
serve_ready_interval_seconds = 0.05

# Present and writable means this host can boot a real guest, and the glow-up
# runs complete rather than packaging-only.
vm_devices = ["/dev/kvm", "/dev/vhost-vsock"]
optional_vm_devices = ["/dev/vsock"]
rosetta_binfmt = "/proc/sys/fs/binfmt_misc/rosetta"

# Where the extracted-but-not-installed package lands. Deliberately not
# /usr/bin: nothing that authors the release graph may depend on the package
# under test having been installed first.
# What a systemd container is, wherever one is started.
systemd_command = "/usr/lib/systemd/systemd"
cgroup_path = "/sys/fs/cgroup"
tmpfs_paths = ["/run", "/tmp"]

# Where an installed package puts things, and what the runtime calls them.
bin_dir = "/usr/bin"
installed_capsem = "/usr/bin/capsem"
capsem_home = ".capsem"
manifest_name = "manifest.json"
sbom_name = "capsem-sbom.spdx.json"
candidate_prefix = "v"
file_url_scheme = "file://"
release_site_dir = "release-site"
storage_ledger = "target/storage"
test_output_root = "/tmp/capsem-test-output"

preinstall_root = "/tmp/capsem-preinstall"
admin_relative = "usr/bin/capsem-admin"
request_script = "scripts/install-manifest-request.sh"

# The authoritative release graph, and the legacy runtime projection an
# operator can mistake for it. Handing the installer the second produces an
# install that looks fine and carries the wrong manifest.
graph_manifest = "assets/local/manifest.json"
legacy_projection = "manifest.json"

# The unprivileged user the container runs proofs as. Every one of these paths
# has to stay off the bind mount: /src belongs to the host uid, so anything
# written there by `capsem` fails with EACCES on Linux and only on Linux.
[install.guest_user]
name = "capsem"
home = "/home/capsem"
runtime_dir = "/run/user/1000"
tmp = "/home/capsem/tmp"
pytest_cache = "/home/capsem/.pytest_cache"
asset_manifest = "/home/capsem/.capsem/assets/manifest.json"

# The suite proving the installed package, run from inside the container.
[install.suite]
path = "tests/capsem-install/"
glowup_script = "scripts/local-release-glowup.py"
macos_report_check = "scripts/check-macos-native-glowup.py"
stage_inputs_script = "scripts/stage-release-test-inputs.py"
serve_script = "scripts/serve-release-test-root.py"
sbom_script = "scripts/generate-host-binary-sbom.py"
web_surface_script = "scripts/check-web-surface.sh"
# The Debian package name, as dpkg-query reports it.
package_name = "capsem"

# Scratch, all under target/ so a failed run leaves evidence without dirtying
# the checkout.
[install.layout]
assets = "target/install-test-assets"
config = "target/install-test-config"
channel = "target/install-test-channel"
packages = "target/install-test-packages"
glowup = "target/local-release-glowup"

# Written by the container as its own user, and handed back on the way out.
extra_owned_paths = ["release-site/node_modules", "release-site/dist"]

# Named so the release-site build does not reinstall its dependencies every run
# or write them into the bind-mounted checkout.
[[install.volumes]]
source = "capsem-install-release-site-node-modules"
target = "/src/release-site/node_modules"

[[install.volumes]]
source = "capsem-install-release-site-dist"
target = "/src/release-site/dist"

# ---------------------------------------------------------------------------
# The Linux package rail
# ---------------------------------------------------------------------------

[package]
builder_image = "capsem-host-builder:latest"
build_script = "scripts/build-linux-package.sh"
proof_selector = "scripts/select-linux-deb-proof.sh"
# The sidecar a release lane stages beside its manifest.
release_inputs_name = "release-inputs.json"
default_manifest_url = "https://release.capsem.org/assets/stable/manifest.json"
channels = ["stable", "nightly", "corp"]
default_channel = "stable"
toolchain_pin = "rust-toolchain.toml"
clock_script = "scripts/sync-container-clock.py"
cargo_target_mount = "/cargo-target"
package_suffix = ".deb"
dist_dir = "dist"
# Per-architecture, so alternating targets does not rebuild the world.
target_volume = "capsem-host-target-{arch}"

# Installing the exact package into a clean systemd container and proving it
# works: every binary present and reporting the package's own version, the
# service and gateway up, every profile ready, and a real guest shell.
[package.proof]
container = "capsem-qualified-deb-proof"
systemd_ready_attempts = 60
verify_script = "scripts/verify-installed-release.py"
shell_proof_script = "scripts/prove-installed-shell.py"
shell_marker = "CAPSEM_QUALIFIED_DEB_SHELL_OK"
session_name = "qualification-exact-deb-shell"
shell_timeout_seconds = 300

# Every binary the package must install. Each reports the package version
# except capsem-app, which is the Tauri bundle and has no --version.
binaries = [
    "capsem",
    "capsem-admin",
    "capsem-app",
    "capsem-gateway",
    "capsem-mcp",
    "capsem-mcp-aggregator",
    "capsem-mcp-builtin",
    "capsem-process",
    "capsem-service",
    "capsem-tray",
    "capsem-tui",
    "capsem-mock-server",
    "capsem-bench-rs",
]
binaries_without_version = ["capsem-app"]

# `capsem status` lines that must be present. A package that installs and then
# cannot start its own service passes every file-existence check.
status_requires = [
    "Installed: true",
    "Running:   true",
    "Service:   ok",
    "Gateway:   ok",
]

# Shared across every package build, so the second architecture reuses the
# first's downloads instead of refetching the index.
[[package.volumes]]
source = "capsem-cargo-registry"
target = "/usr/local/cargo/registry"

[[package.volumes]]
source = "capsem-cargo-git"
target = "/usr/local/cargo/git"

[[package.volumes]]
source = "capsem-rustup"
target = "/usr/local/rustup"

# ---------------------------------------------------------------------------
# The VM asset build and boot gate
# ---------------------------------------------------------------------------

[assets]
test_root = "target/ironbank-assets"
profiles_glob = "config/profiles/*/profile.toml"

# A build that exits zero having produced none of these is the failure worth
# naming here rather than much later, inside a VM boot.
required_artifacts = [
    "vmlinuz",
    "initrd.img",
    "rootfs.erofs",
    "obom.cdx.json",
    "software-inventory.json",
]
failure_tail_lines = 200
shell_proof_timeout_seconds = 300

# `cargo run` rather than a built binary: the asset gate runs before anything
# has installed one, and the admin under test is this checkout's.
admin_command = ["cargo", "run", "-p", "capsem-admin", "--"]
capsem_binary = "target/debug/capsem"
hash_assets_script = "scripts/create_hash_assets.py"
shell_proof_script = "scripts/prove-installed-shell.py"
container_cleanup_script = "scripts/cleanup-docker-containers-by-mount.sh"

# Docker must be able to execute the *other* architecture before any lane
# starts, or the second lane fails an hour in with an exec format error.
cross_platform_probe_image = "debian:bookworm-slim"
cross_platform_prefix = "linux/"
cross_platform_probe_command = "/bin/true"
merged_assets_dir = "assets"
merged_config_dir = "config"
profile_home_dir = "home"
failure_evidence_dir = "run-failure"
# The subdirectory `capsem-admin profile materialize` writes into.
materialized_profiles_dir = "profiles"
# The alias the image builders repoint at whichever architecture they built last.
current_link = "current"

# Copied out of a failed run before its scratch is removed. Host-side
# diagnostics only: `guest/` and `auto_snapshots/` duplicate the guest's own
# workspace once per generation, and the same filter keeps the VM disk image
# and session.db out of target/.
evidence_suffixes = [".log", ".json", ".toml"]
evidence_prune_dirs = ["guest", "auto_snapshots"]
# AF_UNIX paths must stay under macOS SUN_LEN once the gateway appends its
# session path, and target/ironbank-assets is already too long.
run_dir_template = "/tmp/capsem-a.XXXXXX"

# ---------------------------------------------------------------------------
# The candidate gate
# ---------------------------------------------------------------------------

[candidate]
# macOS sleeps an unattended machine mid-gate, and a forty-minute run that dies
# at minute thirty proves nothing.
keep_awake_command = ["caffeinate", "-dimsu"]
keep_awake_marker = "CAPSEM_TEST_CAFFEINATED"

source_digest_script = "scripts/source-state-digest.py"
orphan_script = "scripts/check-orphan-processes.py"
colima_wrapper = "scripts/with-gate-colima.sh"

# Modules, in the order `just test` runs them. The fast one first: its failures
# come back in minutes rather than after the Docker and VM work.
fast_module = "_test-fast"
candidate_module = "_test-candidate"

# ---------------------------------------------------------------------------
# Version stamping
# ---------------------------------------------------------------------------
# Files carrying a copy of the workspace version. Cargo.lock and uv.lock are
# absent on purpose: their copies are refreshed by the tools that own them.

[versions]
# The one authority: a human decision, recorded here and fanned out.
cargo_manifest = "Cargo.toml"
tag_prefix = "refs/tags/v"

[[versions.stamped]]
path = "crates/capsem-app/tauri.conf.json"
kind = "json_key"
key = "version"

[[versions.stamped]]
path = "pyproject.toml"
kind = "toml_key"
key = "version"

# ---------------------------------------------------------------------------
# Python source gates
# ---------------------------------------------------------------------------

[lint]
python_roots = ["src", "scripts", "tests", "guest"]
# Already passes every rule, and must keep doing so.
strict_roots = ["src"]
# A ty warning exits zero, so without this a warning-level rule on the ratchet
# could never be detected as fixed.
ty_flags = ["--error-on-warning"]

# Rules held back outside strict_roots. Roughly four hundred diagnostics,
# dominated by inference over untyped fixture data: `json.load` returning
# `object` and then being subscripted, `helpers.*` imports that resolve only
# through conftest's sys.path wiring. Every rule NOT listed here is enforced on
# those trees today, which is four hundred more than when ty ran on
# src/capsem alone.
#
# A ratchet: entries may leave, nothing may join. tests/test_gate_boundary.py
# fails when a rule listed here no longer fires.
ty_ratchet = [
    "call-top-callable",
    "invalid-argument-type",
    "invalid-assignment",
    "invalid-attribute-override",
    "invalid-method-override",
    "invalid-return-type",
    "no-matching-overload",
    "not-iterable",
    "not-subscriptable",
    "possibly-missing-submodule",
    "unknown-argument",
    "unresolved-attribute",
    "unresolved-import",
    "unsupported-operator",
    "unused-ignore-comment",
    "unused-type-ignore-comment",
]

# ---------------------------------------------------------------------------
# The justfile/package boundary
# ---------------------------------------------------------------------------

[boundary]
# A recipe body over this many executable lines is inline logic, and a gate
# module over its ceiling is the 2000-line justfile growing back in Python.
max_recipe_lines = 12
max_module_lines = 300

# Recipe bodies that are still inline shell, pending extraction. A ratchet, not
# an exemption list: a recipe may leave it, nothing may join it, and one that
# has been extracted must be struck from it so the list cannot describe a past
# that is no longer true.
remaining_shell_recipes = [
    "_build-assets",
    "_build-host-image",
    "_build-image-template",
    "_build-kernel",
    "_build-rootfs",
    "_build-ui",
    "_check-assets",
    "_check-generated-settings",
    "_dev-ui",
    "_ensure-dev-ready",
    "_ensure-service",
    "_gate-host-package-sbom",
    "_gate-linux-rust",
    "_generate-settings",
    "_install-tools",
    "_materialize-config",
    "_pack-initrd",
    "_sign",
    "_sign-release",
    "_test-candidate-run",
    "_test-functional",
    "dev",
    "exec",
    "logs",
    "release-binaries",
    "release-profile",
    "shell",
    "smoke",
]

# Shell control flow in a body with no shebang is still a program no test can
# reach: `just` hands each line to a shell, so a `for` loop spread across
# continuations runs untested.
shell_control_flow = ["if ", "for ", "while ", "case ", "until ", "trap "]
recipes_with_inline_control_flow = ["_pnpm-install"]

# The only modules allowed to touch the machine directly. Each owns one piece
# of machine state as its entire purpose, so there is no gate work here for a
# dry run to show and routing it through an action would be ceremony.
#
#   fileactions  the filesystem primitives themselves
#   proc         the single funnel every invocation passes through, and so the
#                one place the run log has to hook
#   pidfiles     where a signal is sent, so "which process did the gate kill"
#                has a single answer
#   locks        the lockfile that makes one gate per machine true, which has
#                to be placed before any workspace exists to put it in
#   runlog       the run directory itself, which cannot be written through
#                actions because actions report into it
#   runhistory   reclaiming those directories, for the same reason
#
# The through-line: these are the harness, and the harness is what gate work is
# expressed *in*. Anything built on top of it -- a capability, a command -- goes
# through actions, or its work is invisible to the dry run and the log.
#
# Widening this is a design decision, not a convenience.
direct_machine_access = [
    "fileactions.py",
    "proc.py",
    "pidfiles.py",
    "locks.py",
    "runlog.py",
    "runhistory.py",
]

# Only the plan schedules concurrent work. A module that reaches for its own
# thread pool has parallelism the graph cannot see -- and therefore parallelism
# the exclusives cannot constrain, which is exactly what seven bare `&` in one
# recipe body were.
direct_concurrency = ["plan.py"]

# Modules that still reach past the primitives, pending extraction onto them.
# Work that goes around `actions`/`fileactions` is work the dry run cannot show
# and the run log cannot time.
#
# A ratchet, not an exemption list: a module may leave it, nothing may join it,
# and one that has been extracted must be struck so the list cannot describe a
# past that is no longer true.
modules_bypassing_primitives = [
    "assetlanes.py",
    "assets.py",
    "crosscompile.py",
    "doctor.py",
    "install.py",
    "versions.py",
]

# ---------------------------------------------------------------------------
# What may not run beside what
# ---------------------------------------------------------------------------

# Each entry names one thing only one step may hold at a time, and why. The
# reason is the point. Written as `&` and `wait`, this knowledge lived in shell
# comments -- seven backgrounded jobs in `_test-candidate-run` and three more in
# `smoke`, with nothing to stop an eighth from violating a constraint recorded
# three hundred lines away.
#
# A step names what it contends for; the plan gives each name a lock. Two
# claimants of one entry can never overlap, and claimants of different entries
# still do.

[execution.exclusives.apple_vz]
reason = "two benchmark files launching VMs at once measure each other, not Capsem"

[execution.exclusives.host_service]
reason = "production has one service and one service-scoped snapshot lock; an xdist worker per service does not reproduce that"

[execution.exclusives.workspace_binaries]
reason = "cargo build --workspace atomically replaces the binaries a running VM test is using"

[execution.exclusives.docker_daemon]
reason = "the storage rails reserve and release a single daemon's disk budget"

# ---------------------------------------------------------------------------
# One gate per machine
# ---------------------------------------------------------------------------

[locks.gate]
# Deliberately outside every tree the gate wipes. The run takes this lock and
# *then* removes CAPSEM_HOME, so a lockfile living inside it would be deleted
# while held -- and the next run would take a lock on a fresh inode and start
# beside the first.
path = "target/capsem-test-execution.lock"
# flock, not a pidfile: the kernel releases it when the holder dies, so there is
# no stale-lock heuristic to get wrong. The holder writes who it is here so
# contention can name it.
holder_record = "target/capsem-test-execution.holder"
# Report the holder rather than blocking mutely. Someone who left `just test`
# running in another terminal deserves to be told that, not to watch a cursor.
report_after_seconds = 2
wait_timeout_seconds = 7200
poll_interval_seconds = 0.25

# ---------------------------------------------------------------------------
# The execution log
# ---------------------------------------------------------------------------

[runlog]
# One directory per run, so a failed gate is a directory you attach to a bug
# rather than a scrollback you had to be present for.
root = "target/gate-runs"
events = "run.jsonl"
# Spelled `event_schema` here and emitted as `schema` in each event: a Pydantic
# field named `schema` shadows a BaseModel attribute.
event_schema = "capsem.gate.runlog.v1"
step_log_dir = "steps"
summary = "summary.txt"
latest_link = "latest"
# Rotation by count and by bytes. A forty-minute gate writes a lot, and the
# machine running it is also the machine building VM images.
keep_runs = 20
keep_bytes = 2_000_000_000
# blake3 because the asset pipeline already speaks it.
artifact_digest = "blake3"
# Actions slower than this are named in the timing summary.
slow_action_seconds = 30

# ---------------------------------------------------------------------------
# Disk the gate is allowed to occupy
# ---------------------------------------------------------------------------

[disk]
# Everything the gate can create, so reclaiming is a policy rather than whoever
# remembers a path. Nothing outside this list may be removed: a guard proves the
# reclaimer cannot reach past it, and the loader rejects an absolute path or a
# `..` so the list cannot be aimed at the wrong tree.
reclaimable = [
    "target/gate-runs",
    "target/test-home",
    "target/image-workspace",
    "target/test-benchmarks",
    "target/linux-rust-coverage",
    "target/install-test-assets",
    "target/release-channel",
    "target/release-module-glowup",
    "target/release-module-channel-switch",
]
# Refuse to start an expensive phase below this, after reclaiming what we can.
# The gate builds two architectures of VM images; running out at minute thirty
# wastes the thirty.
required_free_gb = 60
# Warn when a single run's own footprint passes this.
run_footprint_warn_gb = 40
