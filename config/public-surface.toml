# Exact public surfaces. Changes require explicit product/API approval.
# The contract test checks both this allowlist and the declared count so a
# drive-by addition, deletion, rename, or stale count fails closed.

[just]
count = 24
approved = [
  # Measuring is a public verb now. It had no entry point at all: nine
  # Criterion targets existed and nothing ran them, and a release failed on a
  # gateway CPU figure no run had ever recorded.
  "bench",
  "bench-quick",
  "bench-report",
  "build",
  "build-all",
  "build-assets",
  "build-docs",
  "cache",
  "dev",
  "doctor",
  "exec",
  "fast-test",
  "focus-test",
  "install",
  "logs",
  "qualify-assets",
  "qualify-binaries",
  "release-assets",
  "release-binaries",
  # Replays a release qualification lane against a cohort built here, so the
  # layout a release runs under is reachable without dispatching one.
  "replay-release-lane",
  "run-service",
  "shell",
  "test",
  "test-linux-rust",
]

